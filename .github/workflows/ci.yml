name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  drift-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tools/drift -v

  provider-schema-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        provider: [aws, azure, gcp, cloudflare]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install checksum-pinned Terraform from HashiCorp
        run: |
          curl --fail --location --retry 2 --max-time 120 \
            https://releases.hashicorp.com/terraform/1.14.5/terraform_1.14.5_linux_amd64.zip \
            -o "$RUNNER_TEMP/terraform.zip"
          printf 'ac21c2b9dcd115711f540cbd27ead0596bb4288a917cb56dfa9b25edb3eb6280  %s\n' "$RUNNER_TEMP/terraform.zip" | sha256sum --check -
          unzip -q "$RUNNER_TEMP/terraform.zip" -d "$RUNNER_TEMP/drift-terraform"
          echo "$RUNNER_TEMP/drift-terraform" >> "$GITHUB_PATH"
      - name: Verify checksum-locked official resource schemas
        run: python3 tools/drift/smoke.py "${{ matrix.provider }}" --out ".drift/smoke-${{ matrix.provider }}.json"
      - name: Keep schema verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-schema-${{ matrix.provider }}
          path: .drift/smoke-${{ matrix.provider }}.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - run: go test ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Build the engine and the UI (includes the type check)
        run: pnpm run build
        working-directory: web

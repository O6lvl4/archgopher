name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Vulnerabilities are published after the code is written: re-check weekly.
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
      - run: go vet ./...
      # Tools are pinned by the tool directive in go.mod, so a new release
      # never changes the result without a pull request that says so.
      - run: go tool staticcheck ./...
      - run: go test -shuffle=on ./...

  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go tool govulncheck ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Build the engine and the UI (includes the type check)
        run: pnpm run build
        working-directory: web

name: Habit tracker paid per use (fictional example)
region: ap-northeast-1
nodes:
  - id: people
    type: entry
    traffic:
      users: { count: 20000, actions: 12, per: day }
      hours: "7-23"
    note: People check off habits and look at their streaks through the day.
  - id: api
    type: aws_apigatewayv2_api
  - id: handler
    type: aws_lambda_function
    attributes:
      memory_size: 256
      architectures: [arm64]
    assumptions:
      durationMs: 60
  - id: habits
    type: aws_dynamodb_table
    attributes:
      billing_mode: PAY_PER_REQUEST
    assumptions:
      itemSizeKb: 1
      storageGb: 2
  - id: photos
    type: aws_s3_bucket
    assumptions:
      storageGb: 20
    note: A photo now and then as proof of a habit.
edges:
  - { from: people, to: api, note: "Every action is one API call" }
  - { from: api, to: handler }
  - { from: handler, to: habits, kind: read, note: "Every call reads the person's habits" }
  - { from: handler, to: habits, kind: write, perUnit: 0.3, note: "About a third of the calls check something off" }
  - { from: handler, to: photos, kind: write, perUnit: 0.02, kb: 400 }

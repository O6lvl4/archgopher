name: Notes app (fictional example)
region: ap-northeast-1
nodes:
  - id: users
    type: entry
    load:
      monthly: 30000000
      peakPerSecond: 120
    note: 30 million page and API requests a month; peak is about 10x the average.
  - id: api
    type: aws_api_gateway_rest_api
    address: aws_api_gateway_rest_api.api
  - id: web
    type: aws_cloudfront_distribution
    address: aws_cloudfront_distribution.web
    assumptions:
      responseKb: 40
  - id: cleanup
    type: aws_cloudwatch_event_rule
    address: aws_cloudwatch_event_rule.cleanup
    load:
      monthly: 730
      peakPerSecond: 0.0002777777777777778
    note: Load from rate(1 hour).
  - id: notes
    type: aws_dynamodb_table
    address: aws_dynamodb_table.notes
    attributes:
      billing_mode: PAY_PER_REQUEST
    assumptions:
      itemSizeKb: 2
      storageGb: 20
  - id: assets
    type: aws_s3_bucket
    address: aws_s3_bucket.assets
    assumptions:
      storageGb: 5
  - id: exports
    type: aws_s3_bucket
    address: aws_s3_bucket.exports
    assumptions:
      storageGb: 300
  - id: exports-sqs
    type: aws_sqs_queue
    address: aws_sqs_queue.exports
  - id: api_handler
    type: aws_lambda_function
    address: module.api_handler.aws_lambda_function.this
    attributes:
      architectures:
        - arm64
      memory_size: 512
    assumptions:
      durationMs: 120
      latencyP50Ms: 60
      latencyP99Ms: 400
  - id: cleanup-lambda
    type: aws_lambda_function
    address: module.cleanup.aws_lambda_function.this
    attributes:
      architectures:
        - x86_64
      memory_size: 256
    assumptions:
      durationMs: 20000
  - id: summarizer
    type: bedrock_model
    assumptions:
      cacheReadShare: 0.6
      inputTokensPerCall: 2000
      latencyP50Ms: 900
      latencyP99Ms: 3000
      model: claude-haiku-4-5
      outputTokensPerCall: 300
    note: Not in Terraform. Summarizes a note on save; placed by hand and kept across tf --merge.
  - id: exporter
    type: aws_lambda_function
    address: module.exporter.aws_lambda_function.this
    attributes:
      architectures:
        - x86_64
      memory_size: 1024
    assumptions:
      durationMs: 3000
edges:
  - from: users
    to: web
  - from: web
    to: assets
    perUnit: 0.6
    note: Static assets; CloudFront serves the rest from cache.
  - from: web
    to: api
    perUnit: 0.4
  - from: api
    to: api_handler
  - from: api_handler
    to: notes
    kind: read
  - from: api_handler
    to: notes
    kind: write
    perUnit: 0.2
  - from: api_handler
    to: summarizer
    perUnit: 0.05
    note: Only saves of long notes are summarized.
  - from: api_handler
    to: exports-sqs
    kind: send
    perUnit: 0.001
  - from: exports-sqs
    to: exporter
  - from: exporter
    to: exports
    kind: write
  - from: cleanup
    to: cleanup-lambda
  - from: cleanup-lambda
    to: notes
    kind: read
    perUnit: 2000
    note: Each run scans for expired notes.
  - from: cleanup-lambda
    to: notes
    kind: write
    perUnit: 50

# Worked examples: given these values and this load, the resource reads this.
# Expected values are computed by hand from the unit prices, not taken from the engine.
- name: general-purpose CA issuing 15,000 certificates (ap-northeast-1)
  region: ap-northeast-1
  demand:
    issue:
      monthly: 15000
      peak: 2
  # $400 + 1,000 × $0.75 + 9,000 × $0.35 + 5,000 × $0.001
  costs:
    Private CA (general-purpose): 400
    Certificates (first 1000): 750
    Certificates (next 9000): 3150
    Certificates (over 10000): 5
  limits:
    IssueCertificate rate: 2
- name: short-lived CA with OCSP (us-east-1)
  region: us-east-1
  attributes:
    usage_mode: SHORT_LIVED_CERTIFICATE
    ocsp: true
  assumptions:
    certificatesPerMonth: 2000
    ocspCertificates: 5000
    ocspQueriesPerMonth: 1e+06
  demand:
    issue:
      monthly: 0
      peak: 0
  # $50 + 2,000 × $0.058; 5,000 certificates × $0.06; 1e6 queries × $0.20 per 100,000
  costs:
    Private CA (short-lived): 50
    Certificates (short-lived): 116
    OCSP responses: 300
    OCSP queries: 2
  limits:
    IssueCertificate rate: 0

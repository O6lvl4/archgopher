# Worked examples: given these values and this load, the resource reads this.
# Expected values are computed by hand from the unit prices, not taken from the engine.
- name: 10 million requests of 8 KB to us-east-1 (ap-northeast-1)
  region: ap-northeast-1
  attributes:
    peer_region: us-east-1
  assumptions:
    kbPerUnit: 8
  demand:
    traffic:
      monthly: 1e+07
      peak: 50
  # 730 h × $0.07; 1e7 × 8 KB = 76.2939453125 GB × $0.09 Tokyo to N. Virginia; 50/s × 8 KB × 8 bit
  costs:
    Attachment hours: 51.1
    Data sent to us-east-1: 6.866455078125
  limits:
    Bandwidth per zone: 0.0030517578125
- name: 500 GB of replication to ap-northeast-1 (us-east-1)
  region: us-east-1
  attributes:
    peer_region: ap-northeast-1
  assumptions:
    gbPerMonth: 500
  demand:
    traffic:
      monthly: 0
      peak: 0
  # 730 h × $0.05; 500 GB × $0.02 N. Virginia to Tokyo
  costs:
    Attachment hours: 36.5
    Data sent to ap-northeast-1: 10.0
  limits:
    Bandwidth per zone: 0
- name: peering within the region sends nothing between regions (us-east-1)
  region: us-east-1
  attributes:
    peer_region: us-east-1
  assumptions:
    gbPerMonth: 500
  demand:
    traffic:
      monthly: 0
      peak: 0
  costs:
    Attachment hours: 36.5
  limits:
    Bandwidth per zone: 0

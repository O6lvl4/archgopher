# Worked examples: given these values and this load, the resource reads this.
# Monthly USD per cost line, peak demand per limit. After an intended change:
#   go test ./provider/aws -update
- name: standard (ap-northeast-1)
  region: ap-northeast-1
  attributes: { instance_class: db.r6g.large }
  costs:
    Instance (db.r6g.large, standard): 231.629
- name: I/O-Optimized (us-east-1)
  region: us-east-1
  attributes: { instance_class: db.r6g.large }
  assumptions: { ioOptimized: true }
  costs:
    Instance (db.r6g.large, I/O-Optimized): 211.335
- name: burstable with surplus credits (us-east-1)
  region: us-east-1
  attributes: { instance_class: db.t4g.medium }
  assumptions: { cpuCreditVcpuHours: 10 }
  costs:
    Instance (db.t4g.medium, standard): 55.2318
    CPU credits (db.t4g): 0.9
- name: serverless (ap-northeast-1)
  region: ap-northeast-1
  attributes: { instance_class: db.serverless }
  assumptions: { averageDcu: 4 }
  costs:
    Serverless capacity: 289.664
- name: serverless without averageDcu (us-east-1)
  region: us-east-1
  attributes: { instance_class: db.serverless }
  error: averageDcu is required

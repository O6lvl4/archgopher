# Worked examples: given these values and this load, the resource reads this.
# Expected values are computed by hand from the unit prices, not taken from the engine.
- name: one accelerator (ap-northeast-1)
  region: ap-northeast-1
  demand:
    request:
      monthly: 1e+07
      peak: 50
  # 730 h × $0.025, the same everywhere
  costs:
    Fixed fee: 18.25
- name: idle accelerator still pays (us-east-1)
  region: us-east-1
  demand:
    request:
      monthly: 0
      peak: 0
  costs:
    Fixed fee: 18.25

type: aws_api_gateway_rest_api
label: API Gateway (REST)
category: Edge
icon: api-gateway
description: "Requests in volume tiers from 333 million, 1 billion and 20 billion a month, counted over every REST API of the account in the region. Headroom is the account throttle shared by every API in the region."
kinds: [request]
sla: aws.apigateway
readings:
  - requests: { name: Requests, price: aws.apigateway.rest.requests, count: total.monthly }
  - rate: { name: Account throttle, unit: requests/second, quota: aws.apigateway.account_rps, peak: total.peak }
terraform:
  frontDoor: true
  links:
    - { type: aws_api_gateway_integration, from: rest_api_id, to: [uri] }
  aliases: { aws_api_gateway_deployment: rest_api_id }

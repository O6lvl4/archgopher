# Worked examples: given these values and this load, the resource reads this.
# Monthly USD per cost line, peak demand per limit. After an intended change:
#   go test ./provider/aws -run TestCases -update
- name: requests (us-east-1)
  region: us-east-1
  demand:
    request:
        monthly: 2e+06
        peak: 40
  costs:
    Requests: 7
  limits:
    Account throttle: 40
- name: requests (ap-northeast-1)
  region: ap-northeast-1
  demand:
    request:
        monthly: 2e+06
        peak: 40
  costs:
    Requests: 8.5
  limits:
    Account throttle: 40

# Worked examples: given these values and this load, the resource reads this.
# Monthly USD per cost line, peak demand per limit. After an intended change:
#   go test ./provider/aws -run TestCases -update
- name: requests (us-east-1)
  region: us-east-1
  demand:
    request:
        monthly: 2e+06
        peak: 40
  costs:
    Requests: 7
  limits:
    Account throttle: 40
- name: requests (ap-northeast-1)
  region: ap-northeast-1
  demand:
    request:
        monthly: 2e+06
        peak: 40
  costs:
    Requests: 8.5
  limits:
    Account throttle: 40
# Over the first tier: 333M × 3.5/1e6 = 1165.5; (1e9 − 333M) = 667M × 2.8/1e6 = 1867.6;
# (1.5e9 − 1e9) = 500M × 2.38/1e6 = 1190.
- name: requests past two volume tiers (us-east-1)
  region: us-east-1
  demand:
    request:
        monthly: 1.5e+09
        peak: 40
  costs:
    Requests: 1165.5
    Requests (next 667 million): 1867.6
    Requests (next 19 billion): 1190
  limits:
    Account throttle: 40
# ap-southeast-2 has no 333M break: its 333M–1B band is still 3.5/1e6. 333M × 3.5/1e6 = 1165.5; 267M × 3.5/1e6 = 934.5.
- name: requests in the second band (ap-southeast-2)
  region: ap-southeast-2
  demand:
    request:
        monthly: 6e+08
        peak: 40
  costs:
    Requests: 1165.5
    Requests (next 667 million): 934.5
  limits:
    Account throttle: 40

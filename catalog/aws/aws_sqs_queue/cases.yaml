# Worked examples: given these values and this load, the resource reads this.
# Monthly USD per cost line, peak demand per limit. After an intended change:
#   go test ./provider/aws -run TestCases -update
- name: standard, 100 KB messages (us-east-1)
  region: us-east-1
  assumptions:
    messageKb: 100
  demand:
    send:
      monthly: 2e+06
      peak: 40
  # 2e6 × 2 chunks × 3 = 12e6 requests × 0.4 / 1e6 = 4.8.
  costs:
    Requests: 4.8
- name: FIFO (us-east-1)
  region: us-east-1
  attributes:
    fifo_queue: true
  assumptions:
    requestsPerMessage: 2
  demand:
    send:
      monthly: 2e+06
      peak: 40
  # 2e6 × 2 = 4e6 requests × 0.5 / 1e6 = 2.
  costs:
    Requests: 2
  limits:
    FIFO send rate: 40
- name: standard, 100 KB messages (ap-northeast-1)
  region: ap-northeast-1
  assumptions:
    messageKb: 100
  demand:
    send:
      monthly: 2e+06
      peak: 40
  # 2e6 × 2 chunks × 3 = 12e6 requests × 0.4 / 1e6 = 4.8.
  costs:
    Requests: 4.8
- name: FIFO (ap-northeast-1)
  region: ap-northeast-1
  attributes:
    fifo_queue: true
  assumptions:
    requestsPerMessage: 2
  demand:
    send:
      monthly: 2e+06
      peak: 40
  # 2e6 × 2 = 4e6 requests × 0.5 / 1e6 = 2.
  costs:
    Requests: 2
  limits:
    FIFO send rate: 40
- name: FIFO in high throughput mode (ap-northeast-1)
  region: ap-northeast-1
  attributes:
    fifo_queue: true
    fifo_throughput_limit: perMessageGroupId
    deduplication_scope: messageGroup
  assumptions:
    requestsPerMessage: 2
  demand:
    send:
      monthly: 2000000.0
      peak: 1000
  # 2e6 × 2 = 4e6 requests × 0.5 / 1e6 = 2.
  costs:
    Requests: 2
  limits:
    FIFO send rate: 1000
# Past the first tier: 5e10 × 3 = 1.5e11 requests.
# 1e11 × 0.4 / 1e6 = 40000; (1.5e11 − 1e11) × 0.3 / 1e6 = 15000; together 55000.
- name: standard past the first request tier (us-east-1)
  region: us-east-1
  demand:
    send:
      monthly: 5e+10
      peak: 20000
  costs:
    Requests: 55000
# Past both FIFO tiers: 1.25e11 × 2 = 2.5e11 requests.
# 1e11 × 0.5 / 1e6 = 50000; 1e11 × 0.46 / 1e6 = 46000;
# (2.5e11 − 2e11) × 0.42 / 1e6 = 21000; together 117000.
- name: FIFO past both request tiers (ap-northeast-1)
  region: ap-northeast-1
  attributes:
    fifo_queue: true
  assumptions:
    requestsPerMessage: 2
  demand:
    send:
      monthly: 1.25e+11
      peak: 300
  costs:
    Requests: 117000
  limits:
    FIFO send rate: 300

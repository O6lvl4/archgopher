type: aws_sqs_queue
label: SQS
category: Messaging
icon: sqs
description: "API requests in 64 KB chunks (send, receive, delete), in volume tiers from 100 billion and 200 billion a month counted over every queue of the type in the account. FIFO queues have a per-API rate limit, higher and set by region in high throughput mode."
kinds: [send]
sla: aws.sqs
attributes:
  - { key: fifo_queue, label: FIFO, type: boolean, default: false }
  - { key: fifo_throughput_limit, label: FIFO throughput limit, type: choice, options: [perQueue, perMessageGroupId], default: perQueue }
  - { key: deduplication_scope, label: Deduplication scope, type: choice, options: [queue, messageGroup], default: queue }
assumptions:
  - { key: messageKb, label: Message size, type: number, unit: KB, default: 1, hint: "Billed in 64 KB chunks; for messages whose edges give no kb" }
  - { key: requestsPerMessage, label: API requests per message, type: number, default: 3, hint: "Send, receive and delete; lower with batching" }
let:
  - highThroughput: 'fifo_queue && fifo_throughput_limit == "perMessageGroupId" && deduplication_scope == "messageGroup"'
readings:
  - requests:
      name: Requests
      price: 'aws.sqs.{fifo_queue ? "fifo" : "standard"}.requests'
      count: units(total, 64, messageKb) * requestsPerMessage
  - rate: { when: fifo_queue, name: FIFO send rate, unit: messages/second, quota: 'aws.sqs.fifo.{highThroughput ? "high_throughput_tps" : "tps"}', peak: total.peak }
terraform:
  ignoreRefs: [redrive_policy, redrive_allow_policy]
iam:
  send: ["sqs:SendMessage"]

type: aws_sqs_queue
label: SQS
category: Messaging
description: API requests in 64 KB chunks (send, receive, delete). FIFO queues have a per-API rate limit.
kinds: [send]
sla: aws.sqs
attributes:
  - { key: fifo_queue, label: FIFO, type: boolean, default: false }
assumptions:
  - { key: messageKb, label: Message size, type: number, unit: KB, default: 1, hint: "Billed in 64 KB chunks" }
  - { key: requestsPerMessage, label: API requests per message, type: number, default: 3, hint: "Send, receive and delete; lower with batching" }
readings:
  - requests:
      name: Requests
      price: 'aws.sqs.{fifo_queue ? "fifo" : "standard"}.requests'
      count: total.monthly * requestsPerMessage
      chunkKb: 64
      sizeKb: messageKb
  - rate: { when: fifo_queue, name: FIFO send rate, unit: messages/second, quota: aws.sqs.fifo.tps, peak: total.peak }
terraform:
  ignoreRefs: [redrive_policy, redrive_allow_policy]
iam:
  send: ["sqs:SendMessage"]

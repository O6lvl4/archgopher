type: aws_apigatewayv2_api
label: API Gateway (HTTP)
category: Edge
icon: api-gateway
description: "Requests in 512 KB steps, in two volume tiers (first 300 million, then the rest per month). Tiers are applied per API here; AWS applies them to all HTTP APIs in the account and region. Headroom is the account throttle. WebSocket APIs are not read yet."
kinds: [request]
sla: aws.apigateway
attributes:
  - { key: protocol_type, label: Protocol, type: choice, options: [HTTP, WEBSOCKET], default: HTTP }
assumptions:
  - { key: payloadKb, label: Request size, type: number, unit: KB, default: 1, hint: "Billed in 512 KB steps; for requests whose edges give no kb" }
let:
  - billed: 'units(total, 512, payloadKb)'
readings:
  - fail: { when: 'protocol_type != "HTTP"', message: "{protocol_type} APIs are not supported yet" }
  - requests: { name: Requests, price: aws.apigateway.http.requests, count: 'min(billed, 300000000)' }
  - cost: { when: billed > 300000000, name: "Requests (over 300 million)", quantity: billed - 300000000, unit: request, price: aws.apigateway.http.requests_tier2 }
  - rate: { name: Account throttle, unit: requests/second, quota: aws.apigateway.account_rps, peak: total.peak }
terraform:
  frontDoor: true
  links:
    - { type: aws_apigatewayv2_integration, from: api_id, to: [integration_uri] }
  aliases: { aws_apigatewayv2_stage: api_id }

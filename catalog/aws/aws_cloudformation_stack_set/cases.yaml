# Worked examples: given these values and this load, the resource reads this.
# Expected values are computed by hand from the unit prices, not taken from the engine.
- name: two registry resources in six stack instances
  region: ap-northeast-1
  assumptions:
    stackInstances: 6
    thirdPartyResources: 2
  demand:
    deploy:
        monthly: 10
        peak: 0.001
  costs:
    Handler operations: 0.108  # 10 × 2 × 6 × 0.0009
    Handler time beyond 30 s: 0
- name: JSON template with intrinsic functions and AWS types only
  region: us-east-1
  attributes:
    template_body: '{"Resources": {"Topic": {"Type": "AWS::SNS::Topic"}}, "Outputs": {"Arn": {"Value": {"Fn::GetAtt": ["Topic", "TopicArn"]}}}}'
  demand:
    deploy:
        monthly: 5
        peak: 0.001
  costs:
    Handler operations: 0
    Handler time beyond 30 s: 0

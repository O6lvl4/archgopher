type: aws_bedrockagentcore_code_interpreter
label: AgentCore Code Interpreter
category: AI
description: "Session compute: active CPU, and peak memory for the whole session. Headroom is concurrent sessions, session starts, calls per second and session length."
kinds: [session]
sla: aws.agentcore
assumptions:
  - { key: invocationsPerSession, label: Code executions per session, type: number, default: 1 }
includes: [session]
readings:
  - session:
      count: total.monthly
      peak: total.peak
      sessionSeconds: sessionSeconds
      activeVcpuSeconds: activeVcpuSeconds
      memoryGb: peakMemoryGb
      vcpuPrice: aws.agentcore.code_interpreter.vcpu_hour
      memoryPrice: aws.agentcore.code_interpreter.gb_hour
      concurrentQuota: aws.agentcore.code_interpreter.concurrent
  - rate: { name: Session starts, unit: requests/second, quota: aws.agentcore.code_interpreter.start_rps, peak: total.peak }
  - rate: { name: Code executions, unit: requests/second, quota: aws.agentcore.code_interpreter.invoke_rps, peak: total.peak * invocationsPerSession }
  - limit: { name: Memory per session, demand: peakMemoryGb, unit: GB, quota: aws.agentcore.code_interpreter.memory_per_session_gb }
  - limit: { name: Session length, demand: sessionSeconds, unit: seconds, quota: aws.agentcore.code_interpreter.max_session_seconds }
terraform:
  ignoreRefs: [network_configuration, certificate, recording, enterprise_policy]
iam:
  session: ["bedrock-agentcore:StartCodeInterpreterSession"]

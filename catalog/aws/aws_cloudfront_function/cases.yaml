# Worked examples: given these values and this load, the resource reads this.
# Expected values are computed by hand from the unit prices, not taken from the engine.
- name: viewer-request function
  region: eu-west-1
  demand:
    request:
      monthly: 30000000.0
      peak: 50
  costs:
    Invocations: 2.8  # (30e6 − 2e6 always free) / 1e6 × 0.10
- name: within the always-free invocations
  region: us-east-1
  demand:
    request:
      monthly: 1500000
      peak: 5
  costs:
    Invocations: 0  # 1.5e6 of the account's 2e6 always-free invocations

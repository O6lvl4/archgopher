- name: express duration rounds up to 100 ms (us-east-1)
  region: us-east-1
  attributes:
    type: EXPRESS
  assumptions:
    durationMs: 250
    memoryMb: 64
  demand:
    execution:
        monthly: 1e+06
        peak: 10
  costs:
    # 250 ms bills as 300 ms: 1,000,000 x 0.3 s x 64 / 1024 GB = 18,750 GB-s x $0.00001667
    Duration: 0.3125625
    Requests: 1
# Past both duration tiers: 2e7 × 1.5 s × 1 GB = 3e7 GB-seconds.
# 3.6e6 × 0.00001667 = 60.012; (1.8e7 − 3.6e6) × 0.00000833 = 119.952;
# (3e7 − 1.8e7) × 0.00000456 = 54.72; together 234.684. Requests: 2e7 / 1e6 × 1 = 20.
- name: express past both duration tiers (us-east-1)
  region: us-east-1
  attributes:
    type: EXPRESS
  assumptions:
    durationMs: 1500
    memoryMb: 1024
  demand:
    execution:
        monthly: 2e+07
        peak: 400
  costs:
    Duration: 234.684
    Requests: 20

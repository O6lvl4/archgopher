# Worked examples: given these values and this load, the resource reads this.
# Expected values are computed by hand from the unit prices, not taken from the engine.
- name: 300 GB between nodes spread over three zones (ap-northeast-1)
  region: ap-northeast-1
  assumptions:
    zones: 3
  demand:
    transfer:
      monthly: 300
      peak: 0
  # 2/3 of 300 GB = 200 GB crosses zones, $0.01 out and $0.01 in
  costs:
    Out of one zone: 2.0
    Into the other zone: 2.0
- name: one zone crosses nothing (us-east-1)
  region: us-east-1
  assumptions:
    zones: 1
  demand:
    transfer:
      monthly: 300
      peak: 0
  costs:
    Out of one zone: 0
    Into the other zone: 0

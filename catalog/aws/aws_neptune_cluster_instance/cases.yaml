# Worked examples: given these values and this load, the resource reads this.
# Monthly USD per cost line, peak demand per limit. After an intended change:
#   go test ./provider/aws -update
- name: standard (ap-northeast-1)
  region: ap-northeast-1
  attributes: { instance_class: db.r6g.xlarge }
  costs:
    Instance (db.r6g.xlarge, standard): 579.182
- name: I/O-Optimized (us-east-1)
  region: us-east-1
  attributes: { instance_class: db.r6g.xlarge }
  assumptions: { ioOptimized: true }
  costs:
    Instance (db.r6g.xlarge, I/O-Optimized): 647.51
- name: burstable with surplus credits (us-east-1)
  region: us-east-1
  attributes: { instance_class: db.t3.medium }
  assumptions: { cpuCreditVcpuHours: 10 }
  costs:
    Instance (db.t3.medium, standard): 71.54
    CPU credits (db.t3): 1.5
- name: serverless (ap-northeast-1)
  region: ap-northeast-1
  attributes: { instance_class: db.serverless }
  assumptions: { averageNcu: 2.5 }
  costs:
    Serverless capacity: 354.2325
- name: serverless without averageNcu (us-east-1)
  region: us-east-1
  attributes: { instance_class: db.serverless }
  error: averageNcu is required

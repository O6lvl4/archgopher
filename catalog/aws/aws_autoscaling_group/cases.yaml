# Worked examples: given these values and this load, the resource reads this.
# Expected values are computed by hand from the unit prices, not taken from the engine.
- name: three m5.large from a launch template, headroom at max size (ap-northeast-1)
  region: ap-northeast-1
  attributes:
    min_size: 2
    max_size: 6
    desired_capacity: 3
  assumptions:
    instanceType: m5.large
    rootVolumeType: gp3
    rootVolumeGb: 20
    requestsPerInstance: 100
  demand:
    request:
      monthly: 1e+07
      peak: 250
  # 3 x 730 h x 0.124; 3 x 20 GB x 0.096
  costs:
    Instance (linux, m5.large): 271.56
    Root volumes (gp3): 5.76
  limits:
    Requests per second: 250
- name: mixed instances, 2 on-demand base and 25% above it (us-east-1)
  region: us-east-1
  attributes:
    min_size: 2
    max_size: 20
    desired_capacity: 10
    override_instance_type: m5.large
    on_demand_base_capacity: 2
    on_demand_percentage: 25
  assumptions:
    spotShare: 0.4
    detailedMonitoring: true
  demand:
    request:
      monthly: 0
      peak: 0
  # on-demand 2 + 8 x 25% = 4, spot 6; 4 x 730 x 0.096; 6 x 730 x 0.4 x 0.096;
  # 10 x 7 metrics x 0.30 = 21; 10 x 8 GB x 0.10
  costs:
    Instance (linux, m5.large): 280.32
    Spot instance (linux, m5.large): 168.192
    Detailed monitoring: 21
    Root volumes (gp2): 8
- name: no instance type (us-east-1)
  region: us-east-1
  attributes:
    min_size: 1
    max_size: 2
  demand:
    request:
      monthly: 0
      peak: 0
  error: "no instance type: set instanceType"
# Detailed monitoring past the first metric tier: 2,000 x 7 = 14,000 metrics.
# 10,000 x 0.30 = 3000; (14,000 - 10,000) x 0.10 = 400; together 3400.
# 2,000 x 730 x 0.096 = 140160; 2,000 x 8 GB x 0.10 = 1600.
- name: detailed monitoring past the first metric tier (us-east-1)
  region: us-east-1
  attributes:
    min_size: 2000
    max_size: 2000
    override_instance_type: m5.large
  assumptions:
    detailedMonitoring: true
  demand:
    request:
      monthly: 0
      peak: 0
  costs:
    Instance (linux, m5.large): 140160
    Detailed monitoring: 3400
    Root volumes (gp2): 1600
# Dedicated tenancy: 3 x 730 h x 0.102 = 223.38; 3 x 8 GB x 0.10 = 2.4; the region's
# Dedicated per region fee is paid once, however many dedicated instances run: 730 h x 2 = 1460.
- name: three dedicated m5.large pay the regional fee once (us-east-1)
  region: us-east-1
  attributes:
    min_size: 3
    max_size: 3
  assumptions:
    instanceType: m5.large
    dedicatedTenancy: true
  demand:
    request:
      monthly: 0
      peak: 0
  costs:
    Instance (linux, m5.large): 223.38
    Root volumes (gp2): 2.4
    Dedicated per region fee: 1460

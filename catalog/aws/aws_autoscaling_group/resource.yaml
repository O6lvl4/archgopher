type: aws_autoscaling_group
label: EC2 Auto Scaling group
category: Compute
icon: ec2-auto-scaling
description: 'Instance-hours of the instances the group runs, split into on-demand and spot by the mixed instances policy, with each instance''s root volume, EBS-optimized surcharges, detailed monitoring, unlimited CPU credits and public IPv4 addresses. The launch template or launch configuration is not read: its instance type, OS and volume are assumptions. Headroom is the peak against max_size instances.'
kinds: [request]
sla: aws.ec2.region
attributes:
  - { key: desired_capacity, label: Desired capacity, type: number, optional: true, hint: "Empty uses min_size (at least 1)" }
  - { key: min_size, label: Min size, type: number }
  - { key: max_size, label: Max size, type: number }
  - { key: override_instance_type, label: Instance type (mixed instances override), type: string, optional: true, path: mixed_instances_policy.launch_template.override.instance_type, hint: "The first override; later ones are not read" }
  - { key: override_weight, label: Weighted capacity, type: number, optional: true, path: mixed_instances_policy.launch_template.override.weighted_capacity }
  - { key: on_demand_base_capacity, label: On-demand base, type: number, default: 0, path: mixed_instances_policy.instances_distribution.on_demand_base_capacity }
  - { key: on_demand_percentage, label: On-demand above base, type: number, unit: "%", optional: true, path: mixed_instances_policy.instances_distribution.on_demand_percentage_above_base_capacity, hint: "Empty is 100, or 0 when the launch template asks for spot" }
assumptions:
  - { key: instanceType, label: Instance type, type: string, optional: true, hint: "From the launch template or launch configuration, when no override names one" }
  - { key: operatingSystem, label: Operating system, type: choice, options: [linux, windows, rhel, suse], default: linux, hint: "From the AMI. windows includes the Windows license; rhel and suse include theirs" }
  - { key: dedicatedTenancy, label: Dedicated tenancy, type: boolean, default: false, hint: "The launch template's placement tenancy is dedicated: the dedicated price table, and the region's Dedicated per region fee, paid once for every dedicated instance of the region" }
  - { key: launchTemplateSpot, label: Spot from the launch template, type: boolean, default: false, hint: "instance_market_options.market_type is spot, or the launch configuration sets spot_price" }
  - { key: averageInstances, label: Average instances, type: number, optional: true, hint: "Instances running on average over the month when scaling moves the count; empty uses the desired count" }
  - { key: monthlyHours, label: Hours running a month, type: number, unit: hours, default: 730 }
  - { key: spotShare, label: Spot price share, type: number, unit: fraction, optional: true, hint: "Spot price as a share of on-demand, from the Spot price history of the type (often 0.3 to 0.7). The Price List has no spot prices" }
  - { key: ebsOptimizedSet, label: EBS-optimized, type: boolean, default: false, hint: "Only previous-generation types charge for it" }
  - { key: detailedMonitoring, label: Detailed monitoring, type: boolean, default: false, hint: "Launch configurations enable it by default, launch templates do not. About 7 CloudWatch metrics per instance; CloudWatch bills them in volume tiers from 10,000 metrics, counted over the account" }
  - { key: cpuCredits, label: CPU credits, type: choice, options: [standard, unlimited], optional: true, hint: "Burstable types; t2 defaults to standard, the others to unlimited" }
  - { key: surplusCreditVcpuHours, label: Surplus CPU credits per instance, type: number, unit: vCPU-hours, default: 0, hint: "Unlimited burstable instances only: vCPU-hours a month above the baseline that the earned credits do not cover" }
  - { key: rootVolumeType, label: Root volume type, type: choice, options: [standard, gp2, gp3, io1, io2, sc1, st1], default: gp2, hint: "From the launch template's block device mapping or the AMI" }
  - { key: rootVolumeGb, label: Root volume size, type: number, unit: GiB, default: 8 }
  - { key: rootIopsSet, label: Root volume IOPS, type: number, default: 0, hint: "io1 and io2 need it; gp3 above 3,000 is billed" }
  - { key: rootThroughputSet, label: Root volume throughput, type: number, unit: MiB/s, default: 0, hint: "gp3 above 125 MiB/s is billed" }
  - { key: publicIpv4, label: Public IPv4 address, type: boolean, default: false, hint: "The instances get a public IPv4 address, billed per hour" }
  - { key: magneticIoPerMonth, label: Magnetic volume I/O per instance, type: number, unit: I/O requests, default: 0, hint: "Only for standard (magnetic) volumes, which bill each I/O request" }
  - { key: requestsPerInstance, label: Capacity per instance, type: number, unit: requests/second, optional: true, hint: "What one instance serves at the peak, from a load test; compared with the peak load" }
let:
  - itype: 'string(override_instance_type ?? instanceType ?? "")'
  - os: operatingSystem
  - creditMode: 'string(cpuCredits ?? "")'
  - tenancyPrefix: 'dedicatedTenancy ? "dedicated." : ""'
  - running: 'averageInstances ?? ceil((desired_capacity ?? max(min_size, 1.0)) / (override_weight ?? 1.0))'
  - pct: 'on_demand_percentage ?? (launchTemplateSpot ? 0.0 : 100.0)'
  - base: 'min(on_demand_base_capacity, running)'
  - od: 'base + (running - base) * pct / 100'
  - sp: 'running - od'
  - ebsOptimized: ebsOptimizedSet
  - missingType: '"no instance type: set instanceType, the type the launch template or launch configuration gives"'
  - family: 'itype == "" ? "" : split(itype, ".")[0]'
  - unlimited: 'family in ["t2", "t3", "t3a", "t4g", "t8i"] && (creditMode != "" ? creditMode : family == "t2" ? "standard" : "unlimited") == "unlimited"'
  - rootType: rootVolumeType
  - rootGb: rootVolumeGb
  - rootIops: rootIopsSet
  - rootThr: rootThroughputSet
readings:
  - fail: { when: 'itype == ""', message: "{missingType}" }
  - cost: { when: 'od > 0', name: "Instance ({os}, {itype})", quantity: 'od * monthlyHours', unit: instance-hour, price: "aws.ec2.{tenancyPrefix}{os}.{itype}" }
  - fail: { when: 'sp > 0 && spotShare == nil', message: "spot instances run here: set spotShare, the share of the on-demand price the spot price comes to", continue: true }
  - cost: { when: 'sp > 0 && spotShare != nil', name: "Spot instance ({os}, {itype})", quantity: 'sp * monthlyHours * (spotShare ?? 0)', unit: instance-hour, price: "aws.ec2.{tenancyPrefix}{os}.{itype}" }
  - cost: { when: 'tenancyPrefix != "" && od + sp > 0', name: Dedicated per region fee, quantity: monthlyHours, unit: hour, price: aws.ec2.dedicated.regional_fee }
  - cost: { when: 'ebsOptimized && itype in ["c1.xlarge", "c3.2xlarge", "c3.4xlarge", "c3.xlarge", "g2.2xlarge", "i2.2xlarge", "i2.4xlarge", "i2.xlarge", "m1.large", "m1.xlarge", "m2.2xlarge", "m2.4xlarge", "m3.2xlarge", "m3.xlarge", "r3.2xlarge", "r3.4xlarge", "r3.xlarge"]', name: EBS-optimized surcharge, quantity: '(od + sp) * monthlyHours', unit: instance-hour, price: "aws.ec2.ebs_optimized.{itype}" }
  - cost: { when: detailedMonitoring, name: Detailed monitoring, quantity: '(od + sp) * 7', unit: metric-month, price: aws.ec2.monitoring.metric }
  - cost: { when: 'unlimited && surplusCreditVcpuHours > 0', name: "CPU credits ({family})", quantity: '(od + sp) * surplusCreditVcpuHours', unit: vCPU-hour, price: 'aws.ec2.cpu_credits.{os == "windows" ? "windows" : "linux"}.{family}' }
  - storage: { name: "Root volumes ({rootType})", gb: 'running * rootGb', price: "aws.ebs.storage.{rootType}" }
  - fail: { when: 'rootType in ["io1", "io2"] && rootIops <= 0', message: "Root volumes: {rootType} needs provisioned iops", continue: true }
  - cost: { when: 'rootType == "io1"', name: "Root volumes IOPS (io1)", quantity: 'running * rootIops', unit: IOPS-month, price: aws.ebs.io1.iops }
  - cost: { when: 'rootType == "io2"', name: "Root volumes IOPS (io2, up to 32,000)", quantity: 'running * min(rootIops, 32000)', unit: IOPS-month, price: aws.ebs.io2.iops }
  - cost: { when: 'rootType == "io2" && rootIops > 32000', name: "Root volumes IOPS (io2, 32,001 to 64,000)", quantity: 'running * (min(rootIops, 64000) - 32000)', unit: IOPS-month, price: aws.ebs.io2.iops_tier2 }
  - cost: { when: 'rootType == "io2" && rootIops > 64000', name: "Root volumes IOPS (io2, over 64,000)", quantity: 'running * (rootIops - 64000)', unit: IOPS-month, price: aws.ebs.io2.iops_tier3 }
  - cost: { when: 'rootType == "gp3" && rootIops > 3000', name: "Root volumes IOPS (gp3, over 3,000)", quantity: 'running * (rootIops - 3000)', unit: IOPS-month, price: aws.ebs.gp3.iops }
  - cost: { when: 'rootType == "gp3" && rootThr > 125', name: "Root volumes throughput (gp3, over 125 MiB/s)", quantity: 'running * (rootThr - 125)', unit: MiBps-month, price: aws.ebs.gp3.throughput }
  - cost: { when: 'rootType == "standard" && magneticIoPerMonth > 0', name: Magnetic volume I/O, quantity: 'running * magneticIoPerMonth', unit: I/O request, price: aws.ebs.standard.io }
  - cost: { when: publicIpv4, name: Public IPv4 addresses, quantity: 'running * monthlyHours', unit: address-hour, price: aws.ec2.public_ipv4 }
  - limit: { when: requestsPerInstance != nil, name: Requests per second, demand: total.peak, unit: requests/second, capacity: 'max_size * (requestsPerInstance ?? 0)' }
terraform:
  # Launch templates, target groups and placement are configuration; load reaches the group through its load balancer.
  ignoreRefs: [launch_template, launch_configuration, mixed_instances_policy, target_group_arns, load_balancers, placement_group, service_linked_role_arn, initial_lifecycle_hook, warm_pool]

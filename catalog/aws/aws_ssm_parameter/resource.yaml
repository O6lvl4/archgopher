type: aws_ssm_parameter
label: SSM parameter
category: Security
icon: systems-manager
description: "Standard parameters are free; Advanced parameters are billed per parameter-hour, and their API interactions per 10,000. Higher throughput, set for the account, bills every interaction and raises the GetParameter rate."
kinds: [read]
sla: aws.ssm
attributes:
  - { key: tier, label: Tier, type: choice, options: [Standard, Advanced, Intelligent-Tiering], default: Standard, hint: "Intelligent-Tiering is read as Standard until a parameter needs Advanced" }
assumptions:
  - { key: highThroughput, label: Higher throughput, type: boolean, default: false, hint: "An account setting per region: raises GetParameter to 10,000 TPS and bills every API interaction" }
let:
  - advanced: 'tier == "Advanced"'
readings:
  - cost: { when: advanced, name: Advanced parameter, quantity: 730, unit: parameter-hour, price: aws.ssm.advanced_parameter }
  - requests: { when: highThroughput, name: API interactions (higher throughput), price: aws.ssm.interactions_high, count: total.monthly }
  - requests: { when: advanced && !highThroughput, name: API interactions (advanced), price: aws.ssm.interactions_advanced, count: total.monthly }
  - rate: { name: GetParameter rate, unit: requests/second, quota: 'aws.ssm.{highThroughput ? "get_parameter_high_tps" : "get_parameter_tps"}', peak: total.peak }
terraform:
  ignoreRefs: [key_id]
iam:
  read: ["ssm:GetParameter", "ssm:GetParameters", "ssm:GetParametersByPath"]

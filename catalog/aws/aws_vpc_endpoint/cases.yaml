# Worked examples: given these values and this load, the resource reads this.
# Expected values are computed by hand from the unit prices, not taken from the engine.
- name: Gateway endpoints are free
  region: us-east-1
  demand: &id001
    request:
      monthly: 1000000.0
      peak: 1
- name: Interface in three subnets, 100 GB (ap-northeast-1)
  region: ap-northeast-1
  attributes:
    vpc_endpoint_type: Interface
    subnet_ids:
    - a
    - b
    - c
  assumptions:
    gbPerMonth: 100
    kbPerUnit: 2
  demand: *id001
  # 100 GB + 1e6 × 2 KB (1.9073486328125 GB) at $0.01
  costs:
    Endpoint hours: 30.66
    Data processed: 1.019073486328125
- name: Interface with unknown subnets uses two zones (us-east-1)
  region: us-east-1
  attributes:
    vpc_endpoint_type: Interface
  assumptions:
    kbPerUnit: 1
  demand: *id001
  # 1e6 × 1 KB = 0.95367431640625 GB at $0.01
  costs:
    Endpoint hours: 14.6
    Data processed: 0.0095367431640625
- name: Interface with load and no size (us-east-1)
  region: us-east-1
  attributes:
    vpc_endpoint_type: Interface
  demand: *id001
  error: "load passes through this endpoint: set kbPerUnit, the data each request carries"
- name: Gateway Load Balancer endpoints are not priced
  region: us-east-1
  attributes:
    vpc_endpoint_type: GatewayLoadBalancer
  demand: *id001
  error: 'GatewayLoadBalancer endpoints are not priced yet: only Gateway and Interface
    endpoints are'
- name: Interface past the first processing tier (us-east-1)
  region: us-east-1
  attributes:
    vpc_endpoint_type: Interface
  assumptions:
    gbPerMonth: 2000000
  demand:
    request:
      monthly: 0
      peak: 0
  # 1,048,576 GB × $0.01 = 10485.76; (2,000,000 − 1,048,576) GB × $0.006 = 5708.544; together 16194.304
  costs:
    Endpoint hours: 14.6
    Data processed: 16194.304

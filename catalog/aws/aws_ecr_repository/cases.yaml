# Worked examples: given these values and this load, the resource reads this.
# Expected values are computed by hand from the unit prices, not taken from the engine.
- name: 12 GB of images, 4 layers per pull
  region: us-east-1
  assumptions:
    imageGb: 12
    layersPerPull: 4
  demand:
    pull:
      monthly: 10000
      peak: 2
  costs:
    Image storage: 1.2
  limits:
    BatchGetImage: 2
    GetDownloadUrlForLayer: 8

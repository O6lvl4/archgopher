# Past the first duration tier: 1e9 × 10 s × 1 GB = 1e10 GB-seconds.
# (6e9 − 400,000 free) × 0.0000166667 = 99993.53332; (1e10 − 6e9) × 0.000015 = 60000;
# together 159993.53332. Requests: (1e9 − 1e6 free) × 0.2 / 1e6 = 199.8.
- name: x86_64 past the first duration tier (us-east-1)
  region: us-east-1
  attributes:
    memory_size: 1024
  assumptions:
    durationMs: 10000
  demand:
    invoke:
        monthly: 1e+09
        peak: 400
  costs:
    Duration (1024 MB, x86_64): 159993.53332
    Requests: 199.8
  limits:
    Concurrency: 4000
# Past both Arm duration tiers: 1e9 × 20 s × 1 GB = 2e10 GB-seconds.
# (7.5e9 − 400,000 free) × 0.0000133334 = 99995.16664;
# (1.875e10 − 7.5e9) × 0.0000120001 = 135001.125; (2e10 − 1.875e10) × 0.0000106667 = 13333.375;
# together 248329.66664. Requests: (1e9 − 1e6 free) × 0.2 / 1e6 = 199.8.
- name: arm64 past both duration tiers (ap-northeast-1)
  region: ap-northeast-1
  attributes:
    architectures:
        - arm64
    memory_size: 1024
  assumptions:
    durationMs: 20000
  demand:
    invoke:
        monthly: 1e+09
        peak: 400
  costs:
    Duration (1024 MB, arm64): 248329.66664
    Requests: 199.8
  limits:
    Concurrency: 8000

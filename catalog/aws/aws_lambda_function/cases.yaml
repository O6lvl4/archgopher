# Worked examples: given these values and this load, the resource reads this.
# Monthly USD per cost line, peak demand per limit. After an intended change:
#   go test ./provider/aws -run TestCases -update
- name: x86_64 at the default memory (us-east-1)
  region: us-east-1
  assumptions:
    durationMs: 200
  demand:
    invoke:
        monthly: 2e+06
        peak: 40
  # Within the always-free 400,000 GB-seconds: 2e6 × 0.2 s × 0.125 GB = 50,000.
  # Requests: (2e6 − 1e6 free) × 0.2 / 1e6 = 0.2.
  costs:
    Duration (128 MB, x86_64): 0
    Requests: 0.2
  limits:
    Concurrency: 8
- name: arm64 with reserved concurrency and logs (us-east-1)
  region: us-east-1
  attributes:
    architectures:
        - arm64
    memory_size: 1024
    reserved_concurrent_executions: 50
  assumptions:
    durationMs: 800
    logKbPerCall: 2
    logRetentionDays: 14
  demand:
    invoke:
        monthly: 2e+06
        peak: 40
  # 2e6 × 0.8 s × 1 GB = 1.6e6 GB-seconds, 400,000 free: 1.2e6 × 0.0000133334 = 16.00008.
  # Requests: (2e6 − 1e6 free) × 0.2 / 1e6 = 0.2.
  costs:
    Duration (1024 MB, arm64): 16.00008
    Log ingestion: 0  # 2e6 × 2 KB = 3.81 GB, within the account's always-free 5 GB
    Log storage: 0  # 1.76 GB-months, within the always-free 5
    Requests: 0.2
  limits:
    Concurrency: 32
- name: logs that never expire (us-east-1)
  region: us-east-1
  attributes:
    memory_size: 512
  assumptions:
    durationMs: 100
    logKbPerCall: 1
    logRetentionDays: 0
  demand:
    invoke:
        monthly: 2e+06
        peak: 40
  # Within the always-free 400,000 GB-seconds: 2e6 × 0.1 s × 0.5 GB = 100,000.
  # Requests: (2e6 − 1e6 free) × 0.2 / 1e6 = 0.2.
  costs:
    Duration (512 MB, x86_64): 0
    Log ingestion: 0  # 2e6 × 1 KB = 1.91 GB, within the account's always-free 5 GB
    Log storage (after 12 months, never expires): 0.536645508  # (22.888183594 − 5 always free) GB-months × 0.03
    Requests: 0.2
  limits:
    Concurrency: 4
- name: missing duration (us-east-1)
  region: us-east-1
  demand:
    invoke:
        monthly: 2e+06
        peak: 40
  error: missing assumption "durationMs"

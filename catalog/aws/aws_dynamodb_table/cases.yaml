- name: on demand, Standard-IA table class (us-east-1)
  region: us-east-1
  attributes:
    billing_mode: PAY_PER_REQUEST
    table_class: STANDARD_INFREQUENT_ACCESS
  assumptions:
    itemSizeKb: 6
    storageGb: 20
  demand:
    read:
        monthly: 2e+06
        peak: 40
    write:
        monthly: 2.5e+06
        peak: 50
  costs:
    Read request units: 0.31 # 2e6 reads × 2 units × 0.5 = 2e6 RRU × $0.155/M
    Storage: 2 # 20 GB × $0.10
    Write request units: 11.7 # 2.5e6 × 6 = 15e6 WRU × $0.78/M
  limits:
    Table reads: 40
    Table writes: 300
- name: provisioned, Standard-IA table class (us-east-1)
  region: us-east-1
  attributes:
    read_capacity: 100
    write_capacity: 20
    table_class: STANDARD_INFREQUENT_ACCESS
  assumptions:
    itemSizeKb: 3
    storageGb: 5
  demand:
    read:
        monthly: 2e+06
        peak: 40
    write:
        monthly: 2.5e+06
        peak: 50
  costs:
    Provisioned reads: 11.68 # 100 RCU × 730 h × $0.00016
    Provisioned writes: 11.826 # 20 WCU × 730 h × $0.00081
    Storage: 0.5 # 5 GB × $0.10
  limits:
    Provisioned reads: 20
    Provisioned writes: 150

# Worked examples: given these values and this load, the resource reads this.
# Monthly USD per cost line, peak demand per limit. After an intended change:
#   go test ./provider/aws -run TestCases -update
- name: on demand, eventual reads (us-east-1)
  region: us-east-1
  attributes:
    billing_mode: PAY_PER_REQUEST
  assumptions:
    itemSizeKb: 6
    storageGb: 20
  demand:
    read:
        monthly: 2e+06
        peak: 40
    write:
        monthly: 2.5e+06
        peak: 50
  # 20 GB, within the account's always-free 25 GB.
  costs:
    Read request units: 0.25
    Storage: 0
    Write request units: 9.375
  limits:
    Table reads: 40
    Table writes: 300
- name: on demand, transactional (us-east-1)
  region: us-east-1
  attributes:
    billing_mode: PAY_PER_REQUEST
  assumptions:
    consistentRead: transactional
    itemSizeKb: 2
    storageGb: 1
    transactionalWrites: true
  demand:
    read:
        monthly: 2e+06
        peak: 40
    write:
        monthly: 2.5e+06
        peak: 50
  # 1 GB, within the account's always-free 25 GB.
  costs:
    Read request units: 0.5
    Storage: 0
    Write request units: 6.25
  limits:
    Table reads: 80
    Table writes: 200
- name: provisioned (us-east-1)
  region: us-east-1
  attributes:
    read_capacity: 100
    write_capacity: 20
  assumptions:
    itemSizeKb: 3
    storageGb: 5
  demand:
    read:
        monthly: 2e+06
        peak: 40
    write:
        monthly: 2.5e+06
        peak: 50
  # Always free: 18,600 RCU-hours, 18,600 WCU-hours and 25 GB.
  # Reads: (100 × 730 − 18,600) × 0.00013 = 7.072. Writes: 20 × 730 = 14,600, all free. Storage: 5 GB, free.
  costs:
    Provisioned reads: 7.072
    Provisioned writes: 0
    Storage: 0
  limits:
    Provisioned reads: 20
    Provisioned writes: 150
- name: provisioned without capacity (us-east-1)
  region: us-east-1
  assumptions:
    itemSizeKb: 1
    storageGb: 1
  demand:
    read:
        monthly: 2e+06
        peak: 40
    write:
        monthly: 2.5e+06
        peak: 50
  costs:
    Storage: 0  # 1 GB, within the always-free 25 GB
  error: provisioned tables need read_capacity and write_capacity

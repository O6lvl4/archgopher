type: aws_dynamodb_table
label: DynamoDB
category: Database
description: Read and write units (4 KB / 1 KB steps) and storage. Headroom is provisioned capacity or the on-demand table limit. Auto scaling is not modelled.
kinds: [read, write]
sla: aws.dynamodb
attributes:
  - { key: billing_mode, label: Billing mode, type: choice, options: [PROVISIONED, PAY_PER_REQUEST], default: PROVISIONED }
  - { key: read_capacity, label: Read capacity, type: number, unit: RCU, optional: true }
  - { key: write_capacity, label: Write capacity, type: number, unit: WCU, optional: true }
assumptions:
  - { key: itemSizeKb, label: Item size, type: number, unit: KB }
  - { key: storageGb, label: Storage, type: number, unit: GB }
  - { key: consistentRead, label: Read consistency, type: choice, options: [eventual, strong, transactional], default: eventual }
  - { key: transactionalWrites, label: Transactional writes, type: boolean, default: false }
let:
  - perRead: 'ceilDiv(itemSizeKb, 4) * {"eventual": 0.5, "strong": 1, "transactional": 2}[consistentRead]'
  - perWrite: "ceilDiv(itemSizeKb, 1) * (transactionalWrites ? 2 : 1)"
  - onDemand: 'billing_mode == "PAY_PER_REQUEST"'
readings:
  - storage: { name: Storage, gb: storageGb, price: aws.dynamodb.storage }
  - cost: { when: onDemand, name: Read request units, quantity: demand.read.monthly * perRead, unit: read request unit, price: aws.dynamodb.ondemand.read }
  - cost: { when: onDemand, name: Write request units, quantity: demand.write.monthly * perWrite, unit: write request unit, price: aws.dynamodb.ondemand.write }
  - rate: { when: onDemand, name: Table reads, unit: read units/second, quota: aws.dynamodb.ondemand.table_read, peak: demand.read.peak * perRead }
  - rate: { when: onDemand, name: Table writes, unit: write units/second, quota: aws.dynamodb.ondemand.table_write, peak: demand.write.peak * perWrite }
  - fail: { when: "!onDemand && (read_capacity == nil || write_capacity == nil)", message: provisioned tables need read_capacity and write_capacity }
  - capacity: { when: "!onDemand", name: Provisioned reads, units: read_capacity, unit: RCU-hour, price: aws.dynamodb.provisioned.rcu }
  - capacity: { when: "!onDemand", name: Provisioned writes, units: write_capacity, unit: WCU-hour, price: aws.dynamodb.provisioned.wcu }
  - limit: { when: "!onDemand", name: Provisioned reads, demand: demand.read.peak * perRead, unit: read units/second, capacity: read_capacity }
  - limit: { when: "!onDemand", name: Provisioned writes, demand: demand.write.peak * perWrite, unit: write units/second, capacity: write_capacity }
terraform:
  ignoreRefs: [replica]
iam:
  read: ["dynamodb:GetItem", "dynamodb:BatchGetItem", "dynamodb:Query", "dynamodb:Scan", "dynamodb:ConditionCheckItem"]
  write: ["dynamodb:PutItem", "dynamodb:UpdateItem", "dynamodb:DeleteItem", "dynamodb:BatchWriteItem"]

# Worked examples: given these values and this load, the resource reads this.
# Monthly USD per cost line, peak demand per limit. After an intended change:
#   go test ./provider/aws -run TestCases -update
- name: one prefix (us-east-1)
  region: us-east-1
  assumptions:
    storageGb: 300
  demand:
    read:
      monthly: 2e+06
      peak: 40
    write:
      monthly: 2500000.0
      peak: 50
  costs:
    GET requests: 0.8
    PUT requests: 12.5
    Storage: 6.9
  limits:
    GET rate: 40
    PUT rate: 50
- name: four prefixes (us-east-1)
  region: us-east-1
  assumptions:
    prefixes: 4
    storageGb: 10
  demand:
    read:
      monthly: 2e+06
      peak: 40
    write:
      monthly: 2500000.0
      peak: 50
  costs:
    GET requests: 0.8
    PUT requests: 12.5
    Storage: 0.23
  limits:
    GET rate: 40
    PUT rate: 50

type: aws_db_instance
label: RDS instance
category: Database
icon: rds
description: "Instance-hours by engine, license and deployment (Single-AZ, or Multi-AZ with one standby), allocated storage, provisioned IOPS and gp3 throughput above the included baseline, magnetic I/O, backup storage beyond the free allowance, surplus CPU credits, Database Insights and Extended Support per vCPU (a Multi-AZ standby is billed too). Headroom is peak storage IOPS against what the volume provides. On-demand prices; Aurora engines are aws_rds_cluster_instance."
kinds: [query]
sla: aws.rds
attributes:
  - { key: engine, label: Engine, type: string, optional: true, hint: "mysql, postgres, mariadb, oracle-se2, oracle-ee, sqlserver-ex/web/se/ee; a read replica takes it from its source, so set it there" }
  - { key: instance_class, label: Instance class, type: string }
  - { key: multi_az, label: Multi-AZ, type: boolean, default: false }
  - { key: license_model, label: License model, type: string, optional: true, hint: "bring-your-own-license or license-included; Oracle SE2 is license-included unless set" }
  - { key: allocated_storage, label: Allocated storage, type: number, unit: GiB, optional: true, hint: "A read replica or a restore takes it from its source; set it there" }
  - { key: storage_type, label: Storage type, type: string, optional: true, hint: "gp2, gp3, io1, io2 or standard (magnetic); io1 when unset with iops, else gp2" }
  - { key: iops, label: Provisioned IOPS, type: number, optional: true }
  - { key: storage_throughput, label: Storage throughput, type: number, unit: MiBps, optional: true, hint: "gp3 only" }
  - { key: performance_insights_enabled, label: Performance Insights, type: boolean, default: false }
  - { key: performance_insights_retention_period, label: Performance Insights retention, type: number, unit: days, default: 7, hint: "7 days are free; 31 × months, or 731" }
  - { key: database_insights_mode, label: Database Insights mode, type: string, optional: true, hint: "advanced bills every vCPU-hour" }
  - { key: manage_master_user_password, label: Master password in Secrets Manager, type: boolean, default: false, hint: "RDS creates and rotates a Secrets Manager secret, billed as one" }
assumptions:
  - { key: vcpus, label: vCPUs of the instance class, type: number, optional: true, hint: "Required for Database Insights, long Performance Insights retention and Extended Support, which bill per vCPU (db.m5.large has 2)" }
  - { key: ioPerQuery, label: I/O per query, type: number, optional: true, hint: "Storage I/O operations one query causes: billed on magnetic storage, compared with the volume's IOPS otherwise" }
  - { key: backupGb, label: Backup storage beyond the free allowance, type: number, unit: GB, default: 0, hint: "Automated backups and snapshots up to the allocated storage are free" }
  - { key: cpuCreditVcpuHours, label: Surplus CPU credits, type: number, unit: vCPU-hours, default: 0, hint: "db.t3 and db.t4g run unlimited: vCPU-hours above the baseline that earned credits do not cover" }
  - { key: extendedSupport, label: Extended Support, type: choice, options: [none, year1_2, year3], default: none, hint: "A major version past the end of standard support (MySQL 5.7, PostgreSQL 11 and 12) is billed per vCPU-hour" }
  - { key: insightsApiCalls, label: Database Insights API calls, type: number, default: 0, hint: "Calls a month" }
let:
  - eng: 'engine ?? ""'
  - byol: '(license_model ?? "") == "bring-your-own-license"'
  - key: 'eng in ["oracle-se2", "oracle-se2-cdb"] ? (byol ? "oracle_se2_byol" : "oracle_se2_li") : (eng in ["oracle-ee", "oracle-ee-cdb"] ? "oracle_ee_byol" : (eng in ["mysql", "postgres", "mariadb", "sqlserver-ex", "sqlserver-web", "sqlserver-se", "sqlserver-ee"] ? replace(eng, "-", "_") : ""))'
  - dep: 'multi_az ? "multi_az" : "single_az"'
  - deployment: 'multi_az ? "Multi-AZ" : "Single-AZ"'
  - st: 'storage_type ?? (iops != nil ? "io1" : "gp2")'
  - gb: allocated_storage ?? 0
  - large: 'eng startsWith "sqlserver" ? false : (eng startsWith "oracle" ? gb >= 200 : gb >= 400)'
  - baseIops: 'large ? 12000 : 3000'
  - baseMibps: 'large ? 500 : 125'
  - volumeIops: 'st == "gp3" ? max(iops ?? 0, baseIops) : (st in ["io1", "io2"] ? (iops ?? 0) : min(max(100, 3 * gb), 16000))'
  - vcpu: vcpus ?? 0
  - family: 'instance_class startsWith "db.t4g." ? "db.t4g" : "db.t3"'
  - burstable: 'instance_class startsWith "db.t3." || instance_class startsWith "db.t4g."'
  - advanced: '(database_insights_mode ?? "") == "advanced"'
  - longRetention: '!advanced && performance_insights_enabled && performance_insights_retention_period > 7'
  - retentionMonths: 'performance_insights_retention_period >= 731 ? 24 : ceil(performance_insights_retention_period / 31)'
readings:
  - fail: { when: engine == nil, message: "engine is unknown: a read replica takes it from replicate_source_db, so write it here" }
  - fail: { when: 'key == ""', message: 'engine "{eng}" is not priced: set engine to one of mysql, postgres, mariadb, oracle-se2, oracle-ee, sqlserver-ex, sqlserver-web, sqlserver-se or sqlserver-ee (Aurora engines are aws_rds_cluster_instance)' }
  - fail: { when: 'eng startsWith "sqlserver" && byol', message: "SQL Server with bring-your-own-license is not priced" }
  - fail: { when: 'key == "oracle_ee_byol" && (license_model ?? "") == "license-included"', message: "Oracle Enterprise Edition is bring-your-own-license only" }
  - fail: { when: 'key == "sqlserver_ex" && multi_az', message: "SQL Server Express has no Multi-AZ deployment" }
  - cost: { name: "Instance ({instance_class}, {deployment})", quantity: 730, unit: instance-hour, price: "aws.rds.{key}.{dep}.{instance_class}" }
  - fail: { when: allocated_storage == nil, message: "allocated_storage is unknown: a replica or a restore takes it from its source, so set it here", continue: true }
  - storage: { name: "Storage ({st})", gb: gb, price: "aws.rds.storage.{st}.{dep}" }
  - cost: { when: 'st in ["io1", "io2"]', name: "Provisioned IOPS ({st})", quantity: 'iops ?? 0', unit: IOPS-month, price: "aws.rds.iops.{st}.{dep}" }
  - cost: { when: 'st == "gp3" && (iops ?? 0) > baseIops', name: "IOPS above {baseIops} (gp3)", quantity: '(iops ?? 0) - baseIops', unit: IOPS-month, price: "aws.rds.iops.gp3.{dep}" }
  - cost: { when: 'st == "gp3" && (storage_throughput ?? 0) > baseMibps', name: "Throughput above {baseMibps} MiBps (gp3)", quantity: '(storage_throughput ?? 0) - baseMibps', unit: MiBps-month, price: "aws.rds.throughput.gp3.{dep}" }
  - fail: { when: 'st == "standard" && ioPerQuery == nil', message: "ioPerQuery is required for magnetic storage, which bills I/O requests", continue: true }
  - cost: { when: 'st == "standard" && ioPerQuery != nil', name: I/O requests (magnetic), quantity: 'total.monthly * (ioPerQuery ?? 0)', unit: I/O request, price: aws.rds.magnetic.io }
  - storage: { when: backupGb > 0, name: Backup storage, gb: backupGb, price: aws.rds.backup }
  - cost: { when: burstable && cpuCreditVcpuHours > 0, name: "CPU credits ({family})", quantity: cpuCreditVcpuHours, unit: vCPU-hour, price: "aws.rds.cpu_credits.{key}.{family}" }
  - fail: { when: '(advanced || longRetention || extendedSupport != "none") && vcpus == nil', message: "vcpus is required: Database Insights, Performance Insights retention beyond 7 days and Extended Support bill per vCPU-hour", continue: true }
  - cost: { when: advanced, name: Database Insights (advanced), quantity: vcpu * 730, unit: vCPU-hour, price: aws.rds.insights.advanced }
  - cost: { when: longRetention, name: Performance Insights retention (first month), quantity: vcpu * 730, unit: vCPU-hour, price: aws.rds.insights.standard.first_month }
  - cost: { when: longRetention && retentionMonths > 1, name: "Performance Insights retention ({retentionMonths - 1} more months)", quantity: vcpu * 730 * (retentionMonths - 1), unit: vCPU-hour, price: aws.rds.insights.standard.additional_month }
  - cost: { when: insightsApiCalls > 0, name: Database Insights API, quantity: insightsApiCalls, unit: API call, price: aws.rds.insights.api }
  - cost: { when: 'extendedSupport != "none"', name: "Extended Support ({extendedSupport == \"year3\" ? \"year 3\" : \"years 1-2\"})", quantity: 'vcpu * 730 * (multi_az ? 2 : 1)', unit: vCPU-hour, price: "aws.rds.extended_support.{extendedSupport}" }
  - cost: { when: manage_master_user_password, name: Master password secret, quantity: 1, unit: secret-month, price: aws.secretsmanager.secret }
  - limit: { when: 'ioPerQuery != nil && st != "standard"', name: Storage IOPS, demand: 'total.peak * (ioPerQuery ?? 0)', unit: IOPS, capacity: volumeIops }
terraform:
  # An instance names its source, subnet group and keys; it calls none of them.
  passive: true
iam:
  query: ["rds-db:connect"]

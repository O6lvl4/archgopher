type: aws_cognito_user_pool
label: Cognito user pool
category: Security
icon: cognito
description: "Monthly active users priced by feature plan: Lite in volume tiers from 100,000, 1 million and 10 million MAU, Essentials and Plus flat. The always-free 10,000 MAU a month of Lite and Essentials is given once over every user pool of the account on either plan, and the Lite tiers are counted over the account too. Headroom is the sign-in and sign-up request rates, shared by every user pool in the account and region."
kinds: [sign_in]
sla: aws.cognito
attributes:
  - { key: user_pool_tier, label: Feature plan, type: choice, options: [LITE, ESSENTIALS, PLUS], default: ESSENTIALS }
assumptions:
  - { key: monthlyActiveUsers, label: Monthly active users, type: number, unit: users, hint: "Users who sign in, refresh a token or change their account in the month" }
  - { key: authRequestsPerSignIn, label: Auth requests per sign-in, type: number, default: 2, hint: "InitiateAuth and RespondToAuthChallenge; token refreshes count against the same rate" }
  - { key: signUpShare, label: Share of sign-ins that are sign-ups, type: number, default: 0, hint: "Each sign-up is SignUp and ConfirmSignUp against the user creation rate" }
let:
  - lite: 'user_pool_tier == "LITE"'
readings:
  - cost: { when: 'user_pool_tier == "ESSENTIALS"', name: Monthly active users, quantity: monthlyActiveUsers, unit: MAU, price: aws.cognito.essentials.mau }
  - cost: { when: 'user_pool_tier == "PLUS"', name: Monthly active users, quantity: monthlyActiveUsers, unit: MAU, price: aws.cognito.plus.mau }
  - cost: { when: lite, name: Monthly active users, quantity: monthlyActiveUsers, unit: MAU, price: aws.cognito.lite.mau }
  - rate: { name: Sign-in requests, unit: requests/second, quota: aws.cognito.user_authentication_rps, peak: total.peak * authRequestsPerSignIn }
  - rate: { when: signUpShare > 0, name: Sign-up requests, unit: requests/second, quota: aws.cognito.user_creation_rps, peak: total.peak * signUpShare * 2 }
terraform:
  # Browsers call Cognito directly, not through IAM: connect the entry to it by hand.
  frontDoor: true
  aliases: { aws_cognito_user_pool_client: user_pool_id, aws_cognito_user_pool_domain: user_pool_id, aws_cognito_risk_configuration: user_pool_id, aws_cognito_managed_login_branding: user_pool_id }
  ignoreRefs: [sms_configuration, email_configuration]

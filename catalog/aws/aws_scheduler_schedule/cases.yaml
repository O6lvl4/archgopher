# Worked examples: given these values and this load, the resource reads this.
# Monthly USD per cost line, peak demand per limit. After an intended change:
#   go test ./provider/aws -run TestCases -update
- name: invocations (us-east-1)
  region: us-east-1
  demand:
    fire:
        monthly: 2e+06
        peak: 40
  costs:
    Invocations: 0  # 2e6, within the account's always-free 14 million
- name: invocations (ap-northeast-1)
  region: ap-northeast-1
  demand:
    fire:
        monthly: 2e+06
        peak: 40
  costs:
    Invocations: 0  # 2e6, within the account's always-free 14 million
- name: past the always-free invocations (ap-northeast-1)
  region: ap-northeast-1
  demand:
    fire:
        monthly: 2e+07
        peak: 40
  costs:
    Invocations: 7.5  # (2e7 − 1.4e7 always free) / 1e6 × 1.25

# Worked examples: given these values and this load, the resource reads this.
# Monthly USD per cost line, peak demand per limit. After an intended change:
#   go test ./provider/aws -run TestCases -update
- name: publishes (us-east-1)
  region: us-east-1
  assumptions:
    messageKb: 70
  demand:
    publish:
        monthly: 2e+06
        peak: 40
  costs:
    Publishes: 2
  limits:
    Publish rate: 40
- name: publishes (ap-northeast-1)
  region: ap-northeast-1
  assumptions:
    messageKb: 70
  demand:
    publish:
        monthly: 2e+06
        peak: 40
  costs:
    Publishes: 2
  limits:
    Publish rate: 40
- name: FIFO topic publishes (ap-northeast-1)
  region: ap-northeast-1
  attributes:
    fifo_topic: true
  assumptions:
    messageKb: 70
  demand:
    publish:
        monthly: 2e+06
        peak: 40
  costs:
    # 2 chunks of 64 KB x 2,000,000 = 4 M requests x $0.39 per million
    Publishes (FIFO): 1.56
    # 70 KB x 2,000,000 / 1,048,576 = 133.514404 GB x $0.0221
    Publish payload (FIFO): 2.950668335

# Worked examples: given these values and this load, the resource reads this.
# Monthly USD per cost line, peak demand per limit. After an intended change:
#   go test ./provider/aws -run TestCases -update
- name: publishes (us-east-1)
  region: us-east-1
  assumptions:
    messageKb: 70
  demand:
    publish:
        monthly: 2e+06
        peak: 40
  costs:
    Publishes: 2
  limits:
    Publish rate: 40
- name: publishes (ap-northeast-1)
  region: ap-northeast-1
  assumptions:
    messageKb: 70
  demand:
    publish:
        monthly: 2e+06
        peak: 40
  costs:
    Publishes: 2
  limits:
    Publish rate: 40

# Worked examples: given these values and this load, the resource reads this.
# Expected values are computed by hand from the unit prices, not taken from the engine.
- name: standard resolution
  region: us-east-1
  attributes:
    period: 300
  demand:
    alarm:
      monthly: 0
      peak: 0
  costs:
    Alarm metrics (standard resolution): 0.1
- name: high resolution
  region: ap-northeast-1
  attributes:
    period: 10
  demand:
    alarm:
      monthly: 0
      peak: 0
  costs:
    Alarm metrics (high resolution): 0.3
- name: anomaly detection counts three metrics
  region: us-east-1
  attributes:
    period: 300
    threshold_metric_id: ad1
  demand:
    alarm:
      monthly: 0
      peak: 0
  costs:
    Alarm metrics (standard resolution): 0.3
- name: metric math over three metrics
  region: eu-west-1
  assumptions:
    metrics: 3
  demand:
    alarm:
      monthly: 0
      peak: 0
  costs:
    Alarm metrics (standard resolution): 0.3

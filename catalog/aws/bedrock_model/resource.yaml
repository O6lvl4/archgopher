type: bedrock_model
label: Bedrock model
category: AI
icon: bedrock
description: "Input, output and prompt-cache tokens. Headroom is tokens and requests per minute: output counts with the burndown multiplier, cache reads do not count."
kinds: [call]
sla: aws.bedrock
# A model is not a Terraform resource: place it by hand and connect its callers to it.
external: true
assumptions:
  - { key: model, label: Model, type: choice, options: [claude-sonnet-4-6, claude-sonnet-4-5, claude-haiku-4-5, claude-opus-4-5] }
  - { key: inference, label: Inference profile, type: choice, options: [global, regional], default: global, hint: "global routes to any commercial Region; regional stays in a geography (us., eu., jp., apac.) or the Region, at 10% more" }
includes: [tokens]
readings:
  - tokens:
      prefix: "aws.bedrock.{model}"
      pricePrefix: "aws.bedrock.{model}.{inference}"
      monthly: total.monthly
      peak: total.peak
      input: inputTokensPerCall
      output: outputTokensPerCall
      cacheRead: cacheReadShare
      cacheWrite: cacheWriteShare
# A model is called through its foundation-model or inference-profile ARN,
# and a policy on "*" with these actions can only mean a model.
iam:
  call: ["bedrock:InvokeModel", "bedrock:InvokeModelWithResponseStream", "bedrock:Converse", "bedrock:ConverseStream"]
arns: ["bedrock:foundation-model/*", "bedrock:inference-profile/*", "bedrock:application-inference-profile/*"]

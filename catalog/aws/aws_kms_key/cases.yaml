# Worked examples: given these values and this load, the resource reads this.
# Expected values are computed by hand from the unit prices, not taken from the engine.
- name: symmetric key without rotation
  region: us-east-1
  demand:
    crypt:
      monthly: 2000000.0
      peak: 50
  costs:
    Key versions: 1
    # 2e6 / 10,000 × 0.03 = 6
    Requests: 6
  limits:
    Symmetric request rate: 50
- name: 'rotated three times: two billed versions on top'
  region: ap-northeast-1
  attributes:
    enable_key_rotation: true
  assumptions:
    rotationsSoFar: 3
  demand:
    crypt:
      monthly: 100000.0
      peak: 5
  costs:
    Key versions: 3
    # 100,000 / 10,000 × 0.03 = 0.3
    Requests: 0.3
  limits:
    Symmetric request rate: 5
- name: asymmetric keys are not priced
  region: us-east-1
  attributes:
    customer_master_key_spec: RSA_2048
  demand:
    crypt:
      monthly: 1000
      peak: 1
  error: 'only symmetric and HMAC keys are priced: RSA_2048 requests cost more and
    have their own quota'

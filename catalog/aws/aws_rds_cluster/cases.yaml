- name: standard storage with a managed master password (us-east-1)
  region: us-east-1
  attributes:
    max_capacity: 16
    min_capacity: 0.5
    manage_master_user_password: true
  assumptions:
    averageAcu: 2
    ioPerQuery: 3
    peakAcu: 8
    storageGb: 100
  demand:
    query:
      monthly: 2e+06
      peak: 40
  costs:
    Capacity: 175.2
    I/O: 1.2
    Storage: 10
    Master password secret: 0.4
  limits:
    ACU: 8
- name: backups, Backtrack and a snapshot export (ap-northeast-1)
  region: ap-northeast-1
  attributes:
    backtrack_window: 86400
  assumptions:
    storageGb: 100
    ioPerQuery: 1
    backupGb: 200
    changeRecordsPerQuery: 2
    snapshotExportGb: 500
  demand:
    query:
      monthly: 1e+06
      peak: 40
  costs:
    Storage: 12
    I/O: 0.24
    Backup storage: 4.6
    Backtrack: 0.672
    Snapshot export: 6
- name: backups, Backtrack and a snapshot export (us-east-1)
  region: us-east-1

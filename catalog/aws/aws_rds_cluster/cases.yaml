- name: a Backtrack window without changeRecordsPerQuery (us-east-1)
  region: us-east-1
  attributes:
    backtrack_window: 3600
    storage_type: aurora-iopt1
  assumptions:
    storageGb: 100
  demand:
    query:
      monthly: 1e+06
      peak: 40
  costs:
    Storage: 22.5
  error: changeRecordsPerQuery is required with a backtrack window
- name: a Multi-AZ DB cluster is not Aurora (us-east-1)
  region: us-east-1

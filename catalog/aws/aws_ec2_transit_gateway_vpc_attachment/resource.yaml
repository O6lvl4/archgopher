type: aws_ec2_transit_gateway_vpc_attachment
label: Transit Gateway attachment
category: Network
icon: transit-gateway
description: "Attachment-hours and data processed. The transit gateway itself is free; each VPC attachment is billed to the account that owns it, which in a shared network is often the VPC owner, not the network team. Bandwidth (up to 100 Gbps per zone) is not read."
kinds: [traffic]
sla: aws.transitgateway
assumptions:
  - { key: gbPerMonth, label: Data sent into the transit gateway, type: number, unit: GB, default: 0, hint: "Data processing is charged to the attachment that sends the traffic" }
readings:
  - cost: { name: Attachment hours, quantity: 730, unit: hour, price: aws.transitgateway.vpc_attachment_hour }
  - cost: { name: Data processed, quantity: gbPerMonth, unit: GB, price: aws.transitgateway.data_processed }
terraform:
  # Route tables and security rules name the attachment; nothing calls it.
  mentioned: true
  passive: true

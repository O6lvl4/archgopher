# Worked examples: given these values and this load, the resource reads this.
# Expected values are computed by hand from the unit prices, not taken from the engine.
- name: two r5.large on io1 (ap-northeast-1)
  region: ap-northeast-1
  attributes:
    instance_type: r5.large.elasticsearch
    instance_count: 2
    ebs_enabled: true
    volume_type: io1
    volume_size: 100
    iops: 1000
  demand:
    request:
      monthly: 1000000
      peak: 10
  costs:
    Data nodes (r5.large.search): 327.04
    Storage (io1): 38.4
    io1 IOPS: 200.0
- name: one t3.small with a 10 GB gp2 volume (us-east-1)
  region: us-east-1
  attributes:
    instance_type: t3.small.elasticsearch
    ebs_enabled: true
  assumptions:
    storedGb: 6
  demand:
    request:
      monthly: 100000
      peak: 1
  costs:
    Data nodes (t3.small.search): 26.28
    Storage (gp2): 1.35
  limits:
    Volume storage: 6
- name: magnetic storage with three default masters (us-east-1)
  region: us-east-1
  attributes:
    instance_type: m4.large.elasticsearch
    instance_count: 2
    ebs_enabled: true
    volume_type: standard
    volume_size: 50
    dedicated_master_enabled: true
  demand:
    request:
      monthly: 100000
      peak: 1
  costs:
    Data nodes (m4.large.search): 220.46
    Storage (standard): 6.7
    Dedicated masters (m4.large.search): 330.69

# Worked examples: given these values and this load, the resource reads this.
# Expected values are computed by hand from the unit prices, not taken from the engine.
- name: m5.large at 30% of on-demand with a gp3 root (ap-northeast-1)
  region: ap-northeast-1
  attributes:
    instance_type: m5.large
    root_volume_type: gp3
    root_volume_size: 20
  assumptions:
    spotShare: 0.3
  demand:
    request:
      monthly: 0
      peak: 0
  # 730 h x 0.3 x 0.124; 20 GB x 0.096
  costs:
    Spot instance (linux, m5.large): 27.156
    Root volume (gp3): 1.92
- name: RHEL m5.large at 40% with detailed monitoring (us-east-1)
  region: us-east-1
  attributes:
    instance_type: m5.large
    monitoring: true
  assumptions:
    operatingSystem: rhel
    spotShare: 0.4
  demand:
    request:
      monthly: 0
      peak: 0
  # 730 h x 0.4 x 0.125; 7 x 0.30; 8 GB x 0.10
  costs:
    Spot instance (rhel, m5.large): 36.5
    Detailed monitoring: 0  # 7 metrics, within the account's 10 always-free metrics
    Root volume (gp2): 0.8
- name: no spot price share (us-east-1)
  region: us-east-1
  attributes:
    instance_type: t3.micro
  demand:
    request:
      monthly: 0
      peak: 0
  costs:
    Root volume (gp2): 0.8
  error: "spot instances run here: set spotShare"
- name: dedicated spot m5.large pays the regional fee (ap-northeast-1)
  region: ap-northeast-1
  attributes:
    instance_type: m5.large
    tenancy: dedicated
    root_volume_type: gp3
    root_volume_size: 20
  assumptions:
    spotShare: 0.3
  demand:
    request:
      monthly: 0
      peak: 0
  # 730 h x 0.3 x 0.132 (dedicated); 20 GB x 0.096; the region's Dedicated per region fee, 730 h x 2
  costs:
    Spot instance (linux, m5.large): 28.908
    Root volume (gp3): 1.92
    Dedicated per region fee: 1460

# Worked examples: given these values and this load, the resource reads this.
# Expected values are computed by hand from the unit prices, not taken from the engine.
- name: short crawls billed at the 10-minute minimum (ap-northeast-1)
  region: ap-northeast-1
  assumptions:
    runMinutes: 4
    dpus: 2
  demand:
    run:
      monthly: 30
      peak: 0.0001
  costs:
    Crawler runs: 4.4
  limits:
    Crawlers running: 0.024
- name: hourly 30-minute crawls at 5 DPUs (us-east-1)
  region: us-east-1
  attributes:
    schedule: cron(0 * * * ? *)
  assumptions:
    runMinutes: 30
    dpus: 5
  demand:
    run:
      monthly: 720
      peak: 0.0002777777777777778
  costs:
    Crawler runs: 792.0
  limits:
    Crawlers running: 0.5

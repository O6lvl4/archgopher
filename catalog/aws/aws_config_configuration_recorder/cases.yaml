# Worked examples: given these values and this load, the resource reads this.
# Expected values are computed by hand from the unit prices, not taken from the engine.
- name: continuous with custom items
  region: us-east-1
  assumptions:
    configItems: 10000
  demand:
    record:
      monthly: 1000
      peak: 1
  costs:
    Configuration items (continuous): 30
    Custom configuration items: 3
- name: daily recording
  region: ap-northeast-1
  attributes:
    recording_frequency: DAILY
  assumptions:
    configItems: 3000
  costs:
    Configuration items (daily): 36

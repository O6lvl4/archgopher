# Worked examples: given these values and this load, the resource reads this.
# Expected values are computed by hand from the unit prices, not taken from the engine.
- name: three rules, one referencing a group of 10, 20 million requests (ap-northeast-1)
  region: ap-northeast-1
  attributes:
    rules: 3
  assumptions:
    ruleGroupRules: 10
  demand:
    request:
      monthly: 2e+07
      peak: 200
  # $5; (3 + 10) × $1; 20 × $0.60 per million, us-east-1 prices everywhere
  costs:
    Web ACL: 5
    Rules: 13
    Inspected requests: 12.0
- name: no rules, a million requests (us-east-1)
  region: us-east-1
  demand:
    request:
      monthly: 1e+06
      peak: 10
  costs:
    Web ACL: 5
    Rules: 0
    Inspected requests: 0.6

# Worked examples: given these values and this load, the resource reads this.
# Expected values are computed by hand from the unit prices, not taken from the engine.
- name: change-triggered
  region: us-east-1
  assumptions:
    resources: 200
    changesPerResource: 3
  costs:
    Rule evaluations (first 100K): 0.6
- name: hourly periodic rule over 500 resources
  region: ap-northeast-1
  attributes:
    maximum_execution_frequency: One_Hour
  assumptions:
    resources: 500
  costs:
    Rule evaluations (first 100K): 100
    Rule evaluations (next 400K): 212
- name: all three tiers
  region: us-east-1
  attributes:
    maximum_execution_frequency: One_Hour
  assumptions:
    resources: 3000
  costs:
    Rule evaluations (first 100K): 100
    Rule evaluations (next 400K): 320
    Rule evaluations (over 500K): 845
- name: resources unknown
  region: us-east-1
  error: missing assumption "resources"

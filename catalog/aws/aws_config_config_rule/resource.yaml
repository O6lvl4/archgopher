type: aws_config_config_rule
label: Config rule
category: Management
icon: config
description: "Rule evaluations in volume tiers from 100,000 and 500,000 a month, counted over every rule of the account in the region. An evaluation is one resource checked once: on each configuration change for change-triggered rules, on each run for periodic ones, and on each on-demand start. A custom Lambda rule invokes its function once per evaluation: give the function that load by hand."
kinds: [evaluate]
sla: aws.config
attributes:
  - { key: maximum_execution_frequency, label: Run frequency, type: string, default: "", hint: "Set on periodic rules; periodic rules without it run every 24 hours" }
  - { key: owner, label: Rule owner, type: choice, options: [AWS, CUSTOM_LAMBDA, CUSTOM_POLICY], default: AWS, path: source.owner }
  - { key: message_type, label: Custom rule trigger, type: string, default: "", path: source.source_detail.message_type, hint: "ScheduledNotification makes a custom rule periodic" }
  - { key: detail_frequency, label: Custom rule run frequency, type: string, default: "", path: source.source_detail.maximum_execution_frequency, hint: "A custom periodic rule sets its frequency in source_detail" }
assumptions:
  - { key: resources, label: Resources in scope, type: number, unit: resources, hint: "Resources the rule checks in each account; 1 for a periodic rule that checks the account as a whole" }
  - { key: changesPerResource, label: Changes per resource per month, type: number, default: 1, hint: "Each recorded configuration change triggers one evaluation of a change-triggered rule; periodic rules ignore it" }
  - { key: periodicRule, label: Periodic, type: boolean, default: false, hint: "True for a managed periodic rule written without a frequency" }
let:
  - frequency: 'maximum_execution_frequency != "" ? maximum_execution_frequency : detail_frequency'
  - periodic: 'frequency != "" || message_type == "ScheduledNotification" || periodicRule'
  - changeTriggered: '!periodic'
  - hours: '{"One_Hour": 1, "Three_Hours": 3, "Six_Hours": 6, "Twelve_Hours": 12, "TwentyFour_Hours": 24}[frequency] ?? 24'
  - runs: 'periodic ? 730 / hours : 0'
  - perAccount: 'resources * ((changeTriggered ? changesPerResource : 0) + runs) + demand.evaluate.monthly * resources'
readings:
  - cost: { name: Rule evaluations, quantity: perAccount, unit: evaluation, price: aws.config.evaluations }
terraform:
  # Config evaluates the rule and invokes a custom rule's function on AWS's side.
  passive: true
iam:
  evaluate: ["config:StartConfigRulesEvaluation"]

# Worked examples: given these values and this load, the resource reads this.
# Expected values are computed by hand from the unit prices, not taken from the engine.
- name: started by Terraform, 2 KPUs (ap-northeast-1)
  region: ap-northeast-1
  attributes:
    start_application: true
  assumptions:
    kpus: 2
  demand:
    process:
      monthly: 0
      peak: 0
  costs:
    Processing (SQL): 207.32
- name: started outside Terraform (us-east-1)
  region: us-east-1
  assumptions:
    running: true
  demand:
    process:
      monthly: 0
      peak: 0
  costs:
    Processing (SQL): 80.3
- name: stopped (us-east-1)
  region: us-east-1
  demand:
    process:
      monthly: 0
      peak: 0

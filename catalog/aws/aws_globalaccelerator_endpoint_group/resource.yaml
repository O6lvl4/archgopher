type: aws_globalaccelerator_endpoint_group
label: Global Accelerator endpoint group
category: Edge
icon: global-accelerator
description: "The data transfer premium on each GB in the dominant direction (usually responses), priced by the location group of the endpoint group's region and where clients are: by default the same group. Accelerator traffic reaches it through its listener, and it passes the load on to its endpoints (load balancers, instances, Elastic IPs). Standard data transfer out is charged on top and is not read here. The accelerator carries the SLA, so the group adds no availability of its own."
kinds: [request]
attributes:
  - { key: endpoint_group_region, label: Endpoint group region, type: string, default: "", hint: "Empty: the region of the declaration" }
assumptions:
  - { key: kbPerUnit, label: Data per unit, type: number, unit: KB, optional: true, hint: "Per request, in the direction that carries more (usually the response)" }
  - { key: gbPerMonth, label: Other data per month, type: number, unit: GB, default: 0, hint: "Dominant-direction traffic not drawn as load" }
  - { key: clients, label: Clients in, type: choice, options: [region, NA, EU, AP, KR, IN, AU, ME, SA, ZA], default: region, hint: "Location of most clients: North America, Europe, Asia Pacific, South Korea, India and Southeast Asia, Australia and New Zealand, Middle East, South America, Africa. region picks the endpoints' group" }
let:
  - home: 'endpoint_group_region != "" ? endpoint_group_region : region'
  # Global Accelerator's source location groups: Seoul, the Indian and Southeast Asian
  # regions and the Australian and New Zealand regions are groups of their own.
  - from: >-
      home startsWith "us-" || home startsWith "ca-" || home startsWith "mx-" ? "NA" :
      home startsWith "eu-" || home startsWith "il-" ? "EU" :
      home == "ap-northeast-2" ? "KR" :
      home startsWith "ap-south-" || home in ["ap-southeast-3", "ap-southeast-5", "ap-southeast-7"] ? "IN" :
      home in ["ap-southeast-2", "ap-southeast-4", "ap-southeast-6"] ? "AU" :
      home startsWith "ap-" || home startsWith "cn-" ? "AP" :
      home startsWith "me-" ? "ME" :
      home startsWith "sa-" ? "SA" :
      home startsWith "af-" ? "ZA" : "NA"
  - to: 'clients == "region" ? from : clients'
readings:
  - fail: { when: 'total.monthly > 0 && kbPerUnit == nil', message: "load passes through this endpoint group: set kbPerUnit, the data each unit carries in the dominant direction" }
  - cost: { name: Data transfer premium, quantity: 'gbPerMonth + total.monthly * (kbPerUnit != nil ? kbPerUnit : 0.0) / 1024 / 1024', unit: GB, price: 'aws.globalaccelerator.premium.{from}-{to}' }
terraform:
  # The accelerator calls the group through its listener; the group calls its endpoints.
  links:
    - { type: aws_globalaccelerator_endpoint_group, from: listener_arn, to: [self] }
  ignoreRefs: [listener_arn, health_check_path, port_override]

# Worked examples: given these values and this load, the resource reads this.
# Expected values are computed by hand from the unit prices, not taken from the engine.
- name: Internet across three tiers, inter-region and within the region (ap-northeast-1)
  region: ap-northeast-1
  assumptions:
    intraRegionGb: 1000
    internetGb: 60000
    otherRegionsGb: 500
  costs:
    # 1000 GB x 2 x 0.01
    Within the region: 20
    # The free 100 GB first, then (10,240 - 100) = 10,140 x 0.114 = 1155.96; 40,960 x 0.089 = 3645.44;
    # (60,000 - 51,200) = 8,800 x 0.086 = 756.8; together 5558.2
    Out to the internet: 5558.2
    # 500 x 0.09
    To other regions: 45
- name: US East to US East and over 150 TB out (us-east-1)
  region: us-east-1
  assumptions:
    internetGb: 200000
    usEastGb: 1000
  costs:
    # The free 100 GB first, then 10,140 x 0.09 = 912.6; 40,960 x 0.085 = 3481.6; 102,400 x 0.07 = 7168;
    # 46,400 x 0.05 = 2320; together 13882.2
    Out to the internet: 13882.2
    # 1000 x 0.01
    To the other US East region: 10
- name: US East transfer written outside US East (eu-west-1)
  region: eu-west-1
  assumptions:
    usEastGb: 10
  error: otherRegionsGb

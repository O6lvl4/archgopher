# Worked examples: given these values and this load, the resource reads this.
# Monthly USD per cost line, peak demand per limit. After an intended change:
#   go test ./provider/aws -update
- name: RA3 with managed storage, concurrency scaling, Spectrum and backups (ap-northeast-1)
  region: ap-northeast-1
  attributes: { node_type: ra3.xlplus, number_of_nodes: 2 }
  assumptions: { storageGb: 10240, concurrencyScalingSeconds: 3600, spectrumTb: 2, backupGb: 60000 }
  demand: { query: { monthly: 1e+07, peak: 100 } }
  costs:
    Nodes (ra3.xlplus): 1865.88
    Managed storage: 267.264
    Concurrency scaling: 2.52
    Spectrum: 10
    Backup storage (first 50 TB): 1280
    Backup storage (next 450 TB): 211.2
  limits:
    Storage: 10
- name: single DC2 node (us-east-1)
  region: us-east-1
  attributes: { node_type: dc2.large }
  assumptions: { storageGb: 100 }
  demand: { query: { monthly: 1e+07, peak: 100 } }
  costs:
    Nodes (dc2.large): 182.5
  limits:
    Storage: 0.09765625
- name: a node type that needs two nodes (us-east-1)
  region: us-east-1
  attributes: { node_type: ra3.4xlarge }
  assumptions: { storageGb: 100 }
  demand: { query: { monthly: 1e+07, peak: 100 } }
  error: needs at least two nodes
- name: Multi-AZ RA3 bills the nodes in both zones (ap-northeast-1)
  region: ap-northeast-1
  attributes: { node_type: ra3.xlplus, number_of_nodes: 2, multi_az: true }
  assumptions: { storageGb: 1024 }
  demand: { query: { monthly: 1e+07, peak: 100 } }
  costs:
    Nodes (ra3.xlplus, Multi-AZ): 3731.76
    Managed storage: 26.7264
  limits:
    Storage: 1
- name: Multi-AZ on DC2 (us-east-1)
  region: us-east-1
  attributes: { node_type: dc2.large, number_of_nodes: 2, multi_az: true }
  assumptions: { storageGb: 100 }
  demand: { query: { monthly: 1e+07, peak: 100 } }
  error: Multi-AZ needs an RA3 or RG node type
- name: single RG node, backups at one price without tiers (ap-northeast-1)
  region: ap-northeast-1
  attributes: { node_type: rg.large }
  assumptions: { storageGb: 1024, backupGb: 60000 }
  demand: { query: { monthly: 1e+07, peak: 100 } }
  costs:
    Nodes (rg.large): 326.529         # 730 h x $0.4473
    Managed storage: 26.7264          # 1,024 GB x $0.0261
    Backup storage: 1500              # 60,000 GB x $0.025, no 50 TB tier on RG
  limits:
    Storage: 1

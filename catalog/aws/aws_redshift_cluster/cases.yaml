# Worked examples: given these values and this load, the resource reads this.
# Monthly USD per cost line, peak demand per limit. After an intended change:
#   go test ./provider/aws -update
- name: RA3 with managed storage, concurrency scaling, Spectrum and backups (ap-northeast-1)
  region: ap-northeast-1
  attributes: { node_type: ra3.xlplus, number_of_nodes: 2 }
  assumptions: { storageGb: 10240, concurrencyScalingSeconds: 3600, spectrumTb: 2, backupGb: 60000 }
  demand: { query: { monthly: 1e+07, peak: 100 } }
  costs:
    Nodes (ra3.xlplus): 1865.88
    Managed storage: 267.264
    Concurrency scaling: 2.52
    Spectrum: 10
    Backup storage (first 50 TB): 1280
    Backup storage (next 450 TB): 211.2
  limits:
    Storage: 10
- name: single DC2 node (us-east-1)
  region: us-east-1
  attributes: { node_type: dc2.large }
  assumptions: { storageGb: 100 }
  demand: { query: { monthly: 1e+07, peak: 100 } }
  costs:
    Nodes (dc2.large): 182.5
  limits:
    Storage: 0.09765625
- name: a node type that needs two nodes (us-east-1)
  region: us-east-1
  attributes: { node_type: ra3.4xlarge }
  assumptions: { storageGb: 100 }
  demand: { query: { monthly: 1e+07, peak: 100 } }
  error: needs at least two nodes

# Worked examples: given these values and this load, the resource reads this.
# Monthly USD per cost line, peak demand per limit. After an intended change:
#   go test ./provider/aws -run TestCases -update
- name: 40 KB responses (us-east-1)
  region: us-east-1
  assumptions:
    responseKb: 40
  demand:
    request:
      monthly: 2e+06
      peak: 40
  costs:
    HTTPS requests: 2
    Transfer out: 6.484985352
  limits:
    Requests per distribution: 40
- name: 40 KB responses (ap-northeast-1)
  region: ap-northeast-1
  assumptions:
    responseKb: 40
  demand:
    request:
      monthly: 2e+06
      peak: 40
  costs:
    HTTPS requests: 2.4
    Transfer out: 8.697509766
  limits:
    Requests per distribution: 40
- name: Frankfurt picks the Europe zone
  region: eu-central-1
  assumptions:
    responseKb: 40
  demand:
    request:
      monthly: 2000000.0
      peak: 40
  costs:
    HTTPS requests: 2.4
    Transfer out: 6.484985352
  limits:
    Requests per distribution: 40
- name: Viewers in India, served from us-east-1
  region: us-east-1
  assumptions:
    responseKb: 40
    viewers: in
  demand:
    request:
      monthly: 2000000.0
      peak: 40
  costs:
    HTTPS requests: 2.4
    Transfer out: 8.316040039
  limits:
    Requests per distribution: 40
# Past two transfer tiers: 1e9 × 64 KB / 1024 / 1024 = 61035.15625 GB.
# Transfer out, tier by tier: 10240 × 0.114 = 1167.36; 40960 × 0.089 = 3645.44;
# (61035.15625 − 51200) × 0.086 = 845.8234375; together 5658.6234375.
# HTTPS: 1e9 / 10000 × 0.012 = 1200.
- name: transfer past two volume tiers (ap-northeast-1)
  region: ap-northeast-1
  assumptions:
    responseKb: 64
  demand:
    request:
      monthly: 1e+09
      peak: 40
  costs:
    HTTPS requests: 1200
    Transfer out: 5658.6234375
  limits:
    Requests per distribution: 40

# Worked examples: given these values and this load, the resource reads this.
# Monthly USD per cost line, peak demand per limit. After an intended change:
#   go test ./provider/aws -run TestCases -update
- name: 40 KB responses (us-east-1)
  region: us-east-1
  assumptions:
    responseKb: 40
  demand:
    request:
      monthly: 2e+06
      peak: 40
  # 2e6 requests and 2e6 × 40 KB = 76.3 GB: within the account's always-free
  # 10 million requests and 1,024 GB.
  costs:
    HTTPS requests: 0
    Transfer out: 0
  limits:
    Requests per distribution: 40
- name: 40 KB responses (ap-northeast-1)
  region: ap-northeast-1
  assumptions:
    responseKb: 40
  demand:
    request:
      monthly: 2e+06
      peak: 40
  # 2e6 requests and 2e6 × 40 KB = 76.3 GB: within the account's always-free
  # 10 million requests and 1,024 GB.
  costs:
    HTTPS requests: 0
    Transfer out: 0
  limits:
    Requests per distribution: 40
- name: Frankfurt picks the Europe zone
  region: eu-central-1
  assumptions:
    responseKb: 40
  demand:
    request:
      monthly: 2000000.0
      peak: 40
  # 2e6 requests and 2e6 × 40 KB = 76.3 GB: within the account's always-free
  # 10 million requests and 1,024 GB.
  costs:

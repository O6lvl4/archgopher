- name: Viewers in India, served from us-east-1
  region: us-east-1
  assumptions:
    responseKb: 40
    viewers: in
  demand:
    request:
      monthly: 2000000.0
      peak: 40
  # Within the account's always-free 10 million requests and 1,024 GB.
  costs:
    HTTPS requests: 0
    Transfer out: 0
  limits:
    Requests per distribution: 40
# Past two transfer tiers: 1e9 × 64 KB / 1024 / 1024 = 61035.15625 GB.
# Transfer out, tier by tier, the first 1,024 GB always free: (10240 − 1024) × 0.114 = 1050.624;
# 40960 × 0.089 = 3645.44; (61035.15625 − 51200) × 0.086 = 845.8234375; together 5541.8874375.
# HTTPS: (1e9 − 1e7 always free) / 10000 × 0.012 = 1188.
- name: transfer past two volume tiers (ap-northeast-1)
  region: ap-northeast-1
  assumptions:
    responseKb: 64
  demand:
    request:
      monthly: 1e+09
      peak: 40
  costs:
    HTTPS requests: 1188
    Transfer out: 5541.8874375
  limits:
    Requests per distribution: 40

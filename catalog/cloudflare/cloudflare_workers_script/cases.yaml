# Worked examples: given these values and this load, the resource reads this.
# Expected values are computed by hand from the unit prices, not taken from the engine.
- name: 15 million requests at 7 ms of CPU
  region: us-east-1
  assumptions:
    cpuMsPerRequest: 7
  demand:
    request:
      monthly: 15000000.0
      peak: 20
  costs:
    # Requests: (15M - 10M free) x $0.30/M = 1.5
    Requests: 1.5
    # CPU time: 15M x 7 = 105M ms; (105M - 30M free) x $0.02/M = 1.5
    CPU time: 1.5
  limits:
    CPU time per request: 7
- name: a 50 ms CPU limit, in Tokyo
  region: ap-northeast-1
  attributes:
    cpu_ms_limit: 50
  assumptions:
    cpuMsPerRequest: 80
  demand:
    request:
      monthly: 1000000.0
      peak: 2
  costs:
    # Requests: 1M, all within the 10M free
    Requests: 0
    # CPU time: 1M x 80 = 80M ms; (80M - 30M free) x $0.02/M = 1
    CPU time: 1
  limits:
    CPU time per request: 80

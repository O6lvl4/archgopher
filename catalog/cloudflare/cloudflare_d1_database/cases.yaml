# Worked examples: given these values and this load, the resource reads this.
# Expected values are computed by hand from the unit prices, not taken from the engine.
- name: 20 rows scanned per read, an index on every write
  region: us-east-1
  assumptions:
    storageGb: 3
    rowsPerRead: 20
    rowsPerWrite: 2
  demand:
    read:
      monthly: 30000000.0
      peak: 50
    write:
      monthly: 3000000.0
      peak: 10
  costs:
    # All within the free units: 600M of 25B rows read, 6M of 50M rows written, 3 of 5 GB
    Rows read: 0
    Rows written: 0
    Storage: 0
  limits:
    Database size: 3
    Queries per second: 60
- name: 20 ms queries on a 12 GB database
  region: ap-northeast-1
  assumptions:
    storageGb: 12
    queryMs: 20
  demand:
    read:
      monthly: 1000000.0
      peak: 40
    write:
      monthly: 100000.0
      peak: 5
  costs:
    # Rows within the free units (1M of 25B read, 100k of 50M written)
    Rows read: 0
    Rows written: 0
    # Storage: (12 - 5 GB free) x $0.75 = 5.25
    Storage: 5.25
  limits:
    Database size: 12
    Queries per second: 45
- name: a busy database beyond the included rows
  region: us-east-1
  assumptions:
    storageGb: 4
    rowsPerRead: 20
    rowsPerWrite: 2
  demand:
    read:
      monthly: 2000000000.0
      peak: 800
    write:
      monthly: 30000000.0
      peak: 12
  costs:
    # Rows read: 2B x 20 = 40B; (40B - 25B free) x $0.001/M = 15
    Rows read: 15
    # Rows written: 30M x 2 = 60M; (60M - 50M free) x $1/M = 10
    Rows written: 10
    # Storage: 4 of 5 GB free
    Storage: 0
  limits:
    Database size: 4
    Queries per second: 812

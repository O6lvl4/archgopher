# Worked examples: given these values and this load, the resource reads this.
# Expected values are computed by hand from the unit prices, not taken from the engine.
- name: 100 million reads
  region: us-east-1
  assumptions:
    storageGb: 5
  demand:
    read:
      monthly: 100000000.0
      peak: 500
    write:
      monthly: 2000000.0
      peak: 10
  costs:
    # Reads: (100M - 10M free) x $0.50/M = 45
    Reads: 45
    # Writes: (2M - 1M free) x $5/M = 5
    Writes: 5
    # Stored data: (5 - 1 GB free) x $0.50 = 2
    Stored data: 2
  limits:
    Writes to one key: 0
- name: a counter key written three times a second, in Tokyo
  region: japaneast
  assumptions:
    storageGb: 0.2
    sameKeyWritesPerSecond: 3
  demand:
    read:
      monthly: 1000000.0
      peak: 5
    write:
      monthly: 500000.0
      peak: 3
  costs:
    # All within the free units: 1M of 10M reads, 0.5M of 1M writes, 0.2 of 1 GB
    Reads: 0
    Writes: 0
    Stored data: 0
  limits:
    Writes to one key: 3

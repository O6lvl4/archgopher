# Worked examples: given these values and this load, the resource reads this.
# Expected values are computed by hand from the unit prices, not taken from the engine.
- name: 100 million reads
  region: us-east-1
  assumptions:
    storageGb: 5
  demand:
    read:
      monthly: 100000000.0
      peak: 500
    write:
      monthly: 2000000.0
      peak: 10
  costs:
    Reads: 50
    Writes: 10
    Stored data: 2.5
  limits:
    Writes to one key: 0
- name: a counter key written three times a second, in Tokyo
  region: japaneast
  assumptions:
    storageGb: 0.2
    sameKeyWritesPerSecond: 3
  demand:
    read:
      monthly: 1000000.0
      peak: 5
    write:
      monthly: 500000.0
      peak: 3
  costs:
    Reads: 0.5
    Writes: 2.5
    Stored data: 0.1
  limits:
    Writes to one key: 3

type: workers_ai_model
label: Workers AI model
category: AI
description: "Input, output and cached input tokens of a text generation model, at the per-model token prices Cloudflare derives from $0.011 per 1,000 neurons, beyond the 10,000 neurons a day the plan includes. Headroom is requests per minute per model; no tokens-per-minute limit is published."
kinds: [call]
sla: cloudflare.workers_ai
# A model is not a Terraform resource: place it by hand and connect its callers to it.
external: true
assumptions:
  - { key: model, label: Model, type: choice, options: [llama-3.1-8b-instruct-fp8-fast, llama-3.3-70b-instruct-fp8-fast, llama-4-scout-17b-16e-instruct, mistral-small-3.1-24b-instruct, gemma-3-12b-it, deepseek-v4-flash-0731], hint: "The @cf/ model name without its publisher; only deepseek-v4-flash-0731 has a cached input price" }
includes: [tokens]
readings:
  - tokens:
      prefix: "cloudflare.workers_ai.{model}"
      monthly: total.monthly
      peak: total.peak
      input: inputTokensPerCall
      output: outputTokensPerCall
      cacheRead: cacheReadShare
      cacheWrite: cacheWriteShare

# Worked examples: given these values and this load, the resource reads this.
# Expected values are computed by hand from the unit prices, not taken from the engine.
# Duration is objects x 730 h x 3,600 s x 0.128 GB: 10 objects make 3,363,840 GB-s.
- name: ten objects with SQL storage
  region: us-east-1
  assumptions:
    activeObjects: 10
    rowsReadPerRequest: 4
    rowsWrittenPerRequest: 1
    storageGb: 2
    hotShare: 0.1
  demand:
    request:
      monthly: 5000000.0
      peak: 50
  costs:
    # Requests: (5M - 1M free) x $0.15/M = 0.6
    Requests: 0.6
    # Duration: (3,363,840 - 400,000 free) x $12.50/M = 37.048
    Duration: 37.048
    # Rows within the free units: 20M of 25B read, 5M of 50M written; storage 2 of 5 GB-month
    Rows read: 0
    Rows written: 0
    SQL storage: 0
  limits:
    Requests per second per object: 5
- name: one chat room held open all month, in Japan East
  region: japaneast
  assumptions:
    activeObjects: 1
  demand:
    request:
      monthly: 2000000.0
      peak: 1200
  costs:
    # Requests: (2M - 1M free) x $0.15/M = 0.15
    Requests: 0.15
    # Duration: 336,384 GB-s, within the 400,000 free
    Duration: 0
    SQL storage: 0
  limits:
    Requests per second per object: 1200

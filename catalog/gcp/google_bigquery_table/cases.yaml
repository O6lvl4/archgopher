# Worked examples: given these values and this load, the resource reads this.
# Expected values are computed by hand from the unit prices, not taken from the engine.
# Storage: the first 10 GiB free on each, (100 − 10) × 0.023 = 2.07 and (500 − 10) × 0.016 = 7.84.
# Queries: 100 × 10 / 1024 = 0.9765625 TiB, within the free TiB.
- name: Tokyo, streaming inserts of 1 KB rows, some long-term storage
  region: asia-northeast1
  assumptions:
    activeGb: 100
    longTermGb: 500
    scannedGb: 10
  demand:
    write:
      monthly: 1.0e+07
      peak: 100
    query:
      monthly: 100
      peak: 0.1
    read:
      monthly: 0
      peak: 0
  costs:
    Active storage: 2.07
    Long-term storage: 7.84
    Streaming inserts: 0.5859375
    Queries: 0
  limits:
    Streaming throughput: 0.1
# Storage: (1000 − 10) × 0.02 = 19.8. Write API: 5e7 × 2 / 1048576 = 95.367 GiB, within the free 2 TiB.
# Queries: 10000 / 1024 = 9.765625 TiB, (9.765625 − 1) × 6.25 = 54.78515625.
# Read API: 1000 / 1024 = 0.9765625 TiB, within the free 300 TiB.
- name: US multi-region, Storage Write API with 2 KB rows and Storage Read API readers
  region: us-east4
  assumptions:
    location: US
    activeGb: 1000
    writeApi: Storage Write API
    rowKb: 2
  demand:
    write:
      monthly: 5.0e+07
      peak: 1000
    query:
      monthly: 10000
      peak: 1
    read:
      monthly: 1000
      peak: 1
  costs:
    Active storage: 19.8
    Storage Write API: 0
    Queries: 54.78515625
    Storage Read API: 0
  limits:
    Streaming throughput: 2
# Past the free tiers. Storage: 5 GiB, within the free 10 GiB.
# Write API: 3e9 × 1 / 1048576 = 2861.02294921875 GiB, (2861.02294921875 − 2048) × 0.03 = 24.3906884765625.
# Read API: 400 × 1024 / 1024 = 400 TiB, (400 − 300) × 1.32 = 132.
- name: Tokyo, a busy Storage Write API table read by Spark through the Storage Read API
  region: asia-northeast1
  assumptions:
    activeGb: 5
    writeApi: Storage Write API
    readGb: 1024
  demand:
    write:
      monthly: 3.0e+09
      peak: 2000
    query:
      monthly: 0
      peak: 0
    read:
      monthly: 400
      peak: 1
  costs:
    Active storage: 0
    Storage Write API: 24.3906884765625
    Queries: 0
    Storage Read API: 132
  limits:
    Streaming throughput: 2

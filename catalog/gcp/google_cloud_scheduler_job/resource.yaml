type: google_cloud_scheduler_job
label: Cloud Scheduler job
category: Scheduling
description: "One job-month per job, paused jobs included; executions are free. Free jobs are ignored, as every free tier. The cron schedule is not read into load yet: give the node a load by hand to send it on to its target."
kinds: [fire]
sla: gcp.scheduler
readings:
  - cost: { name: Jobs, quantity: 1, unit: job-month, price: gcp.scheduler.job }
terraform:
  # http_target.uri and pubsub_target.topic_name are the calls; the tokens and
  # retry settings are not.
  ignoreRefs: [http_target.oidc_token, http_target.oauth_token, retry_config]

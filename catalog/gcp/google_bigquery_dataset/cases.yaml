# Worked examples: given these values and this load, the resource reads this.
# Expected values are computed by hand from the unit prices, not taken from the engine.
# 1000 × 100 / 1024 = 97.65625 TiB; the first TiB free, (97.65625 − 1) × 6.25 = 604.1015625.
- name: US multi-region (the Terraform default), 100 GiB a query
  region: asia-northeast1
  assumptions:
    scannedGb: 100
  demand:
    query:
      monthly: 1000
      peak: 1
  costs:
    Queries: 604.1015625
# 3000 × 10 / 1024 = 29.296875 TiB; the first TiB free, (29.296875 − 1) × 7.5 = 212.2265625.
- name: Tokyo dataset, 10 GiB a query
  region: asia-northeast1
  attributes:
    location: asia-northeast1
  assumptions:
    scannedGb: 10
  demand:
    query:
      monthly: 3000
      peak: 1
  costs:
    Queries: 212.2265625

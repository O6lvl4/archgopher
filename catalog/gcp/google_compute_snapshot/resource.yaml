type: google_compute_snapshot
label: Disk snapshot
category: Storage
icon: persistent-disk
description: "Standard or archive snapshot storage, GiB-months, in the multi-region nearest the region (the default) or in the one region storage_locations names. The source disk's size stands in for the stored size (the first snapshot holds the disk's used blocks, compressed) unless storedGb says it."
kinds: [read]
attributes:
  - { key: snapshot_type, label: Snapshot type, type: choice, options: [STANDARD, ARCHIVE], default: STANDARD }
  - { key: storage_locations, label: Storage locations, type: list, optional: true, hint: "A region (asia-northeast1) stores it regionally; a multi-region (asia) or none uses the multi-regional price" }
  - { key: source_disk_size, label: Source disk size, type: number, unit: GiB, optional: true, path: source_disk->size, hint: "The google_compute_disk it is taken of" }
assumptions:
  - { key: storedGb, label: Stored size, type: number, unit: GiB, optional: true, hint: "The snapshot's storage size (used, compressed blocks); overrides the source disk's size" }
let:
  - gb: 'storedGb ?? source_disk_size ?? -1.0'
  - loc: 'len(storage_locations) > 0 ? lower(storage_locations[0]) : ""'
  - regional: 'loc matches "[0-9]$"'
  # The multi-region storage_locations names, or the one nearest the region.
  - multi: 'loc in ["asia", "eu", "us"] ? loc : region startsWith "europe" ? "eu" : (region startsWith "us" || region startsWith "northamerica") ? "us" : (region startsWith "asia" || region startsWith "australia") ? "asia" : ""'
  - kind: 'snapshot_type == "ARCHIVE" ? "archive" : "standard"'
readings:
  - fail: { when: 'gb < 0', message: "the snapshot's size is unknown: set storedGb" }
  - fail: { when: '!regional && multi == ""', message: "no multi-region is known to be nearest {region}: set storage_locations" }
  - storage: { name: 'Snapshot storage ({kind}, {regional ? "regional" : "multi-regional"})', gb: gb, price: 'gcp.compute.snapshot.{kind}{regional ? "" : "_multi_regional." + multi}' }
terraform:
  # A snapshot names its source disk; it calls nothing.
  passive: true

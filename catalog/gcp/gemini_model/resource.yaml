type: gemini_model
label: Gemini model
category: AI
description: "Input, output and cached input tokens at the 200K-and-under context tier on Vertex AI Standard PayGo. Headroom is the organization's tokens per minute at usage Tier 1; cache reads do not count."
kinds: [call]
sla: gcp.gemini
# A model is not a Terraform resource: place it by hand and connect its callers to it.
external: true
assumptions:
  - { key: model, label: Model, type: choice, options: [gemini-2.5-pro, gemini-2.5-flash, gemini-2.5-flash-lite] }
includes: [tokens]
readings:
  - tokens:
      prefix: "gcp.gemini.{model}"
      monthly: total.monthly
      peak: total.peak
      input: inputTokensPerCall
      output: outputTokensPerCall
      cacheRead: cacheReadShare
      cacheWrite: cacheWriteShare
iam:
  call: ["roles/aiplatform.user"]

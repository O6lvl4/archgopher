type: google_api_gateway_gateway
label: API Gateway
category: Networking
icon: api-gateway
description: "Calls per million in volume tiers counted over the billing account: the first 2M a month free, then $3 per million to 1B and $1.50 above. Headroom is Service Control quota units, at most one per call."
kinds: [request]
sla: gcp.apigateway
readings:
  - requests: { name: Calls, price: gcp.apigateway.calls, unit: call, count: total.monthly }
  - limit: { name: Service Control quota, demand: total.peak, unit: quota units/second, quota: gcp.apigateway.quota_units }
terraform:
  frontDoor: true
  # The API and its config fold into the gateway: the gateway's reference to
  # the config resolves to the backends its OpenAPI document names.
  aliases: { google_api_gateway_api_config: openapi_documents }

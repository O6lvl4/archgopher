# Worked examples: given these values and this load, the resource reads this.
# Expected values are computed by hand from the unit prices, not taken from the engine.
# Within the billing account's free 2M calls.
- name: Tokyo, one million calls
  region: asia-northeast1
  demand:
    request:
      monthly: 1.0e+06
      peak: 10
  costs:
    Calls: 0
  limits:
    Service Control quota: 10
# The first 2M free, (5e8 − 2e6) / 1e6 × 3 = 1494.
- name: Northern Virginia, 500 million calls
  region: us-east4
  demand:
    request:
      monthly: 5.0e+08
      peak: 2000
  costs:
    Calls: 1494
  limits:
    Service Control quota: 2000
# Past 1B: 2M free, (1e9 − 2e6) / 1e6 × 3 = 2994, (2e9 − 1e9) / 1e6 × 1.5 = 1500; together 4494.
- name: Iowa, two billion calls
  region: us-central1
  demand:
    request:
      monthly: 2.0e+09
      peak: 5000
  costs:
    Calls: 4494
  limits:
    Service Control quota: 5000

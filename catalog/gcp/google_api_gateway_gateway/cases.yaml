# Worked examples: given these values and this load, the resource reads this.
# Expected values are computed by hand from the unit prices, not taken from the engine.
# The first tier: 1e6 / 1e6 × 3 = 3.
- name: Tokyo, one million calls
  region: asia-northeast1
  demand:
    request:
      monthly: 1.0e+06
      peak: 10
  costs:
    Calls: 3
  limits:
    Service Control quota: 10
# 5e8 / 1e6 × 3 = 1500.
- name: Northern Virginia, 500 million calls
  region: us-east4
  demand:
    request:
      monthly: 5.0e+08
      peak: 2000
  costs:
    Calls: 1500
  limits:
    Service Control quota: 2000
# Past 1B: 1e9 / 1e6 × 3 = 3000, (2e9 − 1e9) / 1e6 × 1.5 = 1500; together 4500.
- name: Iowa, two billion calls
  region: us-central1
  demand:
    request:
      monthly: 2.0e+09
      peak: 5000
  costs:
    Calls: 4500
  limits:
    Service Control quota: 5000

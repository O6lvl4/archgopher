type: google_pubsub_topic
label: Pub/Sub topic
category: Messaging
icon: pubsub
description: "Throughput per TiB: each message is billed once published, at 1,000 bytes minimum, and once more for every subscription not declared as a node. A google_pubsub_subscription is its own node that bills its deliveries and storage. The first 10 GiB of throughput a month are free, counted over the billing account. Topic message retention is not counted. Headroom is the region's publish throughput."
kinds: [publish]
sla: gcp.pubsub
assumptions:
  - { key: messageKb, label: Message size, type: number, unit: kB, default: 1, hint: "1 kB is 1,000 bytes; each publish and delivery bills at least 1,000 bytes" }
  - { key: subscriptions, label: Subscriptions outside the declaration, type: number, default: 0, hint: "Each receives every message and bills its bytes again; a google_pubsub_subscription node bills its own deliveries" }
let:
  - billedKb: 'max(messageKb, 1)'
readings:
  - cost: { name: Throughput, quantity: 'total.monthly * billedKb * 1000 / 1099511627776 * (1 + subscriptions)', unit: TiB, price: gcp.pubsub.throughput }
  - limit: { name: Publish throughput, demand: 'total.peak * billedKb * 60', unit: kB/minute, quota: gcp.pubsub.publish_throughput }
terraform:
  links:
    - { type: google_pubsub_subscription, from: topic, to: [push_config.push_endpoint] }
  ignoreRefs: [kms_key_name, schema_settings]
iam:
  publish: ["roles/pubsub.publisher"]

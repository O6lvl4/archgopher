type: google_cloudfunctions_function
label: Cloud Run function (1st gen)
category: Compute
icon: cloud-functions
description: "Compute time in 100 ms increments: GB-seconds of memory and GHz-seconds of the CPU that comes with the memory size, invocations, idle minimum instances and outbound data. One invocation per instance. Headroom is instances needed against max instances. An event trigger's topic or bucket calls the function."
kinds: [invoke]
sla: gcp.functions
attributes:
  - { key: available_memory_mb, label: Memory, type: number, unit: MB, default: 256, path: available_memory_mb, hint: "128 to 32768; the CPU comes with it: 0.2 GHz for 128 MB up to 4.8 GHz for 4 GB" }
  - { key: max_instances, label: Max instances, type: number, default: 0, path: max_instances, hint: "0 sets no limit of its own" }
  - { key: min_instances, label: Min instances, type: number, default: 0, path: min_instances, hint: "Minimum instances bill their idle time" }
assumptions:
  - { key: durationMs, label: Invocation duration, type: number, unit: ms, hint: "Billed rounded up to the next 100 ms" }
  - { key: outboundGb, label: Outbound data, type: number, unit: GB, default: 0, hint: "Data sent outside the region; Google APIs in the same region are free" }
let:
  - gb: 'available_memory_mb / 1024'
  - ghz: 'available_memory_mb <= 128 ? 0.2 : available_memory_mb <= 256 ? 0.4 : available_memory_mb <= 512 ? 0.8 : available_memory_mb <= 1024 ? 1.4 : available_memory_mb <= 2048 ? 2.4 : available_memory_mb <= 8192 ? 4.8 : available_memory_mb <= 16384 ? 9.6 : 19.2'
  - activeSeconds: 'total.monthly * ceilDiv(durationMs, 100) * 0.1'
  - idleSeconds: 'max(min_instances * 730 * 3600 - activeSeconds, 0)'
readings:
  - cost: { name: Memory, quantity: activeSeconds * gb, unit: GB-second, price: gcp.functions.v1.memory }
  - cost: { name: CPU, quantity: activeSeconds * ghz, unit: GHz-second, price: gcp.functions.v1.cpu }
  - requests: { name: Invocations, price: gcp.functions.v1.invocations, unit: invocation, count: total.monthly }
  - cost: { when: idleSeconds > 0, name: Idle minimum instances memory, quantity: idleSeconds * gb, unit: GB-second, price: gcp.functions.v1.memory }
  - cost: { when: idleSeconds > 0, name: Idle minimum instances CPU, quantity: idleSeconds * ghz, unit: GHz-second, price: gcp.functions.v1.idle_cpu }
  - cost: { when: outboundGb > 0, name: Outbound data, quantity: outboundGb, unit: GB, price: gcp.functions.v1.egress }
  - limit: { name: Instances, demand: 'ceilDiv(total.peak * durationMs / 1000, 1)', unit: instances, quota: gcp.functions.v1.max_instances, capacity: 'max_instances > 0 ? max_instances : nil' }
terraform:
  frontDoor: true
  # The trigger's topic or bucket invokes the function: the reference points
  # the other way, so it is a link from the trigger to the function.
  links:
    - { type: google_cloudfunctions_function, from: event_trigger.resource, to: [] }
  ignoreRefs: [event_trigger, source_archive_bucket, source_archive_object, vpc_connector]
iam:
  invoke: ["roles/cloudfunctions.invoker"]

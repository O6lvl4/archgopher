# Worked examples: given these values and this load, the resource reads this.
# Expected values are computed by hand from the unit prices, not taken from the engine.
# 1e6 tasks × 2 operations = 2e6; the first million free, (2e6 − 1e6) / 1e6 × 0.4 = 0.4.
- name: small tasks under a queue rate limit
  region: us-east4
  attributes:
    max_dispatches_per_second: 100
  demand:
    enqueue:
      monthly: 1000000.0
      peak: 50
  costs:
    Operations: 0.4
  limits:
    Dispatch rate: 50
# 1e6 tasks × 2 chunks × 2 operations = 4e6; the first million free, (4e6 − 1e6) / 1e6 × 0.4 = 1.2.
- name: 40 KB tasks count two chunks each
  region: asia-northeast1
  assumptions:
    taskKb: 40
  demand:
    enqueue:
      monthly: 1000000.0
      peak: 50
  costs:
    Operations: 1.2
  limits:
    Dispatch rate: 50

type: google_cloud_tasks_queue
label: Cloud Tasks queue
category: Messaging
icon: cloud-tasks
description: "Billable operations: API calls and push delivery attempts, in 32 KB chunks. Free operations are not counted. Headroom is the dispatch rate against the queue's max dispatches per second."
kinds: [enqueue]
sla: gcp.tasks
attributes:
  - { key: max_dispatches_per_second, label: Max dispatches per second, type: number, optional: true, path: rate_limits.max_dispatches_per_second }
assumptions:
  - { key: operationsPerTask, label: Billable operations per task, type: number, default: 2, hint: "Creating the task and one delivery attempt; retries and list calls add more" }
  - { key: taskKb, label: Task size, type: number, unit: KB, default: 1, hint: "Billed in 32 KB chunks" }
readings:
  - requests: { name: Operations, price: gcp.tasks.operations, unit: operation, count: 'units(total, 32, taskKb) * operationsPerTask' }
  - limit: { name: Dispatch rate, demand: total.peak, unit: tasks/second, quota: gcp.tasks.dispatch_rps, capacity: max_dispatches_per_second }
terraform:
  ignoreRefs: [retry_config, stackdriver_logging_config]
iam:
  enqueue: ["roles/cloudtasks.enqueuer"]

# Worked examples: given these values and this load, the resource reads this.
# Expected values are computed by hand from the unit prices, not taken from the engine.
# Storage: the first 50 GiB of the project free, (100 − 50) × 0.5 = 25.
- name: Tokyo, the _Default bucket fed by the built-in sink, kept 90 days
  region: asia-northeast1
  attributes:
    bucket_id: _Default
    retention_days: 90
  assumptions:
    gbPerMonth: 100
  demand:
    ingest:
        monthly: 0
        peak: 0
  costs:
    Log storage: 25
    Retention beyond 30 days: 1.973684211
# Storage: 2e7 × 2 / 1024 / 1024 = 38.147 GiB, within the project's free 50 GiB.
- name: Iowa, a user-defined bucket fed by a sink in the graph, kept a year
  region: us-central1
  attributes:
    bucket_id: audit-archive
    retention_days: 365
  assumptions:
    kbPerEntry: 2
  demand:
    ingest:
        monthly: 2e+07
        peak: 50
  costs:
    Log storage: 0
    Retention beyond 30 days: 4.203696
- name: the _Required bucket is free
  region: asia-northeast1
  attributes:
    bucket_id: _Required
    retention_days: 400
  assumptions:
    gbPerMonth: 20
  demand:
    ingest:
        monthly: 0
        peak: 0

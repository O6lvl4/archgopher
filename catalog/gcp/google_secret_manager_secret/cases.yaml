# Worked examples: given these values and this load, the resource reads this.
# Expected values are computed by hand from the unit prices, not taken from the engine.
- name: Tokyo, one version with automatic replication
  region: asia-northeast1
  demand:
    read:
      monthly: 1.0e+06
      peak: 10
  costs:
    Versions: 0.06000016
    Access operations: 3
  limits:
    Access requests: 600
- name: Northern Virginia, three versions in two replica locations
  region: us-east4
  assumptions:
    versions: 3
    locations: 2
  demand:
    read:
      monthly: 5.0e+06
      peak: 2000
  costs:
    Versions: 0.36000096
    Access operations: 15
  limits:
    Access requests: 120000

# Worked examples: given these values and this load, the resource reads this.
# Expected values are computed by hand from the unit prices, not taken from the engine.
- name: Tokyo 20 GiB custom image
  # 20 x 0.065
  region: asia-northeast1
  attributes:
    disk_size_gb: 20
  demand:
    read:
      monthly: 10
      peak: 1
  costs:
    Image storage: 1.3
- name: Oregon image whose archive is 7.5 GiB
  # storedGb overrides the 50 GiB source disk: 7.5 x 0.05
  region: us-west1
  attributes:
    source_disk_size: 50
  assumptions:
    storedGb: 7.5
  demand:
    read:
      monthly: 10
      peak: 1
  costs:
    Image storage: 0.375
- name: An image of unknown size
  region: asia-northeast1
  demand:
    read:
      monthly: 1
      peak: 1
  error: the image's size is unknown

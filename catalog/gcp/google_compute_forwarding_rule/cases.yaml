# Worked examples: given these values and this load, the resource reads this.
# Expected values are computed by hand from the unit prices, not taken from the engine.
- name: passthrough Network Load Balancer, 10 million requests of 4 KB (asia-northeast1)
  region: asia-northeast1
  assumptions:
    kbPerUnit: 4
  demand:
    request:
      monthly: 1e+07
      peak: 100
  # 730 h × $0.025 (the first rule pays the minimum); 1e7 × 4 KB = 38.14697265625 GiB × $0.012
  costs:
    Forwarding rule hours: 18.25
    Data processed: 0.457763671875
- name: internal Application Load Balancer, 1,000 requests a second of 64 KB (us-east4)
  region: us-east4
  attributes:
    load_balancing_scheme: INTERNAL_MANAGED
  assumptions:
    kbPerUnit: 64
  demand:
    request:
      monthly: 2.628e+09
      peak: 2000
  # 2.628e9 / 2,628,000 s = 1,000/s: 1 proxy for requests, 62.5 MB/s / 18 = 4 for bandwidth; 4 × 730 h × $0.025
  costs:
    Proxy instances: 73
- name: eighth internal passthrough rule with 100 GB outside the drawn load (europe-west1)
  region: europe-west1
  attributes:
    load_balancing_scheme: INTERNAL
  assumptions:
    otherRules: 7
    gbPerMonth: 100
  demand:
    request:
      monthly: 0
      peak: 0
  # 730 h × $0.01 after the first five; 100 GiB × $0.008
  costs:
    Forwarding rule hours: 7.3
    Data processed: 0.8
- name: third rule of the project is covered by the minimum (asia-northeast1)
  region: asia-northeast1
  assumptions:
    otherRules: 2
  demand:
    request:
      monthly: 0
      peak: 0
  costs:
    Forwarding rule hours: 0
    Data processed: 0
- name: ESP rule of a Classic VPN gateway is free (us-west1)
  region: us-west1
  attributes:
    ip_protocol: ESP
  demand:
    request:
      monthly: 0
      peak: 0
- name: Private Service Connect endpoint (asia-northeast1)
  region: asia-northeast1
  attributes:
    load_balancing_scheme: ""
  demand:
    request:
      monthly: 0
      peak: 0
  error: Private Service Connect endpoints are not priced yet
- name: load passes through without a size (asia-northeast1)
  region: asia-northeast1
  demand:
    request:
      monthly: 1000
      peak: 1
  error: "load passes through this forwarding rule: set kbPerUnit, the data each unit carries"

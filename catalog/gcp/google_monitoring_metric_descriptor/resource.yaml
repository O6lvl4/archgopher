type: google_monitoring_metric_descriptor
label: Monitoring metric (user-defined)
category: Monitoring
icon: cloud-monitoring
description: "A user-defined metric billed by bytes ingested: 8 bytes a point for scalar values, 80 for distributions, in volume tiers per MiB (from 150, 100,000 and 250,000 MiB) counted over every metric of the billing account, whose first 150 MiB are free. Points come from time series written on a period and from load drawn to it, one point per unit. Read API calls outside the console bill per time series returned, the first million a billing account free. Managed Service for Prometheus metrics bill per sample and are not read. Headroom is the one point every 5 seconds a time series accepts and the active time series per monitored resource (the metric's time series spread over its monitored resources)."
kinds: [write]
sla: gcp.observability
attributes:
  - { key: metric_type, label: Metric type, type: string, optional: true, path: type, hint: "custom.googleapis.com/..., external.googleapis.com/... or workload.googleapis.com/..." }
  - { key: value_type, label: Value type, type: choice, options: [BOOL, INT64, DOUBLE, STRING, DISTRIBUTION], default: DOUBLE, path: value_type }
assumptions:
  - { key: timeSeries, label: Time series, type: number, default: 1, hint: "Label value combinations times the monitored resources that write them" }
  - { key: monitoredResources, label: Monitored resources, type: number, default: 1, hint: "Monitored resources (VMs, containers, generic nodes) the time series are spread over; the active time series limit is per monitored resource" }
  - { key: periodSeconds, label: Write period, type: number, unit: s, optional: true, hint: "Seconds between points on each time series written on a schedule (60 for most exporters); unset when only load drawn to this node writes points" }
  - { key: timeSeriesReadPerMonth, label: Time series read by the API, type: number, default: 0, hint: "Time series returned a month by read calls outside the console, such as dashboards in other tools and scripts; at least one per call" }
let:
  - scheduled: 'periodSeconds != nil && periodSeconds > 0 ? timeSeries * 2628000 / periodSeconds : 0.0'
  - points: scheduled + total.monthly
  - mib: 'points * (value_type == "DISTRIBUTION" ? 80 : 8) / 1048576'
  - perSeriesPeak: 'total.peak / max(timeSeries, 1) + (periodSeconds != nil && periodSeconds > 0 ? 1 / periodSeconds : 0.0)'
readings:
  - fail: { when: 'metric_type != nil && metric_type startsWith "prometheus.googleapis.com/"', message: "Managed Service for Prometheus metrics bill per sample ingested, which is not read" }
  - cost: { when: mib > 0, name: Metric volume, quantity: mib, unit: MiB, price: gcp.monitoring.volume }
  - cost: { when: timeSeriesReadPerMonth > 0, name: Read API time series, quantity: timeSeriesReadPerMonth, unit: time series, price: gcp.monitoring.read_time_series }
  - limit: { name: Write rate per time series, demand: perSeriesPeak, unit: points/second, quota: gcp.monitoring.points_per_series_per_second }
  - limit: { name: Active time series, demand: 'timeSeries / max(monitoredResources, 1)', unit: time series, quota: gcp.monitoring.active_time_series }
terraform:
  # A metric descriptor declares a metric; it calls nothing. Code writes points to it.
  passive: true
iam:
  write: ["roles/monitoring.metricWriter"]

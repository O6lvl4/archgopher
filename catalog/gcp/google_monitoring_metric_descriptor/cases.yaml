# Worked examples: given these values and this load, the resource reads this.
# Expected values are computed by hand from the unit prices, not taken from the engine.
# 50 × 2628000 / 60 × 8 / 1048576 = 16.708 MiB, within the billing account's free 150 MiB.
- name: Tokyo, 50 time series written every minute
  region: asia-northeast1
  attributes:
    metric_type: custom.googleapis.com/orders/latency
    value_type: DOUBLE
  assumptions:
    periodSeconds: 60
    timeSeries: 50
  demand:
    write:
        monthly: 0
        peak: 0
  costs:
    Metric volume: 0
  limits:
    Active time series: 50
    Write rate per time series: 0.016666667
# 200000 × 2628000 / 10 × 80 / 1048576 = 4010009.765625 MiB over the account's tiers:
# 150 free; (100000 − 150) × 0.258 = 25761.3; 150000 × 0.151 = 22650;
# (4010009.765625 − 250000) × 0.061 = 229360.595703125; together 277771.895703125.
# Read API: the first million time series free, (5e6 − 1e6) / 1e6 × 0.5 = 2.
- name: Iowa, 200,000 distribution series from 1,000 pods every 10 seconds, read by a dashboard outside the console
  region: us-central1
  attributes:
    metric_type: workload.googleapis.com/rpc/latency
    value_type: DISTRIBUTION
  assumptions:
    periodSeconds: 10
    timeSeries: 200000
    monitoredResources: 1000
    timeSeriesReadPerMonth: 5e+06
  demand:
    write:
        monthly: 0
        peak: 0
  costs:
    Metric volume: 277771.895703125
    Read API time series: 2
  limits:
    Active time series: 200
    Write rate per time series: 0.1
# 5e7 × 8 / 1048576 = 381.4697265625 MiB; (381.4697265625 − 150) × 0.258 = 59.719189453.
- name: Tokyo, one point per order drawn as load across 10 series
  region: asia-northeast1
  attributes:
    value_type: INT64
  assumptions:
    timeSeries: 10
  demand:
    write:
        monthly: 5e+07
        peak: 30
  costs:
    Metric volume: 59.719189453
  limits:
    Active time series: 10
    Write rate per time series: 3
- name: Prometheus metrics are billed per sample
  region: asia-northeast1
  attributes:
    metric_type: prometheus.googleapis.com/http_requests_total/counter
  demand:
    write:
        monthly: 0
        peak: 0
  error: Managed Service for Prometheus metrics bill per sample ingested, which is not read

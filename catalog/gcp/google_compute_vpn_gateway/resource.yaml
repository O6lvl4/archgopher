type: google_compute_vpn_gateway
label: Classic VPN gateway
category: Network
icon: cloud-vpn
description: "The gateway itself is free; its tunnels bill by the hour. Reads the IPsec traffic it sends: to a peer outside Google Cloud at the internet transfer-out price, to a Cloud VPN gateway in the same region at the between-zones price. Place it on the path to the other side: load that passes through carries kbPerUnit each and flows on. Data coming in is free."
kinds: [traffic]
sla: gcp.vpn.classic
assumptions:
  - { key: peer, label: Peer, type: choice, options: [outside, same-region, other-region], default: outside, hint: "outside: an on-premises or other-cloud device; same-region or other-region: another Cloud VPN gateway" }
  - { key: kbPerUnit, label: Data sent per unit, type: number, unit: KB, optional: true, hint: "Per request or message passing through, what Google Cloud sends to the other side" }
  - { key: gbPerMonth, label: Other data sent per month, type: number, unit: GB, default: 0, hint: "Traffic not drawn as load" }
let:
  - gb: 'gbPerMonth + total.monthly * (kbPerUnit != nil ? kbPerUnit : 0.0) / 1024 / 1024'
readings:
  - fail: { when: 'peer == "other-region"', message: "IPsec traffic to a Cloud VPN gateway in another region is billed at inter-region rates, which are not priced yet" }
  - fail: { when: 'total.monthly > 0 && kbPerUnit == nil', message: "load passes through this VPN gateway: set kbPerUnit, the data each unit sends" }
  - cost: { name: IPsec traffic sent, quantity: gb, unit: GB, price: 'gcp.network.{peer == "outside" ? "internet_out" : "inter_zone"}' }
terraform:
  # Forwarding rules and tunnels name the gateway; nothing calls it. Draw the traffic through it by hand.
  mentioned: true
  passive: true

# Worked examples: given these values and this load, the resource reads this.
# Monthly USD per cost line, peak demand per limit. After an intended change:
#   go test ./provider/conoha -update
- name: one additional address
  region: ap-northeast-1
  attributes:
    ip_count: 1
  costs:
    Additional IP addresses: 2.446865455
- name: three addresses on one port
  region: us-east-1
  attributes:
    ip_count: 3
  costs:
    Additional IP addresses: 7.340596364
- name: more than sixteen
  region: ap-northeast-1
  attributes:
    ip_count: 20
  error: ip_count is 1 to 16 addresses, not 20
- name: one address on the 300 Mbps policy
  region: ap-northeast-1
  attributes:
    ip_count: 1
    qos_policy: global-i_300000-o_300000
  costs:
    Additional IP addresses: 2.446865455
    Bandwidth expansion (300 Mbps): 57.132
- name: a policy ConoHa does not publish
  region: ap-northeast-1
  attributes:
    ip_count: 1
    qos_policy: global-i_50000-o_50000
  error: global-i_50000-o_50000 is not a QoS policy ConoHa publishes

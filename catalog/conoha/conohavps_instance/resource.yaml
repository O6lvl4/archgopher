  # The 8 GB to 64 GB plans the March 2025 renewal replaced keep their own price.
  - table: 'flavor matches "^g2d-" ? "database" : flavor in ["g2l-t-c6m8", "g2l-t-c8m16", "g2l-t-c12m32", "g2l-t-c24m64"] ? "linux_old_memory" : "linux"'
  - prepaid: 'flavor matches "^g2[lw]-p-"'
  - prepaidTable: 'flavor in ["g2l-p-c6m8", "g2l-p-c8m16", "g2l-p-c12m32", "g2l-p-c24m64"] ? "prepaid_old_memory" : "prepaid"'
  - windows: 'flavor matches "^g2w-"'
  - months: 'term ?? ""'
  - gpu: 'flavor matches "g[0-9]-(l4|h100)$"'
  - h100x4: 'flavor matches "g4-h100$"'
  - kusanagi: 'flavor matches "-kusanagi$"'
  - edition: 'kusanagiEdition ?? ""'
readings:
  - fail: { when: 'flavor == ""', message: "flavor_id is not a flavor ConoHa publishes (a variable, or a data source whose name is not known): set plan, the flavor name (g2l-t-c6m12)" }
  - fail: { when: 'prepaid && term == nil', message: "{flavor} is a prepaid plan (まとめトク): set term, the months paid up front (1, 3, 6, 12, 24 or 36)" }
  - fail: { when: 'prepaid && windows && months == "1"', message: "{flavor} is a Windows Server prepaid plan, which has no 1-month term: set term to 3, 6, 12, 24 or 36" }
  - fail: { when: 'gpu && prepaid', message: "{flavor} is a prepaid GPU plan, which ConoHa publishes no amount for: read the hourly plan instead" }
  - fail: { when: 'h100x4', message: "{flavor} (4 × H100) has no published price" }
  - fail: { when: 'kusanagi && edition == ""', message: "{flavor} is a KUSANAGI plan: set kusanagiEdition (business, premium or security), which the flavor name does not carry" }
  - fail: { when: 'kusanagi && prepaid && months != "1" && months != ""', message: "{flavor} is a prepaid KUSANAGI plan, which ConoHa publishes only as a 1-month amount: set term to 1" }
  - cost: { when: 'flavor matches "^g2l-t-c[0-9]+m[0-9]+$"', name: "Server ({flavor})", quantity: 1, unit: server-month, price: "conoha.vps.{table}.{flavor}" }
  - cost: { when: 'flavor matches "^g2d-t-"', name: "Database server ({flavor})", quantity: 1, unit: server-month, price: "conoha.vps.database.{flavor}" }
  - cost: { when: 'prepaid && !windows && !gpu && !kusanagi', name: "Server ({flavor}, {months}-month term)", quantity: 1, unit: server-month, price: "conoha.vps.{prepaidTable}.{flavor}-{months}" }
  - cost: { when: 'gpu && !prepaid && !h100x4', name: "GPU server ({flavor})", quantity: 1, unit: server-month, price: "conoha.vps.gpu.{flavor}" }
  - cost: { when: 'kusanagi && !prepaid && edition != ""', name: "KUSANAGI server ({flavor}, {edition})", quantity: 1, unit: server-month, price: "conoha.vps.kusanagi_{edition}.{flavor}" }
  - cost: { when: 'kusanagi && prepaid && edition != "" && months == "1"', name: "KUSANAGI server ({flavor}, {edition}, 1-month term)", quantity: 1, unit: server-month, price: "conoha.vps.kusanagi_{edition}_prepaid.{flavor}" }
  - cost: { when: 'windows && !prepaid', name: "Windows Server ({flavor})", quantity: 1, unit: server-month, price: "conoha.vps.windows.{flavor}" }
  - cost: { when: 'windows && prepaid', name: "Windows Server ({flavor}, {months}-month term)", quantity: 1, unit: server-month, price: "conoha.vps.windows_prepaid.{flavor}-{months}" }
  - cost: { when: 'windows && rdsSal > 0', name: Remote Desktop licences, quantity: rdsSal, unit: license-month, price: conoha.vps.windows_rds_sal }
  - cost: { when: 'windows && officeSal > 0', name: Office licences, quantity: officeSal, unit: license-month, price: conoha.vps.windows_office_sal }
  - cost: { when: 'bandwidthMbps == "300"', name: Bandwidth expansion (300 Mbps), quantity: 1, unit: port-month, price: conoha.vps.bandwidth_expansion }
  - limit: { when: requestsPerInstance != nil, name: Requests per second, demand: total.peak, unit: requests/second, capacity: 'requestsPerInstance ?? 0' }
terraform:
  # Volumes are priced on their own node; key pairs and security groups cost nothing.
  ignoreRefs: [block_device, key_name, security_group]

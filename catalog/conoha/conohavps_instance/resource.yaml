type: conohavps_instance
label: ConoHa VPS server
category: Compute
icon: server
description: "The server plan by flavor: Linux, Windows Server or a database server, on hourly billing or prepaid (まとめトク) for a term. ConoHa bills a server by the hour up to the plan's monthly amount, whether it runs or is shut off, until it is deleted; a server a declaration keeps all month pays the monthly amount, which is what is read. The 8 GB to 64 GB plans that the March 2025 renewal replaced with 12 GB to 96 GB keep their own price. The plan includes the boot volume up to 100 GB (30 GB on 512 MB); a larger boot volume is priced on conohavps_volume. A database server plan (g2d-) is priced by its disk. A prepaid plan (g2l-p-, g2w-p-) needs its term and reads the term's renewal price, the amount it pays month after month; the first term's campaign discount is not read. A Windows Server plan (g2w-) is priced from its own page, and its Remote Desktop and Office licences are counted as assumptions. Data transfer is free; the global port carries 100 Mbps, and the bandwidth expansion option (ネットワーク帯域拡張, the QoS policy global-i_300000-o_300000) raises it to 300 Mbps for a monthly amount. Prices are published in yen with tax; they are read before tax, in US dollars at the book's rate. Headroom is the peak against what the server serves. A GPU plan (g1-l4, g1-h100) reads the published hourly plan's monthly amount; a KUSANAGI plan (-kusanagi) is priced by the edition ordered with it (kusanagiEdition), which the flavor name does not carry, hourly or as the 1-month prepaid amount ConoHa publishes."
kinds: [request]
sla: conoha.vps.server
attributes:
  - { key: flavor_id, label: Flavor ID, type: string, optional: true, hint: "The flavor's UUID, which names the plan (g2l-t-c2m1 is Linux, hourly billing, 2 cores, 1 GB)" }
  - { key: flavor_name, label: Flavor name, type: string, optional: true, path: "flavor_id->name", hint: "The plan's name, read from the conohavps_flavor data source flavor_id comes from" }

  - { key: requestsPerInstance, label: Capacity per server, type: number, unit: requests/second, optional: true, hint: "What the server serves at the peak, from a load test; compared with the peak load" }
  - key: term
    label: Prepaid term
    type: choice
    optional: true
    options: ["1", "3", "6", "12", "24", "36"]
    labels: { "1": "1 month", "3": "3 months", "6": "6 months", "12": "12 months", "24": "24 months", "36": "36 months" }
    hint: "The term of a prepaid plan (まとめトク) in months; Windows Server has no 1-month term. Read as the term's renewal price, the amount it pays month after month"
  - key: kusanagiEdition
    label: KUSANAGI edition
    type: choice
    optional: true
    options: [business, premium, security]
    labels: { business: "Business Edition", premium: "Premium Edition (WEXAL)", security: "Security Edition" }
    hint: "The edition of a KUSANAGI plan (-kusanagi), chosen when the server is ordered and not part of the flavor name; the three editions price the same size differently"
  - { key: rdsSal, label: Remote Desktop licences, type: number, default: 0, hint: "RDS SALs on a Windows Server, one per user who signs in by Remote Desktop" }
  - { key: officeSal, label: Office licences, type: number, default: 0, hint: "Microsoft Office SALs on a Windows Server" }
  - key: bandwidthMbps
    label: Global bandwidth
    type: choice
    default: "100"
    options: ["100", "300"]
    labels: { "100": "100 Mbps, included", "300": "300 Mbps, the bandwidth expansion option" }
    hint: "The QoS policy of the server's global port: global-i_100000-o_100000 comes with the plan, global-i_300000-o_300000 (ネットワーク帯域拡張) is paid. Terraform does not manage the port of a server, so say it here"

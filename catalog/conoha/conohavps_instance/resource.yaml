re", g2l-p-c1m2-kusanagi: "KUSANAGI 2 GB, prepaid", g2l-t-c2m4-kusanagi: "KUSANAGI 4 GB, 2 cores", g2l-p-c2m4-kusanagi: "KUSANAGI 4 GB, prepaid", g2l-t-c2m8-kusanagi: "KUSANAGI 8 GB, 2 cores", g2l-p-c2m8-kusanagi: "KUSANAGI 8 GB, prepaid", g2l-t-c4m8-kusanagi: "KUSANAGI 8 GB, 4 cores", g2l-p-c4m8-kusanagi: "KUSANAGI 8 GB, prepaid", g2l-t-c4m16-kusanagi: "KUSANAGI 16 GB, 4 cores", g2l-p-c4m16-kusanagi: "KUSANAGI 16 GB, prepaid", g2l-t-c6m12-kusanagi: "KUSANAGI 12 GB, 6 cores", g2l-p-c6m12-kusanagi: "KUSANAGI 12 GB, prepaid", g2l-t-c6m24-kusanagi: "KUSANAGI 24 GB, 6 cores", g2l-p-c6m24-kusanagi: "KUSANAGI 24 GB, prepaid", g2l-t-c8m16-kusanagi: "KUSANAGI 16 GB, 8 cores", g2l-p-c8m16-kusanagi: "KUSANAGI 16 GB, prepaid", g2l-t-c8m32-kusanagi: "KUSANAGI 32 GB, 8 cores", g2l-p-c8m32-kusanagi: "KUSANAGI 32 GB, prepaid", g2l-t-c16m32-kusanagi: "KUSANAGI 32 GB, 16 cores", g2l-p-c16m32-kusanagi: "KUSANAGI 32 GB, prepaid", g2l-t-c16m64-kusanagi: "KUSANAGI 64 GB, 16 cores", g2l-p-c16m64-kusanagi: "KUSANAGI 64 GB, prepaid", g2l-t-c32m64-kusanagi: "KUSANAGI 64 GB, 32 cores", g2l-p-c32m64-kusanagi: "KUSANAGI 64 GB, prepaid", g2l-t-c64m128-kusanagi: "KUSANAGI 128 GB, 64 cores", g2l-p-c64m128-kusanagi: "KUSANAGI 128 GB, prepaid" }

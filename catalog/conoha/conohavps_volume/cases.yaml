# Worked examples: given these values and this load, the resource reads this.
# Expected values are computed by hand from the unit prices, not taken from the engine.
# Yen prices include 10% tax and convert at 0.006348 US dollars a yen.
- name: a 100 GB boot volume is in the plan
  region: ap-northeast-1
  attributes:
    size: 100
    volume_type: c3j1-ds02-boot
  costs: {}
- name: a 200 GB boot volume adds 100 GB
  region: ap-northeast-1
  attributes:
    size: 200
    volume_type: c3j1-ds02-boot
  costs:
    # 1,513 yen / 1.1 x 0.006348 = 8.731385455
    Boot storage added (100 GB): 8.731385455
- name: a 500 GB additional volume
  region: ap-northeast-1
  attributes:
    size: 500
    volume_type: c3j1-ds02-add
  costs:
    # 5,445 yen / 1.1 x 0.006348 = 31.4226
    Additional SSD (500 GB): 31.4226
- name: an additional volume under 200 GB
  region: ap-northeast-1
  attributes:
    size: 100
  error: at least 200 GB

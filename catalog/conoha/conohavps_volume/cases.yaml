# Worked examples: given these values and this load, the resource reads this.
# Monthly USD per cost line, peak demand per limit. After an intended change:
#   go test ./provider/conoha -update
- name: a 100 GB boot volume is in the plan
  region: ap-northeast-1
  attributes:
    size: 100
    volume_type: c3j1-ds02-boot
- name: a 200 GB boot volume adds 100 GB
  region: ap-northeast-1
  attributes:
    size: 200
    volume_type: c3j1-ds02-boot
  costs:
    Boot storage added (100 GB): 8.731385455
- name: a 500 GB additional volume
  region: ap-northeast-1
  attributes:
    size: 500
    volume_type: c3j1-ds02-add
  costs:
    Additional SSD (500 GB): 31.4226
- name: an additional volume under 200 GB
  region: ap-northeast-1
  attributes:
    size: 100
  error: an additional volume is at least 200 GB, not 100

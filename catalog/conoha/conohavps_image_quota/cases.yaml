# Worked examples: given these values and this load, the resource reads this.
# Monthly USD per cost line, peak demand per limit. After an intended change:
#   go test ./provider/conoha -update
- name: 550 GB, the first step above the free 50
  region: ap-northeast-1
  attributes:
    image_size_gb: 550
  costs:
    Image save beyond 50 GB: 9.522
- name: 1,050 GB, two steps of 500
  region: ap-northeast-1
  attributes:
    image_size_gb: 1050
  costs:
    Image save beyond 50 GB: 19.044
- name: the free 50 GB alone is not a quota
  region: ap-northeast-1
  attributes:
    image_size_gb: 50
  error: image_size_gb is the free 50 GB plus a multiple of 500, at least 550, not 50
- name: a size that is not 50 plus a multiple of 500
  region: ap-northeast-1
  attributes:
    image_size_gb: 300
  error: image_size_gb is the free 50 GB plus a multiple of 500, at least 550, not 300

type: conohavps_image_quota
label: ConoHa VPS image save
category: Storage
icon: image
description: "The account's image save capacity (イメージ保存) beyond the 50 GB that come free: each 500 GB added is billed by the hour up to the monthly amount, and the resource exists only when capacity is added (550 GB and up). Saved server images and volume snapshots take this space. One per account. Prices are published in yen with tax; they are read before tax, in US dollars at the book's rate."
kinds: [store]
attributes:
  - { key: image_size_gb, label: Capacity, type: number, unit: GB, default: 550, hint: "The free 50 GB plus a multiple of 500, at least 550: 550, 1050, 1550, ..." }
let:
  - added: 'image_size_gb - 50'
  - gb: 'string(image_size_gb)'
readings:
  - fail: { when: 'added < 500 || int(added) % 500 != 0', message: "image_size_gb is the free 50 GB plus a multiple of 500, at least 550, not {gb}" }
  - cost: { name: Image save beyond 50 GB, quantity: 'added / 500', unit: 500GB-month, price: conoha.vps.image_save }
terraform:
  passive: true

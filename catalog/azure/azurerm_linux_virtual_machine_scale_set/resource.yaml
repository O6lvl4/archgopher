type: azurerm_linux_virtual_machine_scale_set
label: Linux VM scale set
category: Compute
icon: vm-scale-sets
description: "Pay-as-you-go instance hours by SKU times the instances running, each with its OS disk's tier (and operations on Standard HDD and SSD), and the Ultra Disk reservation while Ultra Disk compatibility is on without an Ultra Disk attached. Spot, Low Priority and reserved prices are not read."
kinds: [request]
sla: azure.vm.scale_set
attributes:
  - { key: sku, label: Size, type: string, hint: "A VM size such as Standard_D2s_v5" }
  - { key: instances, label: Instances, type: number, default: 0, hint: "The count Terraform sets; an autoscale setting moves it" }
  - { key: os_disk_type, label: OS disk type, type: choice, options: [Standard_LRS, StandardSSD_LRS, StandardSSD_ZRS, Premium_LRS, Premium_ZRS], path: os_disk.storage_account_type }
  - { key: os_disk_size_gb, label: OS disk size, type: number, unit: GiB, optional: true, path: os_disk.disk_size_gb, hint: "Unset takes the image's size, 30 GiB for most Linux images" }
  - { key: ultra_ssd_enabled, label: Ultra Disk compatibility, type: boolean, default: false, path: additional_capabilities.ultra_ssd_enabled }
assumptions:
  - { key: averageInstances, label: Average instances, type: number, optional: true, hint: "Instances running on average when autoscale moves the count; unset reads instances" }
  - { key: monthlyHours, label: Hours running, type: number, unit: hours, default: 730, hint: "Hours a month each instance is allocated" }
  - { key: osDiskOpsPerMonth, label: OS disk operations, type: number, default: 0, hint: "Per month across all instances; Standard HDD and SSD bill every 10,000" }
  - { key: ultraReservedVcpus, label: vCPUs reserved for Ultra Disk, type: number, default: 0, hint: "The SKU's vCPUs times the instances, while Ultra Disk compatibility is on and no Ultra Disk is attached" }
let:
  - n: 'averageInstances != nil ? averageInstances : instances'
  - dtype: os_disk_type
  - dsize: 'os_disk_size_gb != nil ? os_disk_size_gb : 30.0'
  - dclass: 'dtype startsWith "StandardSSD" ? "E" : dtype startsWith "Standard_" ? "S" : "P"'
  - dred: 'dtype endsWith "ZRS" ? "zrs" : "lrs"'
  - dnum: 'dsize <= 4 ? 1 : dsize <= 8 ? 2 : dsize <= 16 ? 3 : dsize <= 32 ? 4 : dsize <= 64 ? 6 : dsize <= 128 ? 10 : dsize <= 256 ? 15 : dsize <= 512 ? 20 : dsize <= 1024 ? 30 : dsize <= 2048 ? 40 : dsize <= 4096 ? 50 : dsize <= 8192 ? 60 : dsize <= 16384 ? 70 : 80'
  - dtier: 'dclass + string(dclass == "S" ? max(dnum, 4) : dnum)'
readings:
  - cost: { name: Instance hours, quantity: n * monthlyHours, unit: instance-hour, price: "azure.vm.linux.{sku}" }
  - cost: { name: "OS disks ({dtier} {upper(dred)})", quantity: n, unit: disk-month, price: "azure.disk.{dred}.{dtier}" }
  - cost: { when: 'dclass != "P" && osDiskOpsPerMonth > 0', name: OS disk operations, quantity: osDiskOpsPerMonth, unit: operation, price: '{dclass == "S" ? "azure.disk.operations.standard_hdd_" : "azure.disk.operations.standard_ssd_"}{dred}' }
  - cost: { when: ultra_ssd_enabled, name: Ultra Disk reservation, quantity: 730 * ultraReservedVcpus, unit: vCPU-hour, price: azure.disk.ultra.vcpu_reservation }
terraform:
  ignoreRefs: [network_interface, proximity_placement_group_id, host_group_id, capacity_reservation_group_id, source_image_id, os_disk, data_disk, identity, admin_ssh_key, secret, boot_diagnostics, gallery_application, health_probe_id, automatic_instance_repair, extension, rolling_upgrade_policy]

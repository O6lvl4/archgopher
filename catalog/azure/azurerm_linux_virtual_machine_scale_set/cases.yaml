# Worked examples: given these values and this load, the resource reads this.
# Expected values are computed by hand from the unit prices, not taken from the engine.
- name: three D2s_v5 instances
  region: japaneast
  attributes: { sku: Standard_D2s_v5, instances: 3, os_disk_type: Premium_LRS }
  costs:
    Instance hours: 271.56
    OS disks (P4 LRS): 18.2172
- name: autoscale averaging 2.5 instances on Standard SSD
  region: eastus
  attributes: { sku: Standard_D2s_v5, instances: 2, os_disk_type: StandardSSD_LRS, os_disk_size_gb: 64 }
  assumptions: { averageInstances: 2.5 }
  costs:
    Instance hours: 175.2
    OS disks (E6 LRS): 12
- name: two instances with two 512 GiB Premium SSD data disks each
  region: japaneast
  attributes: { sku: Standard_D2s_v5, instances: 2, os_disk_type: Premium_LRS, data_disk_type: Premium_LRS, data_disk_size_gb: 512 }
  assumptions: { dataDisksPerInstance: 2 }
  costs:
    Instance hours: 181.04
    OS disks (P4 LRS): 12.1448
    Data disks (P20 LRS): 336.8

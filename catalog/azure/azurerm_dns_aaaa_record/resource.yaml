type: azurerm_dns_aaaa_record
label: DNS AAAA record
category: Edge
icon: dns-zones
description: "Queries answered for the AAAA record set in a public Azure DNS zone, with the lower price beyond 1 billion a month (the tier counts every public zone query in the subscription). Resolvers cache answers for the TTL, so queries are far fewer than requests: give them as queriesPerMonth or draw load to the record. A record answers where to connect and passes no load on."
kinds: [query]
sla: azure.dns
attributes:
  - { key: records, label: Addresses, type: list, optional: true, hint: "Unset on alias records, which name target_resource_id instead" }
assumptions:
  - { key: queriesPerMonth, label: Queries per month, type: number, default: 0, hint: "Queries not drawn as load; the QueryVolume metric of the zone tells" }
let:
  - queries: total.monthly + queriesPerMonth
readings:
  - requests: { name: Queries (first 1 billion), count: 'min(queries, 1e9)', unit: query, price: azure.dns.queries }
  - requests: { when: queries > 1e9, name: Queries (over 1 billion), count: queries - 1e9, unit: query, price: azure.dns.queries_over_1b }
  - limit: { name: Records in the set, demand: 'float(len(records))', unit: records, quota: azure.dns.records_per_set }
terraform:
  # A record names its zone and the resource it points at; neither is a call.
  passive: true

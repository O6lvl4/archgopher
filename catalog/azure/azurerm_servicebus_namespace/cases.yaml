# Worked examples: given these values and this load, the resource reads this.
# Expected values are computed by hand from the unit prices, not taken from the engine.
- name: Standard in Japan East, beyond the included operations
  region: japaneast
  demand:
    send:
      monthly: 10000000.0
      peak: 10
  # 1e7 messages × 2 = 2e7 operations, the first 13 million included:
  # 7e6 × 0.8 / 1e6 = 5.6. Base fee 730 × 0.013441.
  costs:
    Base fee: 9.81193
    Operations: 5.6
  limits:
    Operations per second: 20
# 1e8 messages × 2 = 2e8 operations, tier by tier: the first 13 million included;
# (1e8 − 1.3e7) × 0.8 / 1e6 = 69.6; (2e8 − 1e8) × 0.5 / 1e6 = 50; together 119.6.
- name: Standard in East US, past the 100 million tier
  region: eastus
  demand:
    send:
      monthly: 100000000.0
      peak: 10
  costs:
    Base fee: 9.81193
    Operations: 119.6
  limits:
    Operations per second: 20
- name: Basic in East US, 100 KB messages count twice
  region: eastus
  attributes:
    sku: Basic
  assumptions:
    messageKb: 100
  demand:
    send:
      monthly: 1000000.0
      peak: 5
  costs:
    Operations: 0.2
  limits:
    Operations per second: 20
- name: Premium with two messaging units
  region: japaneast
  attributes:
    sku: Premium
    capacity: 2
  demand:
    send:
      monthly: 100000000.0
      peak: 500
  costs:
    Messaging units: 1354.15

type: azurerm_servicebus_namespace
label: Service Bus
category: Messaging
icon: service-bus
description: "Basic: operations. Standard: the base fee, paid once by the account however many Standard namespaces it has, and operations beyond the 13 million it includes, in volume tiers from 100 million and 2.5 billion, counted over every Standard namespace of the account. Premium: messaging-unit hours. Operations are counted per 64 KB. Headroom is operations per second on Basic and Standard; Premium has no fixed limit."
kinds: [send]
sla: azure.servicebus
attributes:
  - { key: sku, label: Tier, type: choice, options: [Basic, Standard, Premium], default: Standard }
  - { key: capacity, label: Messaging units, type: number, default: 0, hint: "Premium only: 1, 2, 4, 8 or 16" }
assumptions:
  - { key: messageKb, label: Message size, type: number, unit: KB, default: 1, hint: "Operations are counted per 64 KB; for messages whose edges give no kb" }
  - { key: operationsPerMessage, label: Operations per message, type: number, default: 2, hint: "Send and receive; settling, peeking and management calls add more" }
let:
  - ops: units(total, 64, messageKb) * operationsPerMessage
readings:
  - requests: { when: 'sku == "Basic"', name: Operations, unit: operation, price: azure.servicebus.basic.operations, count: ops }
  - cost: { when: 'sku == "Standard"', name: Base fee, quantity: 730, unit: hour, price: azure.servicebus.standard.base }
  - requests: { when: 'sku == "Standard"', name: Operations, unit: operation, price: azure.servicebus.standard.operations, count: ops }
  - cost: { when: 'sku == "Premium"', name: Messaging units, quantity: 'max(capacity, 1.0) * 730', unit: hour, price: azure.servicebus.premium.messaging_unit }
  - rate: { when: 'sku != "Premium"', name: Operations per second, unit: operations/second, quota: azure.servicebus.operations_per_second, peak: 'peakUnits(total, 64, messageKb) * operationsPerMessage' }
terraform:
  aliases:
    azurerm_servicebus_queue: namespace_id
    azurerm_servicebus_topic: namespace_id
    azurerm_servicebus_subscription: topic_id
    azurerm_servicebus_subscription_rule: subscription_id
    azurerm_servicebus_namespace_authorization_rule: namespace_id
    azurerm_servicebus_queue_authorization_rule: queue_id
    azurerm_servicebus_topic_authorization_rule: topic_id
  ignoreRefs: [identity, customer_managed_key, network_rule_set]
iam:
  send: ["Azure Service Bus Data Sender", "Azure Service Bus Data Owner"]

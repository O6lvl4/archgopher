# Worked examples: given these values and this load, the resource reads this.
# Expected values are computed by hand from the unit prices, not taken from the engine.
- name: LRS in Japan East
  region: japaneast
  assumptions:
    storageGb: 100
    internetGbPerMonth: 20
  demand:
    read:
      monthly: 2000000.0
      peak: 20
    write:
      monthly: 1000000.0
      peak: 10
  costs:
    Data stored: 2.0
    Write operations: 5.0
    Read operations: 0.8
    # 20 GB, within the 100 GB a month free
    Transfer out to the internet: 0
  limits:
    Request rate: 30
- name: RA-GRS in East US
  region: eastus
  attributes:
    account_replication_type: RAGRS
  assumptions:
    storageGb: 100
  demand:
    read:
      monthly: 0
      peak: 0
    write:
      monthly: 1000000.0
      peak: 10
  costs:
    Data stored: 5.89
    Write operations: 10.0
    Read operations: 0
  limits:
    Request rate: 10
# Past volume tiers in Japan East. Stored, tier by tier: 51200 × 0.02 = 1024;
# (60000 − 51200) × 0.0192 = 168.96; together 1192.96. Transfer out: the first 100 GB free;
# (10335 − 100) × 0.12 = 1228.2; (20000 − 10335) × 0.085 = 821.525; together 2049.725.
- name: LRS past the first storage and transfer tiers (japaneast)
  region: japaneast
  assumptions:
    storageGb: 60000
    internetGbPerMonth: 20000
  demand:
    read:
      monthly: 0
      peak: 0
    write:
      monthly: 0
      peak: 0
  costs:
    Data stored: 1192.96
    Write operations: 0
    Read operations: 0
    Transfer out to the internet: 2049.725
  limits:
    Request rate: 0
- name: GZRS is not read yet
  region: japaneast
  attributes:
    account_replication_type: GZRS
  assumptions:
    storageGb: 1
  demand:
    read:
      monthly: 1
      peak: 1
    write:
      monthly: 1
      peak: 1
  error: 'GZRS is not read yet: LRS, ZRS, GRS and RAGRS are'

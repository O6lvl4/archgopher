type: azurerm_cosmosdb_account
label: Cosmos DB
category: Database
icon: cosmos-db
description: "Request units of a serverless account, from the calls it receives, and the throughput and storage of databases and containers that are not declared as their own nodes. A declared database, container, collection, keyspace, table or graph bills its own throughput, storage and backup, so leave provisionedRus and storageGb unset for what they declare. The free tier is ignored, as every free tier."
kinds: [read, write]
sla: azure.cosmosdb
attributes:
  - { key: capability, label: First capability, type: string, optional: true, path: capabilities.name, hint: "EnableServerless makes the account serverless" }
  - { key: multiple_write_locations_enabled, label: Multi-region writes, type: boolean, default: false }
assumptions:
  - { key: storageGb, label: Data and index stored, type: number, unit: GB, optional: true, hint: "Only data in databases and containers that are not declared: declared ones bill their own storage" }
  - { key: ruPerRead, label: Request units per read, type: number, default: 1, hint: "A 1 KB point read costs 1 RU" }
  - { key: ruPerWrite, label: Request units per write, type: number, default: 5, hint: "A 1 KB write with default indexing costs about 5 RU" }
  - { key: provisionedRus, label: Provisioned throughput, type: number, unit: RU/s, optional: true, hint: "Only RU/s set on databases and containers that are not declared (declared ones bill their own); manual throughput is at least 400 per container" }
  - { key: regions, label: Regions, type: number, default: 1, hint: "Each extra region bills throughput and storage again" }
let:
  - serverless: 'capability == "EnableServerless"'
  - rate: 'multiple_write_locations_enabled ? "mru100_hour" : "ru100_hour"'
  - rus: 'demand.read.monthly * ruPerRead + demand.write.monthly * ruPerWrite'
  - peakRus: 'demand.read.peak * ruPerRead + demand.write.peak * ruPerWrite'
readings:
  - fail: { when: 'serverless && regions > 1', message: "a serverless account runs in one region" }
  - fail: { when: 'serverless && provisionedRus != nil', message: "a serverless account has no provisioned throughput: unset provisionedRus" }
  - cost: { when: serverless, name: Request units, quantity: rus, unit: request unit, price: azure.cosmosdb.serverless.ru }
  - cost: { when: provisionedRus != nil, name: Provisioned throughput, quantity: '(provisionedRus ?? 0) / 100 * 730 * regions', unit: 100 RU/s-hour, price: 'azure.cosmosdb.provisioned.{rate}' }
  - storage: { when: storageGb != nil, name: Storage, gb: '(storageGb ?? 0) * regions', price: azure.cosmosdb.storage }
  - limit: { when: provisionedRus != nil, name: Request units per second, demand: peakRus, unit: RU/s, capacity: provisionedRus }
terraform:
  aliases: { azurerm_cosmosdb_sql_role_assignment: account_name, azurerm_cosmosdb_sql_role_definition: account_name }
  ignoreRefs: [identity, key_vault_key_id, virtual_network_rule, backup]
# Cosmos DB data-plane access is Cosmos DB's own RBAC (built-in SQL role
# definitions), not Azure RBAC.
iam:
  read: ["Cosmos DB Built-in Data Reader", "Cosmos DB Built-in Data Contributor"]
  write: ["Cosmos DB Built-in Data Contributor"]

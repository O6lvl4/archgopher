# Worked examples: given these values and this load, the resource reads this.
# Expected values are computed by hand from the unit prices, not taken from the engine.
# Within the free grant of the subscription: 1M executions are the first million, free;
# 1e6 × 0.25 s × 0.25 GB = 62500 GB-seconds, under the 400000 free.
- name: Consumption, 250 ms at 256 MB (japaneast)
  region: japaneast
  assumptions:
    executionMs: 250
    memoryMb: 256
  demand:
    invoke:
      monthly: 1000000.0
      peak: 10
  costs:
    Executions: 0
    Execution time: 0
  limits:
    Instances: 0.025
    Execution time limit: 0.25
# 1e5 × 0.1 s × 0.25 GB = 2500 GB-seconds and 1e5 executions, both within the free grant.
- name: short executions bill 100 ms and 128 MB steps
  region: japaneast
  assumptions:
    executionMs: 50
    memoryMb: 200
  demand:
    invoke:
      monthly: 100000.0
      peak: 1
  costs:
    Executions: 0
    Execution time: 0
  limits:
    Instances: 0.001
    Execution time limit: 0.05
- name: on a dedicated plan the plan node carries the cost
  region: japaneast
  assumptions:
    plan: dedicated
    executionMs: 250
  demand:
    invoke:
      monthly: 1000000.0
      peak: 10
  costs: {}
  limits: {}
# Past the free grant: (10e6 − 1e6) × 0.2 / 1e6 = 1.8 for executions;
# 10e6 × 1 s × 0.5 GB = 5e6 GB-seconds, (5e6 − 400000) × 0.000016 = 73.6.
- name: past the free grant (japaneast)
  region: japaneast
  assumptions:
    executionMs: 1000
    memoryMb: 512
  demand:
    invoke:
      monthly: 10000000.0
      peak: 40
  costs:
    Executions: 1.8
    Execution time: 73.6
  limits:
    Instances: 0.4
    Execution time limit: 1.0

# Worked examples: given these values and this load, the resource reads this.
# Expected values are computed by hand from the unit prices, not taken from the engine.
- name: two sources, three destinations, one configuration (japaneast)
  region: japaneast
  attributes:
    sources: [vm-a, vm-b]
    destinations: [web, api, db]
    configurations: [tcp]
  demand:
    test:
      monthly: 0
      peak: 0
  # 2 × 3 × 1 = 6 tests, within the 10 free
  costs:
    Tests: 0
- name: 300,000 tests across other groups (eastus)
  region: eastus
  assumptions:
    otherTests: 300000
  demand:
    test:
      monthly: 0
      peak: 0
  # Tier by tier: the first 10 free; (240,010 − 10) × $0.30 = 72000;
  # (300,000 − 240,010) × $0.09999 = 5998.4001; together 77998.4001
  costs:
    Tests: 77998.4001
- name: disabled first group (eastus)
  region: eastus
  attributes:
    group_enabled: false
    sources: [vm-a]
    destinations: [web]
    configurations: [tcp]
  demand:
    test:
      monthly: 0
      peak: 0
  costs:
    Tests: 0

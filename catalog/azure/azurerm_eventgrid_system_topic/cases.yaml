# Worked examples: given these values and this load, the resource reads this.
# Expected values are computed by hand from the unit prices, not taken from the engine.
- name: storage events to one subscription in Japan East
  region: japaneast
  demand:
    publish:
      monthly: 1000000.0
      peak: 10
  costs:
    # 1e6 events published and delivered once = 2e6 operations × 0.6 / 1e6 = 1.2
    Operations: 1.2
- name: 100 KB events to three subscriptions in East US
  region: eastus
  assumptions:
    eventKb: 100
    subscriptionsPerEvent: 3
  demand:
    publish:
      monthly: 1000000.0
      peak: 10
  costs:
    # 2 chunks of 64 KB × (1 + 3) × 1e6 = 8e6 operations × 0.6 / 1e6 = 4.8
    Operations: 4.8

# Worked examples: given these values and this load, the resource reads this.
# Expected values are computed by hand from the unit prices, not taken from the engine.
- name: two scale units, 10 million requests of 4 KB (japaneast)
  region: japaneast
  attributes:
    scale_unit: 2
  assumptions:
    kbPerUnit: 4
  demand:
    traffic:
      monthly: 1e+07
      peak: 100
  # 2 × 730 h × $0.361; 100/s × 4 KB × 8 bit against 2 × 0.5 Gbps
  costs:
    Scale unit hours: 527.06
  limits:
    Throughput: 0.0030517578125
- name: one scale unit, idle (eastus)
  region: eastus
  demand:
    traffic:
      monthly: 0
      peak: 0
  costs:
    Scale unit hours: 263.53
  limits:
    Throughput: 0

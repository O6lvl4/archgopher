type: azurerm_public_ip
label: Public IP address
category: Network
icon: public-ip
description: "The IPv4 address, billed per hour whether it is attached or idle: Standard static in the regional or global tier, or Basic static or dynamic (dynamic addresses are always Basic; Basic was retired on 30 September 2025). Transfer out to the internet is billed where the traffic leaves, not here. IPv6 and StandardV2 addresses are not priced yet (the price list has no meter for them)."
kinds: [traffic]
sla: azure.publicip
attributes:
  - { key: sku, label: SKU, type: choice, options: [Standard, StandardV2, Basic], default: Standard }
  - { key: sku_tier, label: Tier, type: choice, options: [Regional, Global], default: Regional }
  - { key: allocation_method, label: Allocation, type: choice, options: [Static, Dynamic], default: Static }
  - { key: ip_version, label: IP version, type: choice, options: [IPv4, IPv6], default: IPv4 }
let:
  - basic: 'sku == "Basic" || allocation_method == "Dynamic"'
  - meter: 'basic ? "basic." + lower(allocation_method) : sku_tier == "Global" ? "global.static" : "standard.static"'
readings:
  - fail: { when: 'ip_version == "IPv6"', message: "IPv6 public addresses are not priced yet" }
  - fail: { when: 'sku == "StandardV2"', message: "StandardV2 public addresses have no meter in the Azure price list yet" }
  - cost: { name: 'IP address ({lower(allocation_method)}, {basic ? "basic" : lower(sku_tier)})', quantity: 730, unit: hour, price: "azure.publicip.{meter}" }
terraform:
  # Load balancers, gateways and NICs name the address; it calls nothing, and nothing calls it.
  passive: true
  mentioned: true

# Worked examples: given these values and this load, the resource reads this.
# Expected values are computed by hand from the unit prices, not taken from the engine.
- name: Basic host with 50 GB out and 10 RDP sessions (japaneast)
  region: japaneast
  assumptions: { gbOutPerMonth: 50, peakSessions: 10 }
  # 730 × $0.19; (50 − 5 free) GB × $0.12 = 5.4
  costs:
    Host hours: 138.7
    Data out: 5.4
  limits:
    Concurrent sessions: 10
- name: Standard host with 4 instances and 100 SSH sessions (eastus)
  region: eastus
  attributes: { sku: Standard, scale_units: 4 }
  assumptions: { gbOutPerMonth: 100, peakSessions: 100, protocol: SSH }
  # 730 × $0.29; 730 × 2 extra × $0.14; (100 − 5 free) GB × $0.087 = 8.265; capacity 4 × 40 sessions
  costs:
    Host hours: 211.7
    Additional instances: 204.4
    Data out: 8.265
  limits:
    Concurrent sessions: 100
- name: Basic host sending 60,000 GB out, past two volume tiers (eastus)
  region: eastus
  assumptions: { gbOutPerMonth: 60000, peakSessions: 10 }
  # 730 × $0.19; data out tier by tier: the first 5 GB free; (10240 − 5) × 0.087 = 890.445;
  # 40960 × 0.082998 = 3399.59808; (60000 − 51200) × 0.07 = 616; together 4906.04308
  costs:
    Host hours: 138.7
    Data out: 4906.04308
  limits:
    Concurrent sessions: 10
- name: Developer SKU is free (japaneast)
  region: japaneast
  attributes: { sku: Developer }

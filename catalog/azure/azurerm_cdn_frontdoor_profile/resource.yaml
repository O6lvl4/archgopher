type: azurerm_cdn_frontdoor_profile
label: Front Door
category: Edge
icon: front-door
description: "Standard or Premium profile: the monthly base fee, requests and data transfer to clients by volume tier, priced by the billing zone of the edge that serves the viewers (by default the zone of the region). Transfer from the edge to the origin and the free tier are not read."
kinds: [request]
sla: azure.frontdoor
attributes:
  - { key: sku_name, label: Tier, type: choice, options: [Standard_AzureFrontDoor, Premium_AzureFrontDoor], default: Standard_AzureFrontDoor }
assumptions:
  - { key: responseKb, label: Response size, type: number, unit: KB, hint: "After compression; cached responses count too" }
  - { key: viewers, label: Viewers in, type: choice, options: [region, na_eu, asia, south_america, australia, india], default: region, hint: "Billing zone of most viewers: North America, Europe, Middle East and Africa; Asia Pacific including Japan; South America; Australia; India" }
let:
  - s: 'sku_name == "Premium_AzureFrontDoor" ? "premium" : "standard"'
  - zone: >-
      viewers == "na_eu" ? "zone1" :
      viewers == "asia" ? "zone2" :
      viewers == "south_america" ? "zone3" :
      viewers == "australia" ? "zone4" :
      viewers == "india" ? "zone5" :
      region in ["japaneast", "japanwest", "koreacentral", "koreasouth", "southeastasia", "eastasia"] ? "zone2" :
      region startsWith "brazil" ? "zone3" :
      region startsWith "australia" ? "zone4" :
      region in ["centralindia", "southindia", "westindia", "jioindiawest", "jioindiacentral"] ? "zone5" : "zone1"
  - gb: total.monthly * responseKb / 1024 / 1024
  - req: total.monthly
  - t: '"azure.frontdoor." + s + "." + zone + ".transfer_out."'
  - r: '"azure.frontdoor." + s + "." + zone + ".requests."'
readings:
  - cost: { name: Base fee, quantity: 1, unit: month, price: "azure.frontdoor.{s}.base" }
  - requests: { name: Requests (first 250 million), price: "{r}0", count: 'min(req, 250000000)' }
  - requests: { when: req > 250000000, name: Requests (next 750 million), price: "{r}25000", count: 'min(req, 1000000000) - 250000000' }
  - requests: { when: req > 1000000000, name: Requests (next 4 billion), price: "{r}100000", count: 'min(req, 5000000000) - 1000000000' }
  - requests: { when: req > 5000000000, name: Requests (over 5 billion), price: "{r}500000", count: req - 5000000000 }
  - cost: { name: Transfer to clients (first 10 TB), quantity: 'min(gb, 10000)', unit: GB, price: "{t}0" }
  - cost: { when: gb > 10000, name: Transfer to clients (next 40 TB), quantity: 'min(gb, 50000) - 10000', unit: GB, price: "{t}10000" }
  - cost: { when: gb > 50000, name: Transfer to clients (next 100 TB), quantity: 'min(gb, 150000) - 50000', unit: GB, price: "{t}50000" }
  - cost: { when: gb > 150000, name: Transfer to clients (next 350 TB), quantity: 'min(gb, 500000) - 150000', unit: GB, price: "{t}150000" }
  - cost: { when: gb > 500000, name: Transfer to clients (next 500 TB), quantity: 'min(gb, 1000000) - 500000', unit: GB, price: "{t}500000" }
  - cost: { when: gb > 1000000, name: Transfer to clients (next 4 PB), quantity: 'min(gb, 5000000) - 1000000', unit: GB, price: "{t}1000000" }
  - cost: { when: gb > 5000000, name: Transfer to clients (over 5 PB), quantity: gb - 5000000, unit: GB, price: "{t}5000000" }
terraform:
  frontDoor: true
  mentioned: true
  aliases:
    azurerm_cdn_frontdoor_endpoint: cdn_frontdoor_profile_id
    azurerm_cdn_frontdoor_origin_group: cdn_frontdoor_profile_id
    azurerm_cdn_frontdoor_origin: cdn_frontdoor_origin_group_id
    azurerm_cdn_frontdoor_route: cdn_frontdoor_endpoint_id
    azurerm_cdn_frontdoor_rule_set: cdn_frontdoor_profile_id
    azurerm_cdn_frontdoor_rule: cdn_frontdoor_rule_set_id
    azurerm_cdn_frontdoor_custom_domain: cdn_frontdoor_profile_id
    azurerm_cdn_frontdoor_security_policy: cdn_frontdoor_profile_id
  links:
    - { type: azurerm_cdn_frontdoor_origin, from: cdn_frontdoor_origin_group_id, to: [host_name, origin_host_header, private_link.private_link_target_id] }
  ignoreRefs: [identity]

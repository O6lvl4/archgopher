type: azurerm_container_app
label: Container app
category: Compute
icon: container-apps
description: "Consumption profile: requests, active vCPU and memory seconds while replicas serve requests, and idle rates for the minimum replicas the rest of the time. Memory is twice the vCPUs, as the Consumption profile pairs them. The monthly free grant (2 million requests, 180,000 vCPU-seconds and 360,000 GiB-seconds, active and idle together) is given once over every container app of the account. Headroom is replicas against max_replicas."
kinds: [request]
sla: azure.containerapps
attributes:
  - { key: cpu, label: vCPU per replica, type: number, default: 0.5, path: template.container.cpu }
  - { key: min_replicas, label: Minimum replicas, type: number, default: 0, path: template.min_replicas }
  - { key: max_replicas, label: Maximum replicas, type: number, default: 10, path: template.max_replicas }
assumptions:
  - { key: requestMs, label: Request time, type: number, unit: ms }
  - { key: concurrentRequests, label: Requests per replica, type: number, default: 10, hint: "The HTTP scale rule adds a replica per 10 concurrent requests by default" }
let:
  - memGi: cpu * 2
  - activeSeconds: total.monthly * requestMs / 1000 / concurrentRequests
  - idleSeconds: max(min_replicas * 730 * 3600 - activeSeconds, 0)
readings:
  - requests: { name: Requests, count: total.monthly, price: azure.containerapps.requests }
  - cost: { name: Active vCPU, quantity: activeSeconds * cpu, unit: vCPU-second, price: azure.containerapps.vcpu_active }
  - cost: { name: Active memory, quantity: activeSeconds * memGi, unit: GiB-second, price: azure.containerapps.memory_active }
  - cost: { when: min_replicas > 0, name: Idle vCPU, quantity: idleSeconds * cpu, unit: vCPU-second, price: azure.containerapps.vcpu_idle }
  - cost: { when: min_replicas > 0, name: Idle memory, quantity: idleSeconds * memGi, unit: GiB-second, price: azure.containerapps.memory_idle }
  - limit: { name: Replicas, demand: total.peak * requestMs / 1000 / concurrentRequests, unit: replicas, quota: azure.containerapps.max_replicas, capacity: max_replicas }
terraform:
  frontDoor: true
  ignoreRefs: [identity, secret, registry, container_app_environment_id]

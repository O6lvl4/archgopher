# Worked examples: given these values and this load, the resource reads this.
# Expected values are computed by hand from the unit prices, not taken from the engine.
- name: scale to zero, 0.5 vCPU
  region: japaneast
  assumptions:
    requestMs: 200
  demand:
    request:
      monthly: 1000000.0
      peak: 5
  # 1e6 requests × 0.4 / 1e6 = 0.4; 1e6 × 0.2 s / 10 = 20000 active seconds:
  # 10000 vCPU-seconds × 0.000024 = 0.24 and 20000 GiB-seconds × 0.000003 = 0.06.
  costs:
    Requests: 0.4
    Active vCPU: 0.24
    Active memory: 0.06
  limits:
    Replicas: 0.1
- name: one warm replica of 1 vCPU
  region: japaneast
  attributes:
    cpu: 1
    min_replicas: 1
  assumptions:
    requestMs: 200
  demand:
    request:
      monthly: 1000000.0
      peak: 5
  # 1e6 requests × 0.4 / 1e6 = 0.4. 20000 active seconds; idle 730 × 3600 − 20000 = 2608000.
  # vCPU-seconds: active 20000 × 0.000024 = 0.48; idle 2608000 × 0.000003 = 7.824.
  # GiB-seconds: active 40000 × 0.000003 = 0.12; idle 5216000 × 0.000003 = 15.648.
  costs:
    Requests: 0.4
    Active vCPU: 0.48
    Active memory: 0.12
    Idle vCPU: 7.824
    Idle memory: 15.648
  limits:
    Replicas: 0.1

# Worked examples: given these values and this load, the resource reads this.
# Expected values are computed by hand from the unit prices, not taken from the engine.
- name: VpnGw1 to on-premises, 10 million requests of 4 KB (japaneast)
  region: japaneast
  attributes:
    sku: VpnGw1
  assumptions:
    kbPerUnit: 4
  demand:
    traffic:
      monthly: 1e+07
      peak: 100
  # 730 h × $0.19; 1e7 × 4 KB = 38.14697265625 GB internet out, within the 100 GB a month free; 100/s × 4 KB × 8 bit
  costs:
    Gateway hours (VpnGw1): 138.7
    Data sent out: 0
  limits:
    Throughput: 0.0030517578125
    Point-to-site connections: 0
- name: VpnGw2AZ Generation2 to another VNet with 200 users (eastus)
  region: eastus
  attributes:
    sku: VpnGw2AZ
    generation: Generation2
  assumptions:
    peer: vnet
    gbPerMonth: 100
    p2sConnections: 200
  demand:
    traffic:
      monthly: 0
      peak: 0
  # 730 h × $0.54; (200 − 128) × 730 h × $0.01; 100 GB × $0.035 zone 1 inter-VNet
  costs:
    Gateway hours (VpnGw2AZ): 394.2
    Point-to-site connections beyond 128: 525.6
    Data sent out: 3.5
  limits:
    Throughput: 0
    Point-to-site connections: 200

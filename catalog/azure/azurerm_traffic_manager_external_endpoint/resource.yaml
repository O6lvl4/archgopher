type: azurerm_traffic_manager_external_endpoint
label: Traffic Manager external endpoint
category: Edge
icon: traffic-manager
description: "Health checks of an address outside Azure (target) per month, with the fast interval and HTTPS add-ons when the profile's monitor asks for them. A disabled endpoint is not probed. Nothing calls an endpoint: clients reach its target directly."
kinds: [probe]
attributes:
  - { key: enabled, label: Enabled, type: boolean, default: true }
assumptions:
  - { key: fastInterval, label: Fast interval health checks, type: boolean, default: false, hint: "True when the profile's monitor_config interval_in_seconds is 10" }
  - { key: https, label: HTTPS health checks, type: boolean, default: false, hint: "True when the profile's monitor_config protocol is HTTPS" }
readings:
  - cost: { when: enabled, name: Health checks, quantity: 1, unit: endpoint-month, price: azure.trafficmanager.external.health_checks }
  - cost: { when: enabled && fastInterval, name: Fast interval health checks, quantity: 1, unit: endpoint-month, price: azure.trafficmanager.external.fast_interval }
  - cost: { when: enabled && https, name: HTTPS health checks, quantity: 1, unit: endpoint-month, price: azure.trafficmanager.external.https }
terraform:
  # An endpoint names its profile and its target; neither is a call.
  passive: true

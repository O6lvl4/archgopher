type: azurerm_virtual_machine
label: Virtual machine (legacy)
category: Compute
icon: virtual-machine
description: "The legacy VM resource: pay-as-you-go instance hours by size, Linux or Windows (a Windows image, os_type or os_profile_windows_config; Azure Hybrid Benefit with license_type pays the base rate), the managed OS disk's tier and the inline data disks' tiers (with operations on Standard HDD and SSD), and the Ultra Disk reservation. Unmanaged (VHD) disks are billed on their storage account. Spot and reserved prices are not read."
kinds: [request]
sla: azure.vm
attributes:
  - { key: vm_size, label: Size, type: string, hint: "A VM size such as Standard_D2s_v5" }
  - { key: license_type, label: License type, type: string, optional: true, hint: "Windows_Server or Windows_Client brings your own license (Azure Hybrid Benefit)" }
  - { key: os_type, label: OS type, type: string, optional: true, path: storage_os_disk.os_type }
  - { key: image_offer, label: Image offer, type: string, optional: true, path: storage_image_reference.offer }
  - { key: windows_config, label: Windows configuration, type: boolean, default: false, path: os_profile_windows_config }
  - { key: os_disk_type, label: OS disk type, type: string, default: "", path: storage_os_disk.managed_disk_type, hint: "Unset for an unmanaged (VHD) disk" }
  - { key: os_disk_size_gb, label: OS disk size, type: number, unit: GiB, optional: true, path: storage_os_disk.disk_size_gb, hint: "Unset takes the image's size: 30 GiB for most Linux images, 127 GiB for Windows Server" }
  - { key: data_disk_type, label: Data disk type, type: string, default: "", path: storage_data_disk.managed_disk_type, hint: "The first storage_data_disk block" }
  - { key: data_disk_size_gb, label: Data disk size, type: number, unit: GiB, optional: true, path: storage_data_disk.disk_size_gb }
  - { key: ultra_ssd_enabled, label: Ultra Disk compatibility, type: boolean, default: false, path: additional_capabilities.ultra_ssd_enabled }
assumptions:
  - { key: monthlyHours, label: Hours running, type: number, unit: hours, default: 730, hint: "Hours a month the VM is allocated; a deallocated VM pays only for its disks" }
  - { key: dataDisks, label: Data disks, type: number, default: 1, hint: "storage_data_disk blocks of the first block's type and size; the import reads the first block only" }
  - { key: osDiskOpsPerMonth, label: OS disk operations, type: number, default: 0, hint: "Per month; Standard HDD and SSD bill every 10,000" }
  - { key: dataDiskOpsPerMonth, label: Data disk operations, type: number, default: 0, hint: "Per month across the data disks; Standard HDD and SSD bill every 10,000" }
  - { key: ultraReservedVcpus, label: vCPUs reserved for Ultra Disk, type: number, default: 0, hint: "The size's vCPUs, while Ultra Disk compatibility is on and no Ultra Disk is attached" }
let:
  - windows: 'windows_config || (os_type != nil && lower(os_type) == "windows") || (image_offer != nil && lower(image_offer) == "windowsserver")'
  - hybrid: 'windows && license_type != nil && license_type in ["Windows_Server", "Windows_Client"]'
  - os: 'windows && !hybrid ? "windows" : "linux"'
  - dtype: os_disk_type
  - dsize: 'os_disk_size_gb != nil ? os_disk_size_gb : windows ? 127.0 : 30.0'
  - dclass: 'dtype startsWith "StandardSSD" ? "E" : dtype startsWith "Standard_" ? "S" : dtype startsWith "Premium_" ? "P" : dtype == "" ? "none" : "unread"'
  - dred: 'dtype endsWith "ZRS" ? "zrs" : "lrs"'
  - dnum: 'dsize <= 4 ? 1 : dsize <= 8 ? 2 : dsize <= 16 ? 3 : dsize <= 32 ? 4 : dsize <= 64 ? 6 : dsize <= 128 ? 10 : dsize <= 256 ? 15 : dsize <= 512 ? 20 : dsize <= 1024 ? 30 : dsize <= 2048 ? 40 : dsize <= 4096 ? 50 : dsize <= 8192 ? 60 : dsize <= 16384 ? 70 : 80'
  - dtier: 'dclass + string(dclass == "S" ? max(dnum, 4) : dnum)'
  - xtype: data_disk_type
  - xsize: 'data_disk_size_gb != nil ? data_disk_size_gb : 0.0'
  - xclass: 'xtype startsWith "StandardSSD" ? "E" : xtype startsWith "Standard_" ? "S" : xtype startsWith "Premium_" ? "P" : xtype == "" ? "none" : "unread"'
  - xred: 'xtype endsWith "ZRS" ? "zrs" : "lrs"'
  - xnum: 'xsize <= 4 ? 1 : xsize <= 8 ? 2 : xsize <= 16 ? 3 : xsize <= 32 ? 4 : xsize <= 64 ? 6 : xsize <= 128 ? 10 : xsize <= 256 ? 15 : xsize <= 512 ? 20 : xsize <= 1024 ? 30 : xsize <= 2048 ? 40 : xsize <= 4096 ? 50 : xsize <= 8192 ? 60 : xsize <= 16384 ? 70 : 80'
  - xtier: 'xclass + string(xclass == "S" ? max(xnum, 4) : xnum)'
readings:
  - fail: { when: 'dclass == "unread" || xclass == "unread"', message: "only Standard HDD, Standard SSD and Premium SSD inline disks are read: model Ultra and Premium SSD v2 disks as azurerm_managed_disk", continue: true }
  - cost: { name: '{os == "windows" ? "Instance hours (Windows)" : hybrid ? "Instance hours (Hybrid Benefit)" : "Instance hours"}', quantity: monthlyHours, unit: instance-hour, price: "azure.vm.{os}.{vm_size}" }
  - cost: { when: 'dclass in ["S", "E", "P"]', name: "OS disk ({dtier} {upper(dred)})", quantity: 1, unit: disk-month, price: "azure.disk.{dred}.{dtier}" }
  - cost: { when: 'dclass in ["S", "E"] && osDiskOpsPerMonth > 0', name: OS disk operations, quantity: osDiskOpsPerMonth, unit: operation, price: '{dclass == "S" ? "azure.disk.operations.standard_hdd_" : "azure.disk.operations.standard_ssd_"}{dred}' }
  - fail: { when: 'xclass in ["S", "E", "P"] && xsize <= 0', message: "the data disk has no disk_size_gb" }
  - cost: { when: 'xclass in ["S", "E", "P"]', name: "Data disks ({xtier} {upper(xred)})", quantity: dataDisks, unit: disk-month, price: "azure.disk.{xred}.{xtier}" }
  - cost: { when: 'xclass in ["S", "E"] && dataDiskOpsPerMonth > 0', name: Data disk operations, quantity: dataDiskOpsPerMonth, unit: operation, price: '{xclass == "S" ? "azure.disk.operations.standard_hdd_" : "azure.disk.operations.standard_ssd_"}{xred}' }
  - cost: { when: ultra_ssd_enabled, name: Ultra Disk reservation, quantity: 730 * ultraReservedVcpus, unit: vCPU-hour, price: azure.disk.ultra.vcpu_reservation }
terraform:
  ignoreRefs: [network_interface_ids, primary_network_interface_id, availability_set_id, proximity_placement_group_id, storage_os_disk, storage_data_disk, storage_image_reference, identity, os_profile, os_profile_linux_config, os_profile_secrets, os_profile_windows_config, boot_diagnostics, plan]

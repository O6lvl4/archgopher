# Worked examples: given these values and this load, the resource reads this.
# Expected values are computed by hand from the unit prices, not taken from the engine.
- name: one of the first 25 zones in Japan East, queries read on its record sets
  region: japaneast
  costs:
    Hosted zone: 0.5
# A zone read alone is the subscription's only private zone, so it is one of the first 25:
# the lower price from the 26th zone needs other zones in the same declaration.
- name: zone in West US 2 with queries drawn to the zone
  region: westus2
  demand:
    query:
      monthly: 10000000.0
      peak: 5
  costs:
    DNS queries: 4
    Hosted zone: 0.5

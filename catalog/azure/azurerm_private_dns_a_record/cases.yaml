# Worked examples: given these values and this load, the resource reads this.
# Expected values are computed by hand from the unit prices, not taken from the engine.
- name: record set queried by drawn load in Japan East
  region: japaneast
  demand:
    query:
      monthly: 50000000.0
      peak: 20
  costs:
    DNS queries: 20
- name: record set with lookups not drawn as load in East US
  region: eastus
  assumptions:
    queriesPerMonth: 2500000
  demand:
    query:
      monthly: 500000.0
      peak: 1
  costs:
    DNS queries: 1.2

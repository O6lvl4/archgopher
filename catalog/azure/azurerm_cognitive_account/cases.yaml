# Worked examples: given these values and this load, the resource reads this.
# Expected values are computed by hand from the unit prices, not taken from the engine.
- name: Speech to text and neural voices per call in Japan East
  region: japaneast
  assumptions: { audioSecondsPerCall: 60, charactersPerCall: 200 }
  demand: { call: { monthly: 10000, peak: 2 } }
  costs:
    Speech to text: 166.666666667
    Neural text to speech: 30
  limits:
    Concurrent real-time transcriptions: 120
    Text to speech transactions: 2

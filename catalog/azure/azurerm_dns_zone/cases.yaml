# Worked examples: given these values and this load, the resource reads this.
# Expected values are computed by hand from the unit prices, not taken from the engine.
- name: one of the first 25 zones in Japan East
  region: japaneast
  assumptions:
    recordSets: 40
  demand:
    zone:
      monthly: 0
      peak: 0
  costs:
    Hosted zone: 0.5
  limits:
    Record sets: 40
# A zone read alone is the subscription's only zone, so it is one of the first 25:
# the lower price from the 26th zone needs other zones in the same declaration.
- name: a large zone in East US
  region: eastus
  assumptions:
    recordSets: 12000
  demand:
    zone:
      monthly: 0
      peak: 0
  costs:
    Hosted zone: 0.5
    # (12,000 − 10,000) × $0.0015
    Record sets beyond 10000: 3
  limits:
    Record sets: 12000

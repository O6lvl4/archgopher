type: azurerm_traffic_manager_profile
label: Traffic Manager profile
category: Edge
icon: traffic-manager
description: "DNS queries answered by the profile, with the lower price beyond 1 billion a month counted over every profile of the region, and Traffic View data points when Traffic View is on. A disabled profile answers nothing and costs nothing. Health checks are read on the endpoints. Resolvers cache answers for the profile's TTL, so queries are far fewer than requests: give them as queriesPerMonth or draw load to the profile. The profile answers where to connect and passes no load on."
kinds: [query]
sla: azure.trafficmanager
attributes:
  - { key: profile_status, label: Status, type: choice, options: [Enabled, Disabled], default: Enabled }
  - { key: traffic_view_enabled, label: Traffic View, type: boolean, default: false }
assumptions:
  - { key: queriesPerMonth, label: Queries per month, type: number, default: 0, hint: "Queries not drawn as load; the QueriesByEndpointReturned metric tells" }
  - { key: trafficViewDataPoints, label: Traffic View data points per month, type: number, default: 0, hint: "One per source network and endpoint region pair seen in a query, counted over the month" }
let:
  - on: 'profile_status == "Enabled"'
  - queries: total.monthly + queriesPerMonth
readings:
  - requests: { when: on, name: Queries, count: queries, unit: query, price: azure.trafficmanager.queries }
  - cost: { when: on && traffic_view_enabled, name: Traffic View, quantity: trafficViewDataPoints, unit: data point, price: azure.trafficmanager.traffic_view }
terraform:
  # Endpoints name the profile; none of them calls it.
  mentioned: true
  passive: true

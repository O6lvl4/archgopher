type: azurerm_dns_cname_record
label: DNS CNAME record
category: Edge
icon: dns-zones
description: "Queries answered for the CNAME record set in a public Azure DNS zone, with the lower price beyond 1 billion a month, counted over every public zone query of the subscription. Resolvers cache answers for the TTL, so queries are far fewer than requests: give them as queriesPerMonth or draw load to the record. A record answers where to connect and passes no load on."
kinds: [query]
sla: azure.dns
assumptions:
  - { key: queriesPerMonth, label: Queries per month, type: number, default: 0, hint: "Queries not drawn as load; the QueryVolume metric of the zone tells" }
let:
  - queries: total.monthly + queriesPerMonth
readings:
  - requests: { name: Queries, count: queries, unit: query, price: azure.dns.queries }
terraform:
  # A record names its zone and the resource it points at; neither is a call.
  passive: true

type: azurerm_windows_virtual_machine
label: Windows virtual machine
category: Compute
icon: virtual-machine
description: "Pay-as-you-go instance hours by size with the Windows license, or at the base (Linux) rate with Azure Hybrid Benefit (license_type), the OS disk's tier (and its operations on Standard HDD and SSD), and the Ultra Disk reservation while Ultra Disk compatibility is on without an Ultra Disk attached. Data disks are azurerm_managed_disk nodes. Spot, Low Priority and reserved prices are not read."
kinds: [request]
sla: azure.vm
attributes:
  - { key: size, label: Size, type: string, hint: "A VM size such as Standard_D2s_v5" }
  - { key: license_type, label: License type, type: string, optional: true, hint: "Windows_Server or Windows_Client brings your own license (Azure Hybrid Benefit)" }
  - { key: os_disk_type, label: OS disk type, type: choice, options: [Standard_LRS, StandardSSD_LRS, StandardSSD_ZRS, Premium_LRS, Premium_ZRS], path: os_disk.storage_account_type }
  - { key: os_disk_size_gb, label: OS disk size, type: number, unit: GiB, optional: true, path: os_disk.disk_size_gb, hint: "Unset takes the image's size, 127 GiB for Windows Server images" }
  - { key: ultra_ssd_enabled, label: Ultra Disk compatibility, type: boolean, default: false, path: additional_capabilities.ultra_ssd_enabled }
assumptions:
  - { key: monthlyHours, label: Hours running, type: number, unit: hours, default: 730, hint: "Hours a month the VM is allocated; a deallocated VM pays only for its disks" }
  - { key: osDiskOpsPerMonth, label: OS disk operations, type: number, default: 0, hint: "Per month; Standard HDD and SSD bill every 10,000" }
  - { key: ultraReservedVcpus, label: vCPUs reserved for Ultra Disk, type: number, default: 0, hint: "The size's vCPUs, while Ultra Disk compatibility is on and no Ultra Disk is attached" }
let:
  - hybrid: 'license_type != nil && license_type in ["Windows_Server", "Windows_Client"]'
  - os: 'hybrid ? "linux" : "windows"'
  - dtype: os_disk_type
  - dsize: 'os_disk_size_gb != nil ? os_disk_size_gb : 127.0'
  - dclass: 'dtype startsWith "StandardSSD" ? "E" : dtype startsWith "Standard_" ? "S" : "P"'
  - dred: 'dtype endsWith "ZRS" ? "zrs" : "lrs"'
  - dnum: 'dsize <= 4 ? 1 : dsize <= 8 ? 2 : dsize <= 16 ? 3 : dsize <= 32 ? 4 : dsize <= 64 ? 6 : dsize <= 128 ? 10 : dsize <= 256 ? 15 : dsize <= 512 ? 20 : dsize <= 1024 ? 30 : dsize <= 2048 ? 40 : dsize <= 4096 ? 50 : dsize <= 8192 ? 60 : dsize <= 16384 ? 70 : 80'
  - dtier: 'dclass + string(dclass == "S" ? max(dnum, 4) : dnum)'
readings:
  - cost: { name: '{hybrid ? "Instance hours (Hybrid Benefit)" : "Instance hours"}', quantity: monthlyHours, unit: instance-hour, price: "azure.vm.{os}.{size}" }
  - cost: { name: "OS disk ({dtier} {upper(dred)})", quantity: 1, unit: disk-month, price: "azure.disk.{dred}.{dtier}" }
  - cost: { when: 'dclass != "P" && osDiskOpsPerMonth > 0', name: OS disk operations, quantity: osDiskOpsPerMonth, unit: operation, price: '{dclass == "S" ? "azure.disk.operations.standard_hdd_" : "azure.disk.operations.standard_ssd_"}{dred}' }
  - cost: { when: ultra_ssd_enabled, name: Ultra Disk reservation, quantity: 730 * ultraReservedVcpus, unit: vCPU-hour, price: azure.disk.ultra.vcpu_reservation }
terraform:
  ignoreRefs: [network_interface_ids, availability_set_id, proximity_placement_group_id, dedicated_host_id, dedicated_host_group_id, capacity_reservation_group_id, virtual_machine_scale_set_id, source_image_id, os_disk, identity, secret, boot_diagnostics, gallery_application, os_image_notification, additional_unattend_content, winrm_listener]

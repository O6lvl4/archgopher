# Worked examples: given these values and this load, the resource reads this.
# Expected values are computed by hand from the unit prices, not taken from the engine.
- name: Business Critical Gen5 8 vCores in Japan East
  region: japaneast
  attributes:
    sku_name: BC_Gen5
    vcores: 8
  assumptions:
    ltrGb: 100
  demand:
    query:
      monthly: 10000000.0
      peak: 100
  costs:
    Compute: 2009.03008
    SQL license: 2190
    Storage: 0
    Point-in-time backup storage: 0
    Long-term retention storage: 6
  limits:
    Concurrent workers: 2
- name: General Purpose Gen5 4 vCores with Azure Hybrid Benefit in East US
  region: eastus
  attributes:
    license_type: BasePrice
    storage_size_in_gb: 64
  demand:
    query:
      monthly: 1000000.0
      peak: 10
  costs:
    Compute: 444.47656
    Storage: 3.68
    Point-in-time backup storage: 0
    Long-term retention storage: 0
  limits:
    Concurrent workers: 0.2

# Worked examples: given these values and this load, the resource reads this.
# Expected values are computed by hand from the unit prices, not taken from the engine.
- name: 10 million requests of 4 KB (japaneast)
  region: japaneast
  assumptions: { kbPerUnit: 4 }
  demand: { traffic: { monthly: 1e+07, peak: 100 } }
  # 730 h × $0.045; 38.14697265625 GB × $0.045; 100/s × 4 KB × 8 bit = 0.0030517578125 Gbps
  costs:
    Gateway hours: 32.85
    Data processed: 1.71661376953125
  limits:
    Bandwidth: 0.0030517578125
- name: idle StandardV2 gateway with 20 GB of downloads (eastus)
  region: eastus
  attributes: { sku_name: StandardV2 }
  assumptions: { gbPerMonth: 20 }
  costs:
    Gateway hours: 32.85
    Data processed: 0.9
  limits:
    Bandwidth: 0
- name: load passes through without a size (eastus)
  region: eastus
  demand: { traffic: { monthly: 1000, peak: 1 } }
  error: "load passes through this NAT gateway: set kbPerUnit"

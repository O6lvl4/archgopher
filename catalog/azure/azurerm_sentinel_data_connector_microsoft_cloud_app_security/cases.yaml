# Worked examples: given these values and this load, the resource reads this.
# Expected values are computed by hand from the unit prices, not taken from the engine.
- name: discovery logs in Japan East
  region: japaneast
  assumptions:
    discoveryGb: 12
  demand:
    ingest:
      monthly: 0
      peak: 0
  costs:
    Sentinel data ingestion: 74.88
- name: alerts only (West US 2)
  assumptions:
    discoveryGb: 12
  region: westus2
  attributes:
    discovery_logs_enabled: false
  demand:
    ingest:
      monthly: 0
      peak: 0
  costs:
    Sentinel data ingestion: 0

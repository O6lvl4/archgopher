type: azurerm_monitor_scheduled_query_rules_alert
label: Log alert (legacy)
category: Monitoring
icon: alerts
description: "A monthly cost per rule by how often it runs its query: every 1, 5, 10 or 15 minutes or slower, priced at the next faster step. The legacy rule monitors one time series. Load does not flow through an alert."
kinds: [alarm]
sla: azure.monitor
attributes:
  - { key: enabled, label: Enabled, type: boolean, default: true }
  - { key: frequency, label: Evaluation frequency, type: number, unit: minutes, default: 5 }
let:
  - step: 'frequency >= 15 ? 15 : frequency >= 10 ? 10 : frequency >= 5 ? 5 : 1'
readings:
  - cost: { when: enabled, name: "Log alert rule ({step}-minute frequency)", quantity: 1, unit: rule-month, price: "azure.monitor.alerts.log_rule.{step}" }
terraform:
  # An alert names the data it queries and the action groups it fires; it calls nothing.
  passive: true

type: azurerm_data_factory
label: Data Factory
category: Integration
icon: data-factory
description: "Read/write operations on the factory's entities and monitoring operations on its run records, per 50,000, and pipelines left a whole month without a run. Activity runs, data movement and data flows are billed on the integration runtime that runs them (azurerm_data_factory_integration_runtime_* nodes). Headroom is concurrent pipeline runs against the 10,000 a factory allows."
kinds: [run]
sla: azure.datafactory
assumptions:
  - { key: readWriteEntitiesPerMonth, label: Read/write entity operations, type: number, default: 0, hint: "Per month: creating, reading, updating and deleting pipelines, datasets, triggers and linked services; a deployment touches each entity once" }
  - { key: monitoringEntitiesPerRun, label: Monitoring operations per pipeline run, type: number, default: 0, hint: "Run records retrieved for each pipeline run: the pipeline, its activities and triggers" }
  - { key: inactivePipelines, label: Inactive pipelines, type: number, default: 0, hint: "Pipelines with no run in the month" }
  - { key: pipelineRunSeconds, label: Pipeline run duration, type: number, unit: s, optional: true, hint: "Compared with the concurrent pipeline runs a factory allows" }
readings:
  - cost: { name: Read/write operations, quantity: readWriteEntitiesPerMonth, unit: entity, price: azure.datafactory.read_write }
  - cost: { name: Monitoring operations, quantity: demand.run.monthly * monitoringEntitiesPerRun, unit: entity, price: azure.datafactory.monitoring }
  - cost: { when: inactivePipelines > 0, name: Inactive pipelines, quantity: inactivePipelines, unit: pipeline-month, price: azure.datafactory.inactive_pipeline }
  - concurrency: { when: pipelineRunSeconds != nil, name: Concurrent pipeline runs, peak: demand.run.peak, seconds: "pipelineRunSeconds ?? 0", unit: runs, quota: azure.datafactory.concurrent_pipeline_runs }
terraform:
  ignoreRefs: [identity, customer_managed_key_id, customer_managed_key_identity_id, purview_id, global_parameter, github_configuration, vsts_configuration]
iam:
  run: ["Data Factory Contributor"]

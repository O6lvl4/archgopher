# Worked examples: given these values and this load, the resource reads this.
# Expected values are computed by hand from the unit prices, not taken from the engine.
- name: two routing rules in Japan East pick the Asia Pacific zone
  region: japaneast
  attributes:
    routing_rules: 2
    frontend_hosts: 1
  assumptions:
    responseKb: 50
  demand:
    request:
      monthly: 10000000.0
      peak: 100
  costs:
    Routing rules (first 5): 21.9
    Transfer from clients: 0.095367431640625
    Transfer to clients (first 10 TB): 119.20928955078125
  limits:
    Requests: 100
    Bandwidth to clients: 0.04096
    Routing rules: 2
    Frontend hosts: 1
